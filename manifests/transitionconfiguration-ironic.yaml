# Singleton Configurations for the two transition kinds: NodePower and NodeProvision.
#
# Same rationale as nodeconfiguration-ironic.yaml -- kept OUT of the per-node chart so
# rest-dynamic-controller can still resolve spec.configurationRef during the delete drain.
#
# These became MANDATORY when the apiKey security scheme was added to the OAS documents:
# oasgen marks spec.configurationRef required on every generated kind that declares a
# security scheme, so the chart's transition CRs are refused outright without it --
#   NodePower "blade01-...-power-on-from-off" is invalid: spec.configurationRef: Required value
# which surfaces as a Helm render failure on the composition, not as an auth error.
#
# No spec.configuration block here: the microversion is pinned as a static per-verb
# header on each RestDefinition instead. CORRECTED 2026-11-11: this said
# spec.configuration.header "can never work", on oasgen #304 (`header` emitted,
# `headers` read). That was true when written and is FIXED -- 0.44.0 (#304), 0.50.0
# (#305/#392), control 0.43.0 -- and MEASURED on rdc 0.54.1, where a Configuration set
# to a distinctive 1.95 reached the wire twice with 0 406s. Static headers are now the
# choice, not the only option: nothing renders this file, so a hand-applied singleton
# can be forgotten and Ironic answers a missing microversion by serving its 1.1
# minimum rather than by failing. Full run in oas/ironic-port.yaml.
---
apiVersion: baremetal.ogen.krateo.io/v1alpha1
kind: NodePowerConfiguration
metadata:
  name: ironic-endpoint
  namespace: openstack
spec:
  authentication:
    apiKey:
      header: X-Auth-Token
      tokenRef:
        name: ironic-keystone-token
        namespace: openstack
        key: token
---
apiVersion: baremetal.ogen.krateo.io/v1alpha1
kind: NodeProvisionConfiguration
metadata:
  name: ironic-endpoint
  namespace: openstack
spec:
  authentication:
    apiKey:
      header: X-Auth-Token
      tokenRef:
        name: ironic-keystone-token
        namespace: openstack
        key: token
