# RestDefinition for the Ironic provision-state action (one CR per transition).
# KOG generates a NodeProvision CRD + rest-dynamic-controller. Creating a NodeProvision CR
# fires PUT /v1/nodes/{node_id}/states/provision once (202 -> Pending guard prevents re-fire).
#
# Apply order:
#   1. kubectl create configmap ironic-provision-oas -n openstack --from-file=provision.yaml=../oas/ironic-provision.yaml
#   2. kubectl apply -f restdefinition-provision.yaml
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node-provision
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-provision-oas/provision.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: NodeProvision
    # node_id is the human-friendly id the caller sets (node name or uuid). findby never
    # matches -> first Observe -> Create (the PUT). The 202 Pending condition then makes
    # subsequent Observe report exists -> the PUT fires once. For WHY it never matches, read
    # the measured block in restdefinition-power.yaml and nothing else.
    # MECHANISM: see the measured block in restdefinition-power.yaml, which is
    # the sibling of this file and shares the shape. Summary of what was
    # measured there on 2026-11-07, against the served CRD and six live CRs:
    # the match fails on the RESPONSE side. `spec.node_id` is present AND
    # required, Ironic's /v1/nodes items carry `name` and never `node_id`, and
    # the responseTransform that oas/ironic-*.yaml documents as lifting
    # `name` -> `node_id` was never written in either file.
    #
    # A claim dated 2026-11-04 stood here saying the opposite -- that the spec
    # property was suppressed by `requestFieldMapping` (oasgen#419) and the CR
    # carried no node_id at all. That was false, and it was itself labelled a
    # correction, which is what made it convincing. Deleted rather than
    # annotated here; the power file keeps the full record of all three
    # mechanisms and why only one survived.
    #
    # NOT measured for THIS kind: there are zero live NodeProvision CRs
    # (`nodepowers` 6, `nodeprovisions` 0, as of 2026-11-07). Everything above
    # is read off the power kind and is expected to apply here by symmetry --
    # expected, not observed. Do not cite this file as live fleet behaviour.
    identifiers:
      - node_id
    additionalStatusFields:
      - uuid
      - provision_state
      - target_provision_state
    verbsDescription:
      # No `get` verb: IsResourceKnown can't build a get call -> Observe uses findby. findby
      # never matches -> ResourceExists=false on first Observe -> Create (the PUT) fires. The
      # 202 sets a Pending condition that makes later Observes report exists, so the PUT fires
      # exactly once.
      #
      # DO NOT restate the reason here. This comment said "matches on node_id, which is not a
      # field on listed nodes" -- the reason the block above corrected on 2026-11-04 and which
      # has never been the one operating. The correction lived 30 lines up and this restatement
      # survived it, so a reader landing here got the superseded version. On 2026-11-07 that
      # reader was me, and I passed it to another team as primary evidence for oasgen #485
      # before catching it. The mechanism is stated once, above; this comment states only the
      # outcome.
      - action: findby
        method: GET
        path: /v1/nodes
        # DO NOT ADD A responseTransform TO THIS findby. IT HAS BEEN ADDED AND
        # REVERTED TWICE -- 2026-11-07 (40bf2ed) and 2026-11-11 (52ebe5d) -- and
        # this warning is HERE, at the top of the verb, because the first revert
        # left its warning 59 lines further down and that did not stop the second.
        #
        # THE MECHANISM, read from rest-dynamic-controller source, not inferred:
        # this kind has no `get` and no `update`. With no `get`, IsResourceKnown
        # cannot build a get call, so Observe decides existence from findby. With
        # no `update`, a reported difference cannot drive the endpoint. So the
        # create -- PUT /v1/nodes/{node_id}/states/provision, the kind's ONLY
        # effect -- is dispatched exactly one way: Observe reporting the resource
        # ABSENT. restResources.go returns {ResourceExists: true,
        # ResourceUpToDate: true} and logs "External resource up-to-date" the
        # moment findby matches, and nothing errors anywhere.
        #
        # A findby that NEVER MATCHES is therefore this kind's operating
        # mechanism, not a defect in it. oasgen's schemaWarning says so in its
        # own last clause and it was read as a bug report:
        #
        #   identifier "node_id" is absent from the items the findby response
        #   carries ... findby can never match any item regardless of policy: it
        #   will report not-found and the reconciler acts on not-found by CREATING
        #
        # "The reconciler acts on not-found by CREATING" is the DESIRED behaviour
        # here. 52ebe5d quoted that warning, manufactured `node_id` from `.name`
        # so findby would match, and thereby made every provision transition a
        # silent no-op: deploy, undeploy, manage, provide, inspect and clean all
        # became reconcile-clean non-events, and nodes stayed at `enroll`. That is
        # the symptom this lab showed on 2026-11-11/12.
        #
        # WHY POWER CARRIES THE EQUIVALENT TRANSFORM SAFELY: it has a `get` AND an
        # `update` pointing at its own endpoint, so neither its existence verdict
        # nor its ability to act depends on findby matching. The asymmetry is
        # deliberate -- see the `update` note below for why provision must NOT
        # converge on drift.
        #
        # WHAT IT COSTS TO LEAVE THIS OFF: observability only. findby never
        # matches, so additionalStatusFields (uuid, provision_state,
        # target_provision_state) never populate on a NodeProvision CR. The charts
        # read provision_state off the BaremetalNode CR, which has a working
        # responseTransform, which is why nothing depends on this. Buying that
        # observability needs a DIFFERENT shape -- a `get` verb, so existence does
        # not depend on findby (Ironic has GET /v1/nodes/{id}/states, which this
        # OAS does not yet declare) -- not an identifier lift.
        #
        # Enforced by scripts/check-restdefinition-shape.py check F, which fails
        # on exactly this shape and carries 52ebe5d's transform as its positive
        # control.
        # include_children REMOVED 2026-11-04. It is correct and it will come
        # back, but it cannot work yet and was failing silently.
        #
        # What it was for: Ironic's node COLLECTION omits child nodes unless
        # asked. Measured: GET /v1/nodes -> 3 nodes; ?include_children=true ->
        # 17. blade01/04/05/06 are children of an enclosure and are ABSENT
        # without it, so findby is structurally blind to them.
        #
        # Why it had to go: `include_children` needs Ironic microversion >= 1.83,
        # and THIS KIND SENDS NO MICROVERSION AT ALL. BaremetalNode declares
        # `X-OpenStack-Ironic-API-Version` in its OAS and carries 1.109 on every
        # live CR; provision and power declare nothing, so Ironic negotiates its
        # minimum. Measured on a throwaway CR 2026-11-04:
        #
        #   Observe -> 406 "Request not acceptable. The minimal required API
        #                   version should be 1.83"
        #
        # Observe therefore failed on EVERY reconcile from 2026-10-30 onward --
        # before this cluster was even built -- and nothing surfaced it, because
        # no transition happened to be needed in that window.
        #
        # RESTORED 2026-11-04, together with the microversion header that makes
        # it usable: oas/ironic-provision.yaml now declares
        # `X-OpenStack-Ironic-API-Version` required with default 1.109, so every
        # generated CR is stamped with it by the apiserver and the request
        # carries a microversion that satisfies include_children's >= 1.83.
        # Verified in between: with the query removed, Observe succeeded and the
        # reconcile reached Create, where oasgen's own guard refused the
        # unresolved {node_id} -- which is the separate, upstream bug (#419).
        queries:
          - name: include_children
            value: "true"
        identifiersMatchPolicy: OR
        # The microversion, static and per-verb. BELT-AND-BRACES, not the thing
        # that makes `include_children` work -- measured here 2026-11-07 with a
        # one-variable test on this very kind, static header removed in both
        # arms, probe node_id naming no existing node:
        #
        #   spec X-OpenStack-Ironic-API-Version = "1.1"    -> findby 406
        #   spec X-OpenStack-Ironic-API-Version = "1.109"  -> findby succeeds
        #
        # So the GENERATED SPEC PROPERTY ships as a header. The CRD declares it
        # required with `default: "1.109"`, so every CR carries it unasked. The
        # 2026-11-04 406 recorded below was real and is consistent: the OAS did
        # not declare the property then, so nothing was sent and Ironic
        # negotiated its minimum. Declaring it is what fixed that; this header
        # only guarantees the version if a CR sets the property low.
        #
        # oasgen #304 concerned the CONFIGURATION-sourced header, a different path.
        # CORRECTED 2026-11-11: "really is dropped" is no longer true -- fixed in
        # 0.44.0 (#304) and 0.50.0 (#305/#392), measured working on rdc 0.54.1
        # (distinctive 1.95 on the wire, 0 406s). Still do not generalise either
        # statement to this kind: here the value ships as a GENERATED SPEC
        # PROPERTY with `default: "1.109"`, which is a third route again.
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        # NO responseTransform ON THIS VERB EITHER. The full account is at the TOP
        # of this findby block, where someone about to add one will actually read
        # it; this copy is a pointer on purpose. The 2026-11-07 attempt lifted
        # `node_id` from `name` AND `target` from `provision_state`; the
        # 2026-11-11 one re-added the first half alone. Both disable the kind.
        #
        # 1. THE IDENTIFIER LIFT DISABLES THE ONLY WORKING VERB. `create` is the
        #    sole verb here that performs PUT /v1/nodes/{node_id}/states/provision.
        #    A matching findby means ResourceExists=true on the first Observe, so
        #    `create` is never called and NO provision transition fires at all --
        #    deploy, undeploy, manage, provide, inspect and clean would all become
        #    silent no-ops. Power survives the same lift only because it has an
        #    `update` verb pointing at its endpoint; this kind deliberately does
        #    not, because a provision drift correction would redeploy a machine.
        #
        # 2. `target` AND `provision_state` ARE DIFFERENT VALUE SPACES.
        #    oas/ironic-provision.yaml:108 defines target as
        #    "manage | provide | active | deleted | inspect | rebuild | clean"
        #    -- VERBS. `provision_state` holds STATES: manageable, available,
        #    active. Only `active` coincides. The charts render six targets
        #    (active, clean, deleted, inspect, manage, provide), so five could
        #    never equal the lifted value, and with no `update` verb that phantom
        #    drift is permanent -- latching every CR non-Ready and pinning the
        #    BaremetalHost composition at Ready=false. Precisely the failure this
        #    branch had just removed from the power kind.
        #
        # So observability for THIS kind cannot be bought with an identifier
        # lift. It needs a different shape -- a `get` verb so existence does not
        # depend on findby matching, or lifting the observed state into a field
        # that is NOT the desired-state field. Neither is attempted here.
      # NO `update` VERB, ON PURPOSE -- and this is the one asymmetry with
      # restdefinition-power.yaml that must not be "fixed" for consistency.
      #
      # Power is safe to converge: a blade found off when `target` says on gets
      # powered on, and the worst case is a machine running that someone wanted
      # off. Provision is not. `target` here takes values like `active`,
      # `deleted` and `manage`, and driving to `active` from `available` is a
      # DEPLOY -- it writes an image and WIPES THE DISK. Ironic also drops a
      # node back to `available` by itself after a failed deploy (which is why
      # `last_error` is in restdefinition-node.yaml's additionalStatusFields),
      # so an automatic drift correction here would retry a destructive
      # operation precisely when it had just failed, in a loop.
      #
      # So nothing acts on drift here. And to be exact about what that costs,
      # because this comment claimed the opposite: with no responseTransform this
      # kind's findby NEVER MATCHES, so `additionalStatusFields` NEVER POPULATE --
      # provision_state, target_provision_state and uuid stay empty for the life
      # of every CR. restdefinition-power.yaml records the measurement that
      # proves it: an unmatched findby plus a `Pending` condition reports
      # up-to-date without having observed anything, 323 observes, 0 creates, no
      # status fields. /code-review caught the claim.
      #
      # So do NOT write a composition template against status.provision_state on
      # a NodeProvision CR. The charts read provision_state off the
      # BaremetalNode CR, which has a working responseTransform, and that is why
      # nothing has broken. Decided by the user 2026-11-07 when offered the
      # convergent option.
      #
      # THIS KIND OWES A DECLARATION, agreed across three repos on 2026-11-15 and
      # recorded here because the agreement otherwise lives only in a chat thread
      # that no later reader gets.
      #
      # The contract, SETTLED 2026-11-15 -- and not in the shape first recorded
      # here. The field is a per-verb DURATION, not a reason string:
      #
      #   verbsDescription:
      #     - action: update
      #       path: /v1/nodes/{uuid}/states/power
      #       method: PUT
      #       restsAtNotReady: 90s          # <- a PURE BACKEND figure
      #
      # and rdc publishes the sum in status FOR OPERATORS:
      #
      #   status:
      #     restsAtNotReadyEffective: 270s  # 90s declared + this deployment's 180s resync
      #
      # It is opt-in: a verb that does not declare it behaves exactly as today.
      #
      # WHO ACTS ON IT -- corrected 2026-11-15, same day, after a third relay.
      # rdc ENFORCES the bound itself: Ready=False/Pending within it, and a
      # distinct reason past it (working name `SettleBoundExceeded`) whose message
      # names the bound. The cdc maps that REASON to stalled and reads neither a
      # RestDefinition nor a status field -- consistent with oasgen#660, where the
      # rollup reads the child's Ready reason and nothing else. An earlier relay
      # said core-provider reads `status.restsAtNotReadyEffective`; it does not,
      # and oasgen withdrew that. The status field exists for operators only.
      #
      # NOT BUILT as of 2026-11-21, and the word "RESOLVED" on the next line is a
      # COMMITMENT WITH A DATE, not a shipped behaviour. `restsAtNotReady` exists in no
      # oasgen build and `restsAtNotReadyEffective` is published by nothing -- both
      # measured, both swept with live positive controls; see the "NOT POSSIBLE YET"
      # block further down this file. 12+ tags have been cut since the date below.
      # Read the paragraph that follows as the agreed SHAPE, never as contract.
      #
      # This correction is HERE, at the line a reader arrives at, and not only in the
      # swept block 600 lines away where it was first written. A correction a reader
      # reaches after the claim has already been believed is not a correction. I gave
      # the oasgen session exactly this advice about one line in their changelog, and
      # they applied it in place while mine sat at a distance.
      #
      # RESOLVED 2026-11-15: rdc WILL PRODUCE THE REASON. Diego confirmed the shape
      # directly (asked rather than taken from the relay, for the reason the next
      # paragraph gives):
      #
      #   * this RestDefinition declares that the kind rests not-Ready;
      #   * rdc writes `Ready=False/TerminalByDesign` once the transition has been
      #     dispatched -- gated on the CREATE MARKER for the current generation,
      #     not on "Synced is clean"; see the trigger note below;
      #   * the cdc reads that reason as healthy, with the stall deadline never
      #     applying -- BUT ONLY FROM core-provider 2.13.99. Verified here at the
      #     canonical remote on 2026-11-16, no longer relayed, and the floor is a
      #     REQUIREMENT of this contract rather than a note about it.
      #
      # THE CONTRACT HAS A CORE-PROVIDER FLOOR, AND NOBODY HAD ASKED. Two repos
      # agreed on a condition and the reading of it is gated on a THIRD:
      #
      #   TerminalByDesign   enters childhealth.go at   2.13.99
      #   AssumedUpToDate    enters childhealth.go at   2.13.104   (oasgen #709)
      #   THIS LAB'S PIN                                2.13.65    below BOTH
      #
      # Control, because the first reading had the target AND the control at zero,
      # which is VOID and not a finding: childhealth.go EXISTS at 2.13.65 and
      # `childHealthy` has 18 hits there against 22 at 2.13.104, so the two zeros
      # are real content. core-provider then confirmed independently, sweeping
      # every tag from 2.13.90 with the same control, and states 2.13.99 as the
      # floor with no earlier landing.
      #
      # BELOW THE FLOOR IT FALLS TO `default: childConverging`, read from
      # krateoReady rather than inferred:
      #
      #   status == "True"                                   -> childHealthy
      #   Unavailable / CreateFailed / UpdateFailed /
      #     AuthorizationDenied / DriftNotConverging         -> childFailed
      #   ZeroEvidence / NotObserved / ObserveFailed         -> childUnevaluated
      #   default:                                           -> childConverging
      #
      # So the reason is not matched, nothing goes red, and the parent converges
      # FOREVER -- which is the exact failure this contract was written to prevent.
      #
      # AND THE REGRESSION IS IN THE CONFIDENCE, NOT IN THE CONDITIONS, which is
      # why the floor must be written down rather than merely known. Today this
      # kind rests at `Pending`, which the cdc keeps converging deliberately, so
      # below the floor the parent converges. After the rdc write ships it rests at
      # `Ready=False/TerminalByDesign`, which below the floor is ALSO converging.
      # The observable behaviour is identical; what changes is that three repos'
      # documents will say it reads healthy. Shipping the rdc half alone is
      # therefore strictly worse below 2.13.99 than not shipping it.
      #
      # AND PRODUCTION LANDS BETWEEN THE TWO FLOORS, which is the concrete reason
      # they had to be stated separately rather than as one "recent enough".
      # core-provider read 057 on 2026-11-16, and the shape of the reading matters
      # because the short form of it is ambiguous: ALL 76
      # `composition-dynamic-controller` Deployments ran 2.13.103. The 157 is every
      # Deployment in krateo-system, scanned as the DENOMINATOR -- not 76 cdcs out
      # of 157 cdcs, which is what "76 of 157" reads as and is not what was
      # measured. So 057 is ABOVE 2.13.99 and BELOW 2.13.104.
      #
      # THAT IS A SNAPSHOT, NOT A PROPERTY OF 057: true as of their read on
      # 2026-11-16, and the installer may roll 2.13.104+ at any time, which would
      # move 057 above BOTH floors with nothing here changing. Re-read it before
      # relying on it; do not quote this line as 057's current state. TerminalByDesign will be read as healthy there; #709's
      # AssumedUpToDate still reads healthy through the generic True arm, exactly
      # as the old `Available` did, until the installer rolls 2.13.104+. Relayed
      # from their read of their own cluster, not measured here.
      #
      # AND THE FLOOR IS NOW PART OF THE DECLARATION, not commentary on it.
      # Settled between oasgen and core-provider 2026-11-16 (oasgen PR #720 puts
      # both floors in `condition.go` beside the constructors): `restsAtNotReady`'s
      # field documentation will carry "requires core-provider >= 2.13.99; below
      # it, `Ready=False/TerminalByDesign` rolls the parent up as converging
      # (Creating), the same as `Pending`", and the rdc write ships only where the
      # consuming core-provider is at or above the floor.
      #
      # SO THE HONEST STATEMENT FOR THIS LAB, from oasgen, worth having BEFORE the
      # field exists rather than after: at 2.13.65, declaring `restsAtNotReady`
      # would change this CR's CONDITION and change NOTHING about NodeProvision's
      # parent. Not harmful, not useful -- and specifically not a demonstration of
      # the contract, which is the thing someone would be tempted to call it.
      #
      # WHAT THIS REPO MAY NOT CLAIM, consequently: no measurement taken in this
      # lab can observe the healthy read, at either floor. The pin is 2.13.65. A
      # future run that wants to demonstrate the contract end-to-end must move the
      # core-provider pin first, and that is a separate decision from the oasgen
      # pin -- the two floors are independent and neither implies the other.
      #
      # HOW IT STAYED INVISIBLE, kept because the evidence was sound in isolation
      # every time. Each repo verified ITS OWN half at ITS OWN version: the rdc
      # write was read at an oasgen tag, the cdc read arrived here as
      # `childhealth.go:975`, and A LINE NUMBER CARRIES NO VERSION. Three repos
      # agreed on a contract none of them had tested together. Ask "at which tag?"
      # of any relayed source reading, including one that cites a line.
      #
      # So it is not a duration and not a bound. oasgen owns the trigger and the
      # declaration's shape, and will tag it.
      #
      # TWO TRIGGER POINTS PUT TO THEM, both falling out of the measurement below.
      # (a) The precondition is already true ~21s in -- Synced=ReconcileSuccess from
      # the second sample -- so TerminalByDesign would be written almost immediately
      # and hold for the CR's whole life. A steady state from the start, not an end
      # state reached after a delay, and nobody will routinely see Pending on this
      # kind. (b) It must RESET when `metadata.generation` changes, or a newly
      # requested transition reads as resting-by-design while it is actually in
      # flight -- a false healthy on live work. rdc already resets its absence
      # counters on that signal. And "Synced is clean" is a CURRENT reading, not a
      # never-failed one: a create that failed and then succeeded looks identical to
      # one that succeeded first time.
      #
      # THE TRIGGER CHANGED AGAIN BEFORE SHIPPING, and this one is a safety fix
      # rather than a relay artifact. "Synced is clean" is NOT a safe gate for
      # writing TerminalByDesign, because a clean Synced can mean a create that
      # never landed. oasgen found the path after I asked them to rule it out:
      # for a kind declaring NEITHER `get` NOR `findby`, Observe hits an
      # assume-up-to-date site (restResources.go ~491) that returns
      # exists-and-up-to-date and sets `Available` -- Ready=TRUE -- and the runtime
      # then stamps ReconcileSuccess because the handler reported no Synced of its
      # own. So such a resource reads Ready=True/Synced=ReconcileSuccess with its
      # create unverified. That shipped unfixed, independently of this feature,
      # until 0.73.0 -- and what 0.73.0 changed is narrower than "fixed". See the
      # #709 block below, which is now a measurement against a released tag.
      #
      # So the trigger will require the CREATE MARKER for the current generation --
      # `krateo.io/external-create-succeeded`, which the runtime stamps only when
      # the handler reported the create as having reached the vendor -- together
      # with the declaration and the generation signature. A never-landed create
      # cannot satisfy that; a clean Synced can.
      #
      # THE GATE IS SAFE -- the worry I raised about it does NOT materialise, and I
      # verified that at source rather than taking the answer. I had asked whether
      # the create marker could be stamped for a create that REACHED the vendor and
      # was REJECTED by it, those being different claims, and `createReachedTheVendor`
      # (oasgen 0.68.0) reading like the weaker one. It cannot. All three call sites
      # pass a `tools.UpdateStatus` error -- the status write failing AFTER the create
      # landed -- never the vendor's:
      #
      #   restResources.go:1518  if _, err := tools.UpdateStatus(...); err != nil
      #   restResources.go:1546  same, and the VENDOR-rejection path immediately
      #                          above it returns `CreateResult{}, derr` WITHOUT
      #                          touching the marker -- the discriminating evidence
      #   restResources.go:1778  same
      #
      # So reached-and-rejected never reaches that function, and ordering B proves it
      # from the other side: its 404 PUT returned an error from the create path, so
      # no Pending and no marker. The misleading part was the function's NAME, which
      # claims less than the function does; oasgen is renaming it. Worth recording
      # that a careful reader lost time to a non-bug that a name created.
      #
      # THE ASSUME-UP-TO-DATE SITE HAS ITS REASON, RELEASED IN 0.73.0 on
      # 2026-11-16 (oasgen #709, Diego chose non-breaking). Read at the tag, not
      # relayed: the site now sets `customcondition.AssumedUpToDate(...)` where it
      # set `condition.Available()`, and the RETURN VALUE is deliberately unchanged,
      # because reporting exists:false there would dispatch a create on every
      # reconcile for a kind that can never be observed -- the duplicate-create
      # shape. The defect was the asserted CONDITION, not the assumed existence.
      #
      # BUT THE FIX IS LABELLING, NOT DETECTION, AND THE DISTINCTION IS THE WHOLE
      # VALUE OF IT. oasgen's own comment beside the change says: "The STATUS stays
      # True on purpose." So at 0.73.0 an asserted health still reads
      # `Ready=True` -- it now carries a reason that says it was asserted. A rollup
      # that maps Ready's STATUS and never reads its REASON is therefore completely
      # unchanged by 0.73.0: it goes on reading an assertion as an observation, with
      # no symptom, exactly as before. The fix only becomes a fix in the consumer
      # that reads the reason, which is core-provider's mapping -- so the mapping is
      # not a follow-up to #709, it is the half that does the work. Raised with
      # oasgen 2026-11-16, because their release note led with #710/#713 and did not
      # mention that #709 was in the tag at all.
      #
      # AND THIS REPO IS NOT YET RUNNING IT: the pin here is 0.61.0, so the site
      # that runs in this lab is still `condition.Available()`. Which changes
      # nothing for this kind -- see immediately below -- but it does mean no
      # measurement taken here has yet observed `AssumedUpToDate`, and a reading of
      # that reason must not be claimed from this repo until the pin moves.
      #
      # THIS KIND IS NOT IN THE AFFECTED POPULATION, checked both ways rather than
      # assumed. It declares `findby` (with `create`), so it takes the findby
      # branch and its synthesised-404 path, never the assume-up-to-date site --
      # and the measurement agrees: ordering A read Ready=Pending throughout and
      # never an asserted Available. The population at risk is kinds declaring
      # neither verb, which is also the population most likely to want to declare
      # "rests at not-ready", so the overlap is the reason it mattered.
      #
      # WHAT THE ARM SAMPLES BECAUSE OF THIS: Ready's STATUS as well as its reason
      # (arm7 v5). If the trigger is ever wrong in the false-healthy direction the
      # symptom is Ready=False/TerminalByDesign on a kind whose create never
      # landed, and a run recording only "not ready" cannot tell that from the
      # correct resting state. The reason was already sampled; the pair is what
      # makes it verifiable.
      #
      # HOW IT GOT HERE, kept because the failure was in the transit and not in
      # anyone's reasoning. The clause this replaces -- "forever-resting kinds keep
      # TerminalByDesign" -- was carried as Reconciled across three repos while
