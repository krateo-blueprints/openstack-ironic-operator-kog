# RestDefinition for the Ironic provision-state action (one CR per transition).
# KOG generates a NodeProvision CRD + rest-dynamic-controller. Creating a NodeProvision CR
# fires PUT /v1/nodes/{node_id}/states/provision once (202 -> Pending guard prevents re-fire).
#
# Apply order:
#   1. kubectl create configmap ironic-provision-oas -n openstack --from-file=provision.yaml=../oas/ironic-provision.yaml
#   2. kubectl apply -f restdefinition-provision.yaml
---
# FIRE-ONCE HERE IS DELIBERATE, and is NOT the same mistake restdefinition-power.yaml had.
#
# The two kinds model genuinely different things. A NodePower CR is a CONTINUOUS ASSERTION
# ("this host should be on") that lives as long as the host does, so it must be able to
# reach Ready and to re-assert itself after out-of-band drift -- which is why it was made
# declarative. A NodeProvision CR is a ONE-SHOT ACTION whose lifetime the chart already
# scopes: transition-deploy.yaml only renders while provision_state is `available`, and the
# CR disappears once the node is `active`. Ready=False(Pending) for the duration of an
# in-flight transition is therefore CORRECT, and the composition being not-ready while a
# transition is in flight is correct too. The power CR was wrong because it NEVER went away,
# so a transient condition became a permanent one.
#
# The narrow hazard, stated accurately: what makes the PUT fire is that findby cannot match,
# and the reason it cannot match is that a listed node has no `node_id` key for the
# identifier to compare against. `include_children=true` is NOT what protects this -- adding
# that query alone is harmless here, because the identifier still finds nothing. What WOULD
# break it is adding a responseTransform that lifts `name` onto `node_id`, as the power
# definition does: findby would start matching, Observe would report the resource as
# existing and up to date (spec.target has no counterpart in a node object, so the
# comparison skips it), and transitions would SILENTLY STOP FIRING -- no error, no drift,
# just a PUT that never happens.
#
# So if this is ever converted, the transform and an update verb have to land together, and
# it needs care power did not. `target` here is a VERB (`active`, `provide`, `manage`,
# `deleted`, `clean`, `inspect`) rather than a state, and the verb->state mapping is not
# injective: both `provide` and `deleted` settle on `available`, while `manage`, `clean` and
# `inspect` all settle on `manageable`. A state->verb transform therefore cannot tell "clean
# this manageable node" from "this node is already manageable, nothing to do", and the clean
# would never run. Provisioning also passes through intermediate states (deploying, wait
# call-back, clean wait) that are neither start nor target; `target_provision_state` covers
# those the way it does for power, but the ambiguity above it does not solve.
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node-provision
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-provision-oas/provision.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: NodeProvision
    # node_id is the human-friendly id the caller sets (node name or uuid). It is NOT a real
    # field on listed nodes, so findby never matches -> first Observe -> Create (the PUT). The
    # 202 Pending condition then makes subsequent Observe report exists -> the PUT fires once.
    identifiers:
      - node_id
    additionalStatusFields:
      - uuid
      - provision_state
      - target_provision_state
    verbsDescription:
      # No `get` verb: IsResourceKnown can't build a get call -> Observe uses findby. findby
      # matches on node_id, which is not a field on listed nodes, so it never matches ->
      # ResourceExists=false on first Observe -> Create (the PUT) fires. The 202 sets a Pending
      # condition that makes later Observes report exists, so the PUT fires exactly once.
      - action: findby
        method: GET
        path: /v1/nodes
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        identifiersMatchPolicy: OR
      - action: create
        method: PUT
        path: /v1/nodes/{node_id}/states/provision
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          - inPath: node_id
            inCustomResource: spec.node_id
