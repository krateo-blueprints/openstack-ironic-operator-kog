# RestDefinition for the Ironic provision-state action (one CR per transition).
# KOG generates a NodeProvision CRD + rest-dynamic-controller. Creating a NodeProvision CR
# fires PUT /v1/nodes/{node_id}/states/provision once (202 -> Pending guard prevents re-fire).
#
# Apply order:
#   1. kubectl create configmap ironic-provision-oas -n openstack --from-file=provision.yaml=../oas/ironic-provision.yaml
#   2. kubectl apply -f restdefinition-provision.yaml
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node-provision
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-provision-oas/provision.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: NodeProvision
    # node_id is the human-friendly id the caller sets (node name or uuid). findby never
    # matches -> first Observe -> Create (the PUT). The 202 Pending condition then makes
    # subsequent Observe report exists -> the PUT fires once. For WHY it never matches, read
    # the measured block in restdefinition-power.yaml and nothing else.
    # MECHANISM: see the measured block in restdefinition-power.yaml, which is
    # the sibling of this file and shares the shape. Summary of what was
    # measured there on 2026-11-07, against the served CRD and six live CRs:
    # the match fails on the RESPONSE side. `spec.node_id` is present AND
    # required, Ironic's /v1/nodes items carry `name` and never `node_id`, and
    # the responseTransform that oas/ironic-*.yaml documents as lifting
    # `name` -> `node_id` was never written in either file.
    #
    # A claim dated 2026-11-04 stood here saying the opposite -- that the spec
    # property was suppressed by `requestFieldMapping` (oasgen#419) and the CR
    # carried no node_id at all. That was false, and it was itself labelled a
    # correction, which is what made it convincing. Deleted rather than
    # annotated here; the power file keeps the full record of all three
    # mechanisms and why only one survived.
    #
    # NOT measured for THIS kind: there are zero live NodeProvision CRs
    # (`nodepowers` 6, `nodeprovisions` 0, as of 2026-11-07). Everything above
    # is read off the power kind and is expected to apply here by symmetry --
    # expected, not observed. Do not cite this file as live fleet behaviour.
    identifiers:
      - node_id
    additionalStatusFields:
      - uuid
      - provision_state
      - target_provision_state
    verbsDescription:
      # No `get` verb: IsResourceKnown can't build a get call -> Observe uses findby. findby
      # never matches -> ResourceExists=false on first Observe -> Create (the PUT) fires. The
      # 202 sets a Pending condition that makes later Observes report exists, so the PUT fires
      # exactly once.
      #
      # DO NOT restate the reason here. This comment said "matches on node_id, which is not a
      # field on listed nodes" -- the reason the block above corrected on 2026-11-04 and which
      # has never been the one operating. The correction lived 30 lines up and this restatement
      # survived it, so a reader landing here got the superseded version. On 2026-11-07 that
      # reader was me, and I passed it to another team as primary evidence for oasgen #485
      # before catching it. The mechanism is stated once, above; this comment states only the
      # outcome.
      - action: findby
        method: GET
        path: /v1/nodes
        # DO NOT ADD A responseTransform TO THIS findby. IT HAS BEEN ADDED AND
        # REVERTED TWICE -- 2026-11-07 (40bf2ed) and 2026-11-11 (52ebe5d) -- and
        # this warning is HERE, at the top of the verb, because the first revert
        # left its warning 59 lines further down and that did not stop the second.
        #
        # THE MECHANISM, read from rest-dynamic-controller source, not inferred:
        # this kind has no `get` and no `update`. With no `get`, IsResourceKnown
        # cannot build a get call, so Observe decides existence from findby. With
        # no `update`, a reported difference cannot drive the endpoint. So the
        # create -- PUT /v1/nodes/{node_id}/states/provision, the kind's ONLY
        # effect -- is dispatched exactly one way: Observe reporting the resource
        # ABSENT. restResources.go returns {ResourceExists: true,
        # ResourceUpToDate: true} and logs "External resource up-to-date" the
        # moment findby matches, and nothing errors anywhere.
        #
        # A findby that NEVER MATCHES is therefore this kind's operating
        # mechanism, not a defect in it. oasgen's schemaWarning says so in its
        # own last clause and it was read as a bug report:
        #
        #   identifier "node_id" is absent from the items the findby response
        #   carries ... findby can never match any item regardless of policy: it
        #   will report not-found and the reconciler acts on not-found by CREATING
        #
        # "The reconciler acts on not-found by CREATING" is the DESIRED behaviour
        # here. 52ebe5d quoted that warning, manufactured `node_id` from `.name`
        # so findby would match, and thereby made every provision transition a
        # silent no-op: deploy, undeploy, manage, provide, inspect and clean all
        # became reconcile-clean non-events, and nodes stayed at `enroll`. That is
        # the symptom this lab showed on 2026-11-11/12.
        #
        # WHY POWER CARRIES THE EQUIVALENT TRANSFORM SAFELY: it has a `get` AND an
        # `update` pointing at its own endpoint, so neither its existence verdict
        # nor its ability to act depends on findby matching. The asymmetry is
        # deliberate -- see the `update` note below for why provision must NOT
        # converge on drift.
        #
        # WHAT IT COSTS TO LEAVE THIS OFF: observability only. findby never
        # matches, so additionalStatusFields (uuid, provision_state,
        # target_provision_state) never populate on a NodeProvision CR. The charts
        # read provision_state off the BaremetalNode CR, which has a working
        # responseTransform, which is why nothing depends on this. Buying that
        # observability needs a DIFFERENT shape -- a `get` verb, so existence does
        # not depend on findby (Ironic has GET /v1/nodes/{id}/states, which this
        # OAS does not yet declare) -- not an identifier lift.
        #
        # Enforced by scripts/check-restdefinition-shape.py check F, which fails
        # on exactly this shape and carries 52ebe5d's transform as its positive
        # control.
        # include_children REMOVED 2026-11-04. It is correct and it will come
        # back, but it cannot work yet and was failing silently.
        #
        # What it was for: Ironic's node COLLECTION omits child nodes unless
        # asked. Measured: GET /v1/nodes -> 3 nodes; ?include_children=true ->
        # 17. blade01/04/05/06 are children of an enclosure and are ABSENT
        # without it, so findby is structurally blind to them.
        #
        # Why it had to go: `include_children` needs Ironic microversion >= 1.83,
        # and THIS KIND SENDS NO MICROVERSION AT ALL. BaremetalNode declares
        # `X-OpenStack-Ironic-API-Version` in its OAS and carries 1.109 on every
        # live CR; provision and power declare nothing, so Ironic negotiates its
        # minimum. Measured on a throwaway CR 2026-11-04:
        #
        #   Observe -> 406 "Request not acceptable. The minimal required API
        #                   version should be 1.83"
        #
        # Observe therefore failed on EVERY reconcile from 2026-10-30 onward --
        # before this cluster was even built -- and nothing surfaced it, because
        # no transition happened to be needed in that window.
        #
        # RESTORED 2026-11-04, together with the microversion header that makes
        # it usable: oas/ironic-provision.yaml now declares
        # `X-OpenStack-Ironic-API-Version` required with default 1.109, so every
        # generated CR is stamped with it by the apiserver and the request
        # carries a microversion that satisfies include_children's >= 1.83.
        # Verified in between: with the query removed, Observe succeeded and the
        # reconcile reached Create, where oasgen's own guard refused the
        # unresolved {node_id} -- which is the separate, upstream bug (#419).
        queries:
          - name: include_children
            value: "true"
        identifiersMatchPolicy: OR
        # The microversion, static and per-verb. BELT-AND-BRACES, not the thing
        # that makes `include_children` work -- measured here 2026-11-07 with a
        # one-variable test on this very kind, static header removed in both
        # arms, probe node_id naming no existing node:
        #
        #   spec X-OpenStack-Ironic-API-Version = "1.1"    -> findby 406
        #   spec X-OpenStack-Ironic-API-Version = "1.109"  -> findby succeeds
        #
        # So the GENERATED SPEC PROPERTY ships as a header. The CRD declares it
        # required with `default: "1.109"`, so every CR carries it unasked. The
        # 2026-11-04 406 recorded below was real and is consistent: the OAS did
        # not declare the property then, so nothing was sent and Ironic
        # negotiated its minimum. Declaring it is what fixed that; this header
        # only guarantees the version if a CR sets the property low.
        #
        # oasgen #304 concerned the CONFIGURATION-sourced header, a different path.
        # CORRECTED 2026-11-11: "really is dropped" is no longer true -- fixed in
        # 0.44.0 (#304) and 0.50.0 (#305/#392), measured working on rdc 0.54.1
        # (distinctive 1.95 on the wire, 0 406s). Still do not generalise either
        # statement to this kind: here the value ships as a GENERATED SPEC
        # PROPERTY with `default: "1.109"`, which is a third route again.
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        # NO responseTransform ON THIS VERB EITHER. The full account is at the TOP
        # of this findby block, where someone about to add one will actually read
        # it; this copy is a pointer on purpose. The 2026-11-07 attempt lifted
        # `node_id` from `name` AND `target` from `provision_state`; the
        # 2026-11-11 one re-added the first half alone. Both disable the kind.
        #
        # 1. THE IDENTIFIER LIFT DISABLES THE ONLY WORKING VERB. `create` is the
        #    sole verb here that performs PUT /v1/nodes/{node_id}/states/provision.
        #    A matching findby means ResourceExists=true on the first Observe, so
        #    `create` is never called and NO provision transition fires at all --
        #    deploy, undeploy, manage, provide, inspect and clean would all become
        #    silent no-ops. Power survives the same lift only because it has an
        #    `update` verb pointing at its endpoint; this kind deliberately does
        #    not, because a provision drift correction would redeploy a machine.
        #
        # 2. `target` AND `provision_state` ARE DIFFERENT VALUE SPACES.
        #    oas/ironic-provision.yaml:108 defines target as
        #    "manage | provide | active | deleted | inspect | rebuild | clean"
        #    -- VERBS. `provision_state` holds STATES: manageable, available,
        #    active. Only `active` coincides. The charts render six targets
        #    (active, clean, deleted, inspect, manage, provide), so five could
        #    never equal the lifted value, and with no `update` verb that phantom
        #    drift is permanent -- latching every CR non-Ready and pinning the
        #    BaremetalHost composition at Ready=false. Precisely the failure this
        #    branch had just removed from the power kind.
        #
        # So observability for THIS kind cannot be bought with an identifier
        # lift. It needs a different shape -- a `get` verb so existence does not
        # depend on findby matching, or lifting the observed state into a field
        # that is NOT the desired-state field. Neither is attempted here.
      # NO `update` VERB, ON PURPOSE -- and this is the one asymmetry with
      # restdefinition-power.yaml that must not be "fixed" for consistency.
      #
      # Power is safe to converge: a blade found off when `target` says on gets
      # powered on, and the worst case is a machine running that someone wanted
      # off. Provision is not. `target` here takes values like `active`,
      # `deleted` and `manage`, and driving to `active` from `available` is a
      # DEPLOY -- it writes an image and WIPES THE DISK. Ironic also drops a
      # node back to `available` by itself after a failed deploy (which is why
      # `last_error` is in restdefinition-node.yaml's additionalStatusFields),
      # so an automatic drift correction here would retry a destructive
      # operation precisely when it had just failed, in a loop.
      #
      # So nothing acts on drift here. And to be exact about what that costs,
      # because this comment claimed the opposite: with no responseTransform this
      # kind's findby NEVER MATCHES, so `additionalStatusFields` NEVER POPULATE --
      # provision_state, target_provision_state and uuid stay empty for the life
      # of every CR. restdefinition-power.yaml records the measurement that
      # proves it: an unmatched findby plus a `Pending` condition reports
      # up-to-date without having observed anything, 323 observes, 0 creates, no
      # status fields. /code-review caught the claim.
      #
      # So do NOT write a composition template against status.provision_state on
      # a NodeProvision CR. The charts read provision_state off the
      # BaremetalNode CR, which has a working responseTransform, and that is why
      # nothing has broken. Decided by the user 2026-11-07 when offered the
      # convergent option.
      - action: create
        method: PUT
        path: /v1/nodes/{node_id}/states/provision
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          - inPath: node_id
            inCustomResource: spec.node_id
