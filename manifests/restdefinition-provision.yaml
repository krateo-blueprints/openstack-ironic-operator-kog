# RestDefinition for the Ironic provision-state action (one CR per transition).
# KOG generates a NodeProvision CRD + rest-dynamic-controller. Creating a NodeProvision CR
# fires PUT /v1/nodes/{node_id}/states/provision once (202 -> Pending guard prevents re-fire).
#
# Apply order:
#   1. kubectl create configmap ironic-provision-oas -n openstack --from-file=provision.yaml=../oas/ironic-provision.yaml
#   2. kubectl apply -f restdefinition-provision.yaml
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node-provision
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-provision-oas/provision.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: NodeProvision
    # node_id is the human-friendly id the caller sets (node name or uuid). findby never
    # matches -> first Observe -> Create (the PUT). The 202 Pending condition then makes
    # subsequent Observe report exists -> the PUT fires once. For WHY it never matches, read
    # the measured block in restdefinition-power.yaml and nothing else.
    # MECHANISM: see the measured block in restdefinition-power.yaml, which is
    # the sibling of this file and shares the shape. Summary of what was
    # measured there on 2026-11-07, against the served CRD and six live CRs:
    # the match fails on the RESPONSE side. `spec.node_id` is present AND
    # required, Ironic's /v1/nodes items carry `name` and never `node_id`, and
    # the responseTransform that oas/ironic-*.yaml documents as lifting
    # `name` -> `node_id` was never written in either file.
    #
    # A claim dated 2026-11-04 stood here saying the opposite -- that the spec
    # property was suppressed by `requestFieldMapping` (oasgen#419) and the CR
    # carried no node_id at all. That was false, and it was itself labelled a
    # correction, which is what made it convincing. Deleted rather than
    # annotated here; the power file keeps the full record of all three
    # mechanisms and why only one survived.
    #
    # NOT measured for THIS kind: there are zero live NodeProvision CRs
    # (`nodepowers` 6, `nodeprovisions` 0, as of 2026-11-07). Everything above
    # is read off the power kind and is expected to apply here by symmetry --
    # expected, not observed. Do not cite this file as live fleet behaviour.
    identifiers:
      - node_id
    additionalStatusFields:
      - uuid
      - provision_state
      - target_provision_state
    verbsDescription:
      # No `get` verb: IsResourceKnown can't build a get call -> Observe uses findby. findby
      # never matches -> ResourceExists=false on first Observe -> Create (the PUT) fires. The
      # 202 sets a Pending condition that makes later Observes report exists, so the PUT fires
      # exactly once.
      #
      # DO NOT restate the reason here. This comment said "matches on node_id, which is not a
      # field on listed nodes" -- the reason the block above corrected on 2026-11-04 and which
      # has never been the one operating. The correction lived 30 lines up and this restatement
      # survived it, so a reader landing here got the superseded version. On 2026-11-07 that
      # reader was me, and I passed it to another team as primary evidence for oasgen #485
      # before catching it. The mechanism is stated once, above; this comment states only the
      # outcome.
      - action: findby
        method: GET
        path: /v1/nodes
        # DO NOT ADD A responseTransform TO THIS findby. IT HAS BEEN ADDED AND
        # REVERTED TWICE -- 2026-11-07 (40bf2ed) and 2026-11-11 (52ebe5d) -- and
        # this warning is HERE, at the top of the verb, because the first revert
        # left its warning 59 lines further down and that did not stop the second.
        #
        # THE MECHANISM, read from rest-dynamic-controller source, not inferred:
        # this kind has no `get` and no `update`. With no `get`, IsResourceKnown
        # cannot build a get call, so Observe decides existence from findby. With
        # no `update`, a reported difference cannot drive the endpoint. So the
        # create -- PUT /v1/nodes/{node_id}/states/provision, the kind's ONLY
        # effect -- is dispatched exactly one way: Observe reporting the resource
        # ABSENT. restResources.go returns {ResourceExists: true,
        # ResourceUpToDate: true} and logs "External resource up-to-date" the
        # moment findby matches, and nothing errors anywhere.
        #
        # A findby that NEVER MATCHES is therefore this kind's operating
        # mechanism, not a defect in it. oasgen's schemaWarning says so in its
        # own last clause and it was read as a bug report:
        #
        #   identifier "node_id" is absent from the items the findby response
        #   carries ... findby can never match any item regardless of policy: it
        #   will report not-found and the reconciler acts on not-found by CREATING
        #
        # "The reconciler acts on not-found by CREATING" is the DESIRED behaviour
        # here. 52ebe5d quoted that warning, manufactured `node_id` from `.name`
        # so findby would match, and thereby made every provision transition a
        # silent no-op: deploy, undeploy, manage, provide, inspect and clean all
        # became reconcile-clean non-events, and nodes stayed at `enroll`. That is
        # the symptom this lab showed on 2026-11-11/12.
        #
        # WHY POWER CARRIES THE EQUIVALENT TRANSFORM SAFELY: it has a `get` AND an
        # `update` pointing at its own endpoint, so neither its existence verdict
        # nor its ability to act depends on findby matching. The asymmetry is
        # deliberate -- see the `update` note below for why provision must NOT
        # converge on drift.
        #
        # WHAT IT COSTS TO LEAVE THIS OFF: observability only. findby never
        # matches, so additionalStatusFields (uuid, provision_state,
        # target_provision_state) never populate on a NodeProvision CR. The charts
        # read provision_state off the BaremetalNode CR, which has a working
        # responseTransform, which is why nothing depends on this. Buying that
        # observability needs a DIFFERENT shape -- a `get` verb, so existence does
        # not depend on findby (Ironic has GET /v1/nodes/{id}/states, which this
        # OAS does not yet declare) -- not an identifier lift.
        #
        # Enforced by scripts/check-restdefinition-shape.py check F, which fails
        # on exactly this shape and carries 52ebe5d's transform as its positive
        # control.
        # include_children REMOVED 2026-11-04. It is correct and it will come
        # back, but it cannot work yet and was failing silently.
        #
        # What it was for: Ironic's node COLLECTION omits child nodes unless
        # asked. Measured: GET /v1/nodes -> 3 nodes; ?include_children=true ->
        # 17. blade01/04/05/06 are children of an enclosure and are ABSENT
        # without it, so findby is structurally blind to them.
        #
        # Why it had to go: `include_children` needs Ironic microversion >= 1.83,
        # and THIS KIND SENDS NO MICROVERSION AT ALL. BaremetalNode declares
        # `X-OpenStack-Ironic-API-Version` in its OAS and carries 1.109 on every
        # live CR; provision and power declare nothing, so Ironic negotiates its
        # minimum. Measured on a throwaway CR 2026-11-04:
        #
        #   Observe -> 406 "Request not acceptable. The minimal required API
        #                   version should be 1.83"
        #
        # Observe therefore failed on EVERY reconcile from 2026-10-30 onward --
        # before this cluster was even built -- and nothing surfaced it, because
        # no transition happened to be needed in that window.
        #
        # RESTORED 2026-11-04, together with the microversion header that makes
        # it usable: oas/ironic-provision.yaml now declares
        # `X-OpenStack-Ironic-API-Version` required with default 1.109, so every
        # generated CR is stamped with it by the apiserver and the request
        # carries a microversion that satisfies include_children's >= 1.83.
        # Verified in between: with the query removed, Observe succeeded and the
        # reconcile reached Create, where oasgen's own guard refused the
        # unresolved {node_id} -- which is the separate, upstream bug (#419).
        queries:
          - name: include_children
            value: "true"
        identifiersMatchPolicy: OR
        # The microversion, static and per-verb. BELT-AND-BRACES, not the thing
        # that makes `include_children` work -- measured here 2026-11-07 with a
        # one-variable test on this very kind, static header removed in both
        # arms, probe node_id naming no existing node:
        #
        #   spec X-OpenStack-Ironic-API-Version = "1.1"    -> findby 406
        #   spec X-OpenStack-Ironic-API-Version = "1.109"  -> findby succeeds
        #
        # So the GENERATED SPEC PROPERTY ships as a header. The CRD declares it
        # required with `default: "1.109"`, so every CR carries it unasked. The
        # 2026-11-04 406 recorded below was real and is consistent: the OAS did
        # not declare the property then, so nothing was sent and Ironic
        # negotiated its minimum. Declaring it is what fixed that; this header
        # only guarantees the version if a CR sets the property low.
        #
        # oasgen #304 concerned the CONFIGURATION-sourced header, a different path.
        # CORRECTED 2026-11-11: "really is dropped" is no longer true -- fixed in
        # 0.44.0 (#304) and 0.50.0 (#305/#392), measured working on rdc 0.54.1
        # (distinctive 1.95 on the wire, 0 406s). Still do not generalise either
        # statement to this kind: here the value ships as a GENERATED SPEC
        # PROPERTY with `default: "1.109"`, which is a third route again.
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        # NO responseTransform ON THIS VERB EITHER. The full account is at the TOP
        # of this findby block, where someone about to add one will actually read
        # it; this copy is a pointer on purpose. The 2026-11-07 attempt lifted
        # `node_id` from `name` AND `target` from `provision_state`; the
        # 2026-11-11 one re-added the first half alone. Both disable the kind.
        #
        # 1. THE IDENTIFIER LIFT DISABLES THE ONLY WORKING VERB. `create` is the
        #    sole verb here that performs PUT /v1/nodes/{node_id}/states/provision.
        #    A matching findby means ResourceExists=true on the first Observe, so
        #    `create` is never called and NO provision transition fires at all --
        #    deploy, undeploy, manage, provide, inspect and clean would all become
        #    silent no-ops. Power survives the same lift only because it has an
        #    `update` verb pointing at its endpoint; this kind deliberately does
        #    not, because a provision drift correction would redeploy a machine.
        #
        # 2. `target` AND `provision_state` ARE DIFFERENT VALUE SPACES.
        #    oas/ironic-provision.yaml:108 defines target as
        #    "manage | provide | active | deleted | inspect | rebuild | clean"
        #    -- VERBS. `provision_state` holds STATES: manageable, available,
        #    active. Only `active` coincides. The charts render six targets
        #    (active, clean, deleted, inspect, manage, provide), so five could
        #    never equal the lifted value, and with no `update` verb that phantom
        #    drift is permanent -- latching every CR non-Ready and pinning the
        #    BaremetalHost composition at Ready=false. Precisely the failure this
        #    branch had just removed from the power kind.
        #
        # So observability for THIS kind cannot be bought with an identifier
        # lift. It needs a different shape -- a `get` verb so existence does not
        # depend on findby matching, or lifting the observed state into a field
        # that is NOT the desired-state field. Neither is attempted here.
      # NO `update` VERB, ON PURPOSE -- and this is the one asymmetry with
      # restdefinition-power.yaml that must not be "fixed" for consistency.
      #
      # Power is safe to converge: a blade found off when `target` says on gets
      # powered on, and the worst case is a machine running that someone wanted
      # off. Provision is not. `target` here takes values like `active`,
      # `deleted` and `manage`, and driving to `active` from `available` is a
      # DEPLOY -- it writes an image and WIPES THE DISK. Ironic also drops a
      # node back to `available` by itself after a failed deploy (which is why
      # `last_error` is in restdefinition-node.yaml's additionalStatusFields),
      # so an automatic drift correction here would retry a destructive
      # operation precisely when it had just failed, in a loop.
      #
      # So nothing acts on drift here. And to be exact about what that costs,
      # because this comment claimed the opposite: with no responseTransform this
      # kind's findby NEVER MATCHES, so `additionalStatusFields` NEVER POPULATE --
      # provision_state, target_provision_state and uuid stay empty for the life
      # of every CR. restdefinition-power.yaml records the measurement that
      # proves it: an unmatched findby plus a `Pending` condition reports
      # up-to-date without having observed anything, 323 observes, 0 creates, no
      # status fields. /code-review caught the claim.
      #
      # So do NOT write a composition template against status.provision_state on
      # a NodeProvision CR. The charts read provision_state off the
      # BaremetalNode CR, which has a working responseTransform, and that is why
      # nothing has broken. Decided by the user 2026-11-07 when offered the
      # convergent option.
      #
      # THIS KIND OWES A DECLARATION, agreed across three repos on 2026-11-15 and
      # recorded here because the agreement otherwise lives only in a chat thread
      # that no later reader gets.
      #
      # The contract, SETTLED 2026-11-15 -- and not in the shape first recorded
      # here. The field is a per-verb DURATION, not a reason string:
      #
      #   verbsDescription:
      #     - action: update
      #       path: /v1/nodes/{uuid}/states/power
      #       method: PUT
      #       restsAtNotReady: 90s          # <- a PURE BACKEND figure
      #
      # and rdc publishes the sum in status FOR OPERATORS:
      #
      #   status:
      #     restsAtNotReadyEffective: 270s  # 90s declared + this deployment's 180s resync
      #
      # It is opt-in: a verb that does not declare it behaves exactly as today.
      #
      # WHO ACTS ON IT -- corrected 2026-11-15, same day, after a third relay.
      # rdc ENFORCES the bound itself: Ready=False/Pending within it, and a
      # distinct reason past it (working name `SettleBoundExceeded`) whose message
      # names the bound. The cdc maps that REASON to stalled and reads neither a
      # RestDefinition nor a status field -- consistent with oasgen#660, where the
      # rollup reads the child's Ready reason and nothing else. An earlier relay
      # said core-provider reads `status.restsAtNotReadyEffective`; it does not,
      # and oasgen withdrew that. The status field exists for operators only.
      #
      # THE EXEMPTION THIS KIND WAS PROMISED DOES NOT EXIST. Verified here, not
      # relayed -- this clause changed three times in one day and each version
      # arrived labelled as settled, so it was read off source with controls.
      #
      # At oasgen origin/main (052613a, 2026-11-15), in the live monorepo and not
      # the frozen rest-dynamic-controller repo:
      #
      #   TerminalByDesign                                  0 files
      #   CONTROL, same query shape: NoIdentifierRecorded    5 files at origin/main
      #                                                      0 at the 0.61.0 pin
      #   CONTROL 2, every Reason constant rdc defines      13, enumerated:
      #     AuthorizationDenied CreateFailed CreateUnreachable DriftNotConverging
      #     NoCreateVerbDeclared NoIdentifierRecorded NoResponseBody Pending
      #     ResolverDigestFieldAbsent ResolverDigestRecorded ResponseObtained
      #     UpdateFailed Updating
      #   (`Terminal` does appear in internal/tools/async -- `PollUntilTerminal`,
      #    an async OPERATION state, not a condition reason.)
      #
      # So `TerminalByDesign` is a reason core-provider MAPS and nothing PRODUCES.
      # The clause "forever-resting kinds keep TerminalByDesign" is vacuous, and
      # it sat in a document marked Reconciled across three repos.
      #
      # WHICH MEANS THE INVERSION IS REAL. With no producer there is no live way
      # to say "this verb never settles, and that is correct". The only expressible
      # thing is a finite `restsAtNotReady`, which rdc ENFORCES -- and for this
      # kind no finite number is correct. `86400s` would be a workaround and is
      # refused. A duration and a boolean are not two points on one scale: they
      # express different claims, and the boolean was dropped after an argument
      # about MAGNITUDE, which was the wrong axis.
      #
      # oasgen has put BOTH halves on hold until the measurement below reads --
      # including the publish-for-operators half, on the grounds that a bound
      # published but unenforced is a number an operator would act on. 0.72.0
      # carries no part of the field.
      #
      # A duration beat a boolean because a boolean forces core-provider to pick
      # between suppressing ChildStalled forever for a kind, never reporting a
      # real stall, and inventing a timeout in its own repo where the
      # RestDefinition author's measurement cannot reach it. Per VERB rather than
      # per kind because this repo's own two kinds differ: NodePower rests at
      # nothing and converges, this kind rests permanently, and a kind with a slow
      # `update` and a fast `delete` would otherwise let the slow one license
      # silence on a stuck delete.
      #
      # WHY THIS KIND AND NOT BaremetalNode. BaremetalNode converges: it reaches
      # Ready=True/Available in about 120s, measured at 0.61.0 in two arms. Its
      # failure to get there is precisely the signal ChildStalled exists to raise,
      # so declaring it would silence the thing the feature is for. This kind
      # cannot converge -- `target` takes `active`, and driving there wipes the
      # disk -- which is why the declaration is right HERE and wrong one kind
      # over.
      #
      # EXCEPT THAT THE PREMISE IS NOT MEASURED, and it is load-bearing for three
      # repos. Read the two sentences above again: BaremetalNode's ~120s is
      # "measured at 0.61.0 in two arms". "This kind cannot converge" is an
      # ARGUMENT -- from the verb set and from the disk-wipe hazard -- written in
      # the same voice. No live NodeProvision CR has ever existed in this repo
      # (zero on 2026-11-07) and no arm has touched one. The resting condition
      # that the whole exemption is about has never been read off anything.
      #
      # AND THIS FILE'S OWN VERBS POINT THE OTHER WAY. It declares `findby` plus
      # `create`, with no `get` and no `update`. The recorded finding for that
      # shape is that the create becomes UNREACHABLE once findby can match -- the
      # node exists, ResourceExists is true, the PUT is never dispatched -- and
      # that an action-only kind with an unreachable create reports
      # Ready/Available/Synced/Observed ALL TRUE while having done nothing. If
      # that is what a live one does, this kind needs no exemption at all, is
      # counted childHealthy for the wrong reason, and is the wrong motivating
      # case for the feature. The exposure in that direction is not a false stall
      # but a false HEALTHY, across the six renderable render sites, which is the
      # harder one to notice.
      #
      # WHAT BOUNDS THE RE-DISPATCH, verified 2026-11-15 and worth knowing before the
      # severity above is quoted anywhere. Because findby can never match (see the
      # findby verb's own note), rdc re-dispatches the PUT every resync for as long
      # as a CR exists. The chart is the only thing that limits that, and it does:
      # all SIX renderable transitions in baremetal-host are gated on
      # `baremetal-host.provisionState`, a `lookup` of the live BaremetalNode's
      # status.provision_state. When the node leaves the gating state the gate
      # closes, the CR stops being rendered and cdc removes it. An empty lookup
      # returns "" and every `eq ... "<state>"` is then false, so the gates FAIL
      # CLOSED -- the safe direction.
      #
      # So the re-dispatch is bounded by the composition's re-render latency, not
      # unbounded. Two things that bound remains silent about, and they are runtime
      # facts for the measurement rather than static ones: how LONG that window is,
      # and whether Ironic rejects the repeated PUT (it should -- the node has left
      # the state the transition was valid from). The dangerous shape is a node
      # RE-ENTERING a gating state while a stale CR still exists, which is also the
      # intended retry path, so it cannot be screened out.
      #
      # Enforced by scripts/check-transition-gates.py, in `make check`. The bound is
      # invisible from either side alone: nothing here said "a chart limits my blast
      # radius" and nothing in the chart said "without this gate the action re-fires
      # forever", so a gate quietly changed to a values flag would remove it with no
      # symptom but a transition re-issued every 3 minutes at a live node.
      #
      # A REJECTION IS NOT A SAFE OUTCOME EITHER, which oasgen raised and is worth
      # stating next to the bound. If Ironic rejects the repeated PUT -- the node
      # having left the state the transition was valid from -- then every bounded
      # window produces N vendor errors, and on a dispatch kind that is a stream of
      # ReconcileError on a resource that is behaving exactly as designed. So the
      # bound converts "a repeating write" into "a repeating error", which is better
      # but is still not health, and it is what a rollup would be reading.
      #
      # THE MEASUREMENT HAS A VERSION COORDINATE, so it needs TWO RUNS. The
      # observe-to-create area moved between 0.61.0 (this repo's pin, chosen for
      # comparability with arms 4 and 5) and 0.72.0. oasgen named what moved and the
      # load-bearing half was verified here rather than taken on relay:
      #
      #   change                                   ver     reaches a findby kind?
      #   createHasBeenAttempted marker guard      0.70.0  NO  -- apiCall == nil
      #   the no-identifier refusal (#687)         0.69.0  NO  -- same branch
      #   createFailedMostRecently (#697)          0.71.0  NO  -- same branch
      #   createReachedTheVendor (#676/#681)       0.68.0  YES -- create's vendor sites
      #
      # Verified at origin/main: restResources.go has FIVE `apiCall == nil` blocks
      # (343, 391, 1556, 1841, 2129); createHasBeenAttempted's single non-test call
      # site is at 392, inside the 391 block, which a kind declaring a findby can
      # never enter. createReachedTheVendor is called at 1518, 1546 and 1778 -- on
      # the create path, outside those guards -- so it DOES reach this kind.
      #
      # WHICH IS WHY THE COUNT IS THE PRIMARY OUTPUT, not the classification.
      # createReachedTheVendor changes what a create REPORTS after the vendor call,
      # not whether one is dispatched. So the dispatch COUNT should be identical at
      # 0.61.0 and at whatever tag serves the declaration, while the CONDITIONS may
      # differ. If two runs disagree on the count, something nobody has listed moved
      # and that is itself the finding.
      #
      # MEASURED 2026-11-15, AND THE PREMISE HOLDS -- WITH A MECHANISM NOBODY
      # PREDICTED, INCLUDING ME. ARM 7 on a throwaway cluster at 0.61.0,
      # `target: manage` (valid from enroll, touches no disk), ordering A -- node
      # first, which is what the charts produce:
      #
      #   provision_state   enroll -> manageable     the transition LANDED
      #   inferred-repeats  1 -> 1                   see the counter note below
      #   Ready             Pending                  73 of 74 samples
      #   Synced            ReconcileSuccess         no error anywhere
      #   Observed          ABSENT                   never set
      #   last_error        none
      #   window            t+10s .. t+831s = 4.6 resync periods
      #
      # So this kind DOES rest at not-ready indefinitely, while being entirely
      # healthy: the transition succeeded, Synced reports success, nothing errored,
      # and Ready stayed Pending across more than four resyncs with ZERO further
      # dispatches. That is precisely the state the exemption is about, now read
      # rather than argued.
      #
      # AND IT DOES NOT RE-DISPATCH, which refutes what this file said earlier and
      # what I escalated to two repos. The mechanism is the Pending LATCH: the
      # create's 202 sets Pending, and the findby branch's
      # `notfound && IsConditionSet(mg, Pending())` guard then returns
      # {ResourceExists: true, ResourceUpToDate: true} on every later miss
      # (restResources.go, the findby notfound handling). So the condition that the
      # first dispatch sets is what suppresses all the others. One dispatch, then
      # silence. The chart gate still bounds the CR's lifetime, but it is not what
      # bounds the dispatching -- rdc does, by itself.
      #
      # THE COUNTER I READ WAS THE WRONG ONE -- corrected the same evening, by
      # oasgen, before this was merged. There are TWO counters with TWO annotations:
      #
      #   krateo.io/inferred-absence-repeats   reportInferredAbsence, the ELSE-IF
      #                                        branch: notfound with NO Pending.
      #                                        This kind writes it only on the very
      #                                        FIRST observe, before the create.
      #   krateo.io/latched-absence-repeats    reportLatchedInferredAbsence, called
      #                                        INSIDE the Pending guard. This is the
      #                                        one that increments on every latch
      #                                        thereafter.
      #
      # I sampled the first. It reads a flat 1 because from the moment the create
      # set Pending every miss takes the LATCHED path and increments the OTHER
      # annotation -- so the number is flat because the counter stopped being the
      # one in use, not because nothing further happened. A dead value that looks
      # live, in a primary output, for the second time today.
      #
      # THE CONCLUSION SURVIVES, on the mechanism rather than on that number: the
      # Pending guard returns exists-and-up-to-date, so no create is dispatched
      # after the first. One dispatch is what the LATCH guarantees; the flat 1 was
      # never the evidence for it. oasgen verified the guard exists at TWO sites,
      # restResources.go:357 (get) and :522 (findby, this kind's).
      #
      # AND THE LATCHED DETECTOR'S SILENCE IS EXPLAINED, NOT A DEFECT. rdc emits a
      # Warning (reasonAbsenceLatched) once the latch count reaches
      # maxLatchedAbsenceRepeats = 5 (latched_absence.go:49) -- the detector built
      # to separate "a create in flight" from "one that will never land", for which
      # this kind is the canonical never-lands case. No such event appeared: the
      # arm's event counter held at exactly 1 across all 74 samples. The reason is
      # arithmetic, measured: Pending held t+10s..t+831s = 821s, which at a 180s
      # resync is 4.6 latches against a threshold of 5. THE WINDOW WAS SHORT BY ONE
      # LATCH. Same shape as the 2026-11-08 power reading that could not contain a
      # 190s recovery -- a window shorter than the thing it is meant to observe --
      # except here it was shorter than the THRESHOLD rather than the period.
      # So the next run needs >5 latches of Pending, not >4 resyncs: budget 1100s+.
      #
      # THREE PREDICTIONS, ALL WRONG, in this order: Ready=True-while-inert (that
      # is the findby-MATCHES branch, unreachable here); a sign inversion from
      # enforcement (moot); re-dispatch every resync (refuted above). The measured
      # answer -- one-shot then a latched Pending -- was none of them. Recorded
      # because the pattern matters more than the predictions: each was derived
      # from reading more source, each was more confident than the last, and the
      # reading settled it in one run.
      #
      # ORDERING B IS VOID, not a second result: the CR created BEFORE the node had
      # already driven enroll -> manageable by the time the validity gate ran, so
      # the gate could not certify the setup (`manage` is not valid FROM
      # `manageable`). Its rows are consistent with A -- Pending/ReconcileSuccess
      # throughout, 828s -- but uncertified, and it recorded 2 inferences rather
      # than 1, which the next run should explain rather than assume. The gate must
      # evaluate validity AT CR-CREATION TIME and treat "already past the target"
      # as its own case.
      #
      # STILL OWED: the same reading at whatever tag serves the declaration, with
      # FOUR fixes -- read `latched-absence-repeats` as the latch counter, sample a
      # window longer than 5 latches (1100s+) so the Warning can fire, evaluate the
      # target-validity gate AT CR-CREATION TIME, and sample
      # `metadata.generation` per row -- inferredCounter resets when the
      # generation changes, so a window spanning a spec edit restarts the count.
      # This window provably contains no spec edit (the CR is applied once per
      # ordering and never patched), but that is an argument from reading the
      # script, not a measurement.
      # local/ironic.conf runs `enabled_deploy_interfaces = fake` and
      # `default_deploy_interface = fake`, so driving a node to `target: active`
      # on a throwaway cluster uses the fake deploy interface: no image, no PXE,
      # no disk. The hazard that makes this kind terminal on hardware does not
      # exist on a kind cluster, so the one reading nobody can take on real blades
      # is free here. Both orderings must be read separately -- the CR created
      # BEFORE the node exists in Ironic, and after -- because whether findby can
      # match is exactly what decides the outcome.
      #
      # NOT POSSIBLE YET, and the version matters: `restsAtNotReady` does not
      # exist in any oasgen build. Zero matches at 0.67.0, 0.68.0, 0.69.0 and
      # origin/main, checked 2026-11-15. Three tags were cut after the name was
      # settled and none carries it, and 0.72.0 is scoped to other work, so there
      # is nothing to wire to and no version to pin.
      #
      # DO NOT ADD IT EARLY -- it fails in the one way that looks like success. An
      # undeclared field is pruned by the apiserver SILENTLY: the RestDefinition
      # applies cleanly, the apply reports configured, and the value is simply
      # gone. No error, no event, nothing to grep. So the field goes in no
      # manifest and no chart here until oasgen names the tag that serves it --
      # which is also why what I owe below is a read-back from the GENERATED CRD
      # and not from this file.
      #
      # THE NUMBER IS NOT DERIVABLE FROM THIS REPO'S PUBLISHED FIGURES. The 180s
      # and 190s in restdefinition-power.yaml are RESYNC-dominated: on a 202 the
      # pending branch (restResources.go:1328/:1530) sets Pending and returns with
      # no RequeueAfter, that kind declares no async block, so nothing re-observes
      # until the next resync tick -- `REST_CONTROLLER_RESYNC_INTERVAL`, default
      # 3m. Both arms measured one resync period, and the 10s between them is one
      # sample of a 10s sampler. The backend term -- the only part a settle bound
      # is about -- is bounded at <=90s in both arms and unresolved below that,
      # because the arms read the CR every 10s and the backend only every 90s.
      #
      # AND THE BOUND HAS A FLOOR THE AUTHOR CANNOT SEE. If the duration is
      # measured from the condition going Pending, the window CONTAINS one resync
      # wait -- and the resync interval is an env var on the rdc Deployment, an
      # operator's choice that this file cannot read. Raised to 5m, any 240s
      # declared here trips on a perfectly healthy drift correction. Put to oasgen
      # on 2026-11-15, and ANSWERED the same day: rdc adds its own resync interval
      # and publishes the sum in status. So the number written HERE is a pure
      # backend figure, portable between deployments, and the spec value is
      # deliberately wrong as a stall bound -- it is the backend term only, and
      # rdc owns the arithmetic because rdc is the only side that knows both
      # terms. The validate-at-load alternative lost because it left the author's
      # number unportable: the same RestDefinition correct on a 3m fleet and
      # wrong on a 5m one, with no way to see which it was shipping to.
      #
      # WHICH MEANS THE NUMBER THIS FILE OWES IS A BACKEND SETTLE TIME, and this
      # repo does not have one. The arms bound it at <=90s and never resolved
      # below that. The backend-resolved arm -- backend read at the CR's own 10s
      # cadence, on both the fake and the redfish interface -- is queued as the
      # next session's measurement. Its result will be an EMULATOR backend term,
      # flagged as one; the hardware margin stays an open input that only someone
      # with real blades can close.
      #
      # WHAT I OWE, AND IT IS NOW TWO THINGS WITH DIFFERENT GATES.
      #
      # (1) THE MEASUREMENT, which comes FIRST and is not blocked on anything.
      # Read what a live NodeProvision CR actually rests at, on a throwaway
      # cluster, both orderings separated, VOID-gated. core-provider has recorded
      # this as a gate on #498 in its own right: ChildStalled does not ship until
      # this reads. It is the premise under every other decision here and the only
      # one nobody has taken.
      #
      # (2) THE DECLARATION -- and as of this commit there is NOTHING TO DECLARE.
      # The finite duration is wrong for this kind and the exemption that would
      # have been right has no producer (see above). So the shape is open, not
      # pending a tag: what this kind needs may not exist in any form yet. When
      # oasgen settles it and names the tag, declare it here and then read the
      # declaration back out of the GENERATED CRD rather than trusting this file.
      # "The manifest says it" is not "the CRD has it" -- the same gate ARM 5 used
      # when it read power_interface back from Ironic instead of believing
      # `make sushy-up`.
      #
      # And note which way (1) decides it: if a live CR rests at not-ready, this
      # kind needs an exemption that does not currently exist, and every healthy
      # BaremetalHost above it would go stalled after an hour without one. If it
      # reads Ready=True-while-inert, no exemption is needed, this kind is the
      # wrong motivating case for the whole feature, and the exposure is a false
      # HEALTHY across the six renderable render sites -- the harder one to see.
      #
      # THE EXPOSURE, counted with a stated predicate because two of us got it
      # wrong first: `grep -rn '^kind: NodeProvision$' charts/*/templates/*.yaml`
      # gives ELEVEN render sites -- baremetal-host 6, baremetal-lifecycle 3,
      # baremetal-discovery 2, one per file, no indented variants, no file that
      # mentions the kind without rendering it. Of those only the baremetal-host
      # SIX are renderable: the other two charts are deprecated and emit `kind:
      # Node`, which no RestDefinition declares, so their output cannot be applied
      # at all. 11 is the template count; 6 is the fleet's.
      #
      # AND A PRECEDENT WORTH CARRYING, because it points the other way. The same
      # shape already happened once: six live NodePower CRs latched at
      # Ready=False/Pending made every BaremetalHost read Ready=False/Creating
      # permanently, naming the power CR, with zero live NodeProvision CRs
      # (2026-11-07). The right fix THERE was to make the child converge, not to
      # declare it terminal -- see restdefinition-power.yaml. So "latched child,
      # declare it terminal" is not a general rule. It is right here only because
      # converging this kind would retry a disk wipe.
      - action: create
        method: PUT
        path: /v1/nodes/{node_id}/states/provision
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          - inPath: node_id
            inCustomResource: spec.node_id
