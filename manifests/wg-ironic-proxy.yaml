# WireGuard tunnel + Keystone-auth Ironic proxy, scoped to the cluster (no host VPN needed).
# The operator pods talk to the in-cluster `ironic` Service; this pod has the WireGuard interface
# and the Keystone proxy share the same netns, so /v1/nodes calls travel:
#   operator pod -> Service ironic:6385 -> this pod:8080 (proxy) -> WG -> real Keystone+Ironic
#
# Requires (created by `make lab-up` from your local files):
#   - Secret  ironic-wg-config              key wg0.conf  (local/wireguard/ironic-lab.conf)
#   - Secret  ironic-clouds                 key clouds.yaml (./clouds.yaml)
#   - ConfigMap keystone-ironic-proxy-script (scripts/keystone-ironic-proxy.py)
---
apiVersion: v1
kind: Namespace
metadata:
  name: openstack
---
# ServiceAccount + RBAC for the kubectl-proxy sidecar inside
# wg-ironic-proxy. Scoped to JUST what the kubernetescluster blueprint's
# bootstrap CP needs to do: patch any BaremetalNode CR's spec.extra
# (publish kubeadm_join / cert_key) and create+get Secrets in openstack
# (workload kubeconfig delivery). NOT cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wg-ironic-proxy
  namespace: openstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wg-ironic-proxy
  namespace: openstack
rules:
  # Bridge mirrors Ironic.node.extra into BaremetalNode CR.spec.extra (kubeadm_join,
  # cert_key). Reaper also touches ports / nodeprovisions / nodepowers when
  # a half-failed helm install leaves them stranded with a stale
  # meta.helm.sh/release-name annotation; patch is needed to strip the
  # finalizer before deleting.
  - apiGroups:
      - baremetal.ogen.krateo.io
    resources:
      - baremetalnodes
      - ports
      - nodeprovisions
      - nodepowers
    verbs:
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wg-ironic-proxy
  namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wg-ironic-proxy
subjects:
  - kind: ServiceAccount
    name: wg-ironic-proxy
    namespace: openstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-ironic-proxy
  namespace: openstack
  labels:
    app: wg-ironic-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wg-ironic-proxy
  template:
    metadata:
      labels:
        app: wg-ironic-proxy
      annotations:
        # bumps with the bridge script so the pod rolls when the script changes
        kubernetescluster.ogen.krateo.io/bridge-revision: "4"
    spec:
      serviceAccountName: wg-ironic-proxy
      containers:
        - name: ironic-extra-bridge
          # Ironic node.extra -> k8s BaremetalNode CR spec.extra bridge.
          # The blade (which can reach Ironic over its OOB network but
          # NOT our wg-tunnel-side mgmt API) publishes its kubeadm_join
          # into Ironic node.extra. This sidecar polls Ironic via the
          # same-pod keystone proxy (127.0.0.1:8080) and propagates
          # to Node.spec.extra so the kubernetes-cluster chart's lookup
          # sees the join command. See
          # scripts/ironic-node-extra-bridge.py for the loop logic.
          image: python:3.13-slim
          command:
            - python3
            - /scripts/ironic-node-extra-bridge.py
          env:
            - name: IRONIC_API_VERSION
              value: "1.109"
            - name: BRIDGE_INTERVAL
              value: "10"
          volumeMounts:
            - name: bridge-script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: mgmt-api-proxy
          # kubectl proxy bound on the wg pod's tunnel interface
          # (198.51.100.5 inside the pod netns). The bare-metal blades
          # reach the management apiserver as http://198.51.100.5:8443
          # via the wg tunnel; this sidecar forwards their requests to
          # the in-cluster kubernetes.default.svc:443 using its own SA
          # token. Auth model: the SA is RBAC-scoped to JUST what the
          # kubernetescluster chart needs the CPs to do (patch the CP's
          # own BaremetalNode CR's spec.extra, create+get Secrets in openstack
          # ns for the workload-kubeconfig delivery).
          #
          # kubectl proxy default port is 8001; --address binds on the
          # wg interface specifically.
          image: rancher/kubectl:v1.31.4
          args:
            - proxy
            - --address=198.51.100.5
            - --port=8443
            - --accept-hosts=.*
            - --accept-paths=.*
            - --reject-paths=^$
            - --disable-filter=true
          # No volumeMounts — uses the projected SA token automatically.
        # L3/L4 TUNNEL ENDPOINT -- no longer an API proxy.
        #
        # This used to run keystone-ironic-proxy.py, which authenticated to Keystone,
        # injected a microversion header, translated merge-JSON PATCH bodies into
        # RFC-6902, and de-chunked request bodies. All four jobs now have homes:
        #
        #   auth          -> apiKey/X-Auth-Token in the OAS; the token Secret is written
        #                    by a secret-manager (ESO/Vault), never by this chart
        #   microversion  -> BaremetalNodeConfiguration.spec.configuration.header, per-verb
        #   PATCH shape   -> requestTransform (gojq) emitting the array; measured
        #                    2026-10-29 that Ironic accepts it under application/json
        #   de-chunking   -> an artifact of BaseHTTPRequestHandler; gone with the script
        #
        # What remains is genuinely transport: WireGuard reaches the lab network, and
        # socat forwards TCP to Ironic. It parses nothing and rewrites nothing, so a
        # request either arrives intact or does not arrive.
        #
        # Base image is alpine, NOT quay.io/airshipit/openstack-client: that image was
        # only ever here for openstacksdk, it is amd64-only on every published tag, and
        # it made the whole pod unschedulable on arm64.
        - name: tunnel
          image: alpine:3.21
          command:
            - sh
            - "-c"
          args:
            - |
              set -e
              apk add --no-cache wireguard-tools iproute2 socat >/dev/null
              install -m 600 /wg-config/wg0.conf /etc/wireguard/wg0.conf
              # On container restart wg0 lingers in the pod netns; tear it down before re-up
              wg-quick down /etc/wireguard/wg0.conf 2>/dev/null || ip link delete wg0 2>/dev/null || true
              echo "[startup] wg-quick up ..."
              wg-quick up /etc/wireguard/wg0.conf
              wg show
              ip -4 addr show wg0 || true
              echo "[startup] forwarding :$LISTEN_PORT -> $IRONIC_ENDPOINT"
              exec socat -d TCP-LISTEN:$LISTEN_PORT,fork,reuseaddr TCP:$IRONIC_ENDPOINT
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: LISTEN_PORT
              value: "8080"
            - name: IRONIC_ENDPOINT
              # host:port of the real Ironic API, reachable only across the tunnel.
              #
              # When recreating a RestDefinition, aim this at a disposable Ironic first:
              # deleting one cascades the generated CRD, and the finalizer drain fires a
              # real DELETE /v1/nodes/{uuid} for every live CR, which would de-enrol the
              # blades from the lab. Measured 2026-10-29.
              value: "172.19.74.1:6385"
          ports:
            - name: api
              containerPort: 8080
          readinessProbe:
            # TCP rather than httpGet: this container no longer speaks HTTP, and a
            # Keystone-protected Ironic would answer an unauthenticated GET with 401
            # and fail an httpGet probe even when the tunnel is perfectly healthy.
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: wg-config
              mountPath: /wg-config
              readOnly: true
      volumes:
        - name: wg-config
          secret:
            secretName: ironic-wg-config
            defaultMode: 0400
        - name: bridge-script
          configMap:
            name: ironic-extra-bridge-script
---
apiVersion: v1
kind: Service
metadata:
  name: ironic
  namespace: openstack
  labels:
    app: wg-ironic-proxy
spec:
  selector:
    app: wg-ironic-proxy
  ports:
    - name: api
      port: 6385
      targetPort: 8080
---
# Reachable from inside the cluster as
# http://mgmt-api.openstack.svc.cluster.local:8443. From the blade
# network it's http://198.51.100.5:8443 (the wg-bound sidecar).
apiVersion: v1
kind: Service
metadata:
  name: mgmt-api
  namespace: openstack
  labels:
    app: wg-ironic-proxy
spec:
  selector:
    app: wg-ironic-proxy
  ports:
    - name: kubectl-proxy
      port: 8443
      targetPort: 8443
