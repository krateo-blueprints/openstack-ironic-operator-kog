# Keystone token refresher.
#
# WHY THIS IS NOT External Secrets Operator
# -----------------------------------------
# ESO was the right instinct and I tried to use it. It cannot do this job:
# Keystone returns the token in the `X-Subject-Token` RESPONSE HEADER, and ESO's
# webhook provider extracts only from the JSON response BODY via `result.jsonPath`
# (https://external-secrets.io/latest/provider/webhook/ — there is no
# header-extraction field in the API spec). Keystone's body carries the catalog
# and roles, never the token id.
#
# The documented workaround is to put something in front of Keystone that copies
# the header into the body — i.e. a proxy, which is exactly what we just removed.
# So ESO here would mean reintroducing a proxy to satisfy a tool choice, which is
# the tail wagging the dog.
#
# WHY THIS IS NOT A PROXY
# -----------------------
# Nothing here sits in a request path. It is a scheduled job that mints a
# credential and writes it to a Secret; the data path stays
# rdc -> Service ironic -> node wg0 -> lab Ironic, with no process in between.
#
# WHY IT HAS TO EXIST AT ALL
# --------------------------
# Keystone Fernet tokens last ~1h and this repo shipped no rotation, which is
# fine for a demo and fatal for provisioning six blades: the token expires
# mid-deploy and every reconcile starts returning 401 with no indication that
# the cause is a clock rather than a config. That is how this lab lost several
# hours today.
#
# Scope is system-scoped (`system: {all: true}`) deliberately — project-scoped
# admin returns 403 on baremetal:port:create for nodes whose owner is not yet
# set, which breaks the enrol step.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keystone-token-refresher
  namespace: openstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keystone-token-refresher
  namespace: openstack
rules:
  # Narrow on purpose: this can rewrite exactly one Secret and read the
  # credentials it needs. A leaked token from this SA cannot read other secrets.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["ironic-keystone-token", "keystone-admin-creds"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keystone-token-refresher
  namespace: openstack
subjects:
  - kind: ServiceAccount
    name: keystone-token-refresher
    namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keystone-token-refresher
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keystone-token-refresher
  namespace: openstack
data:
  refresh.py: |
    #!/usr/bin/env python3
    """Mint a system-scoped Keystone token and patch it into the Secret the
    <Kind>Configuration CRs reference via `tokenRef`.

    Replaces a /bin/sh version that did `apk add --no-cache curl jq` at runtime.
    That install wrote to the root filesystem, so the container could never run
    with `readOnlyRootFilesystem: true` (Trivy KSV-0014) -- and it also meant a
    token refresh failed whenever the alpine mirror was unreachable, on a path
    whose whole job is keeping credentials current.

    Stdlib only, on python:3.13-slim -- the same image `ironic-extra-bridge`
    already uses in this repo, so no new image enters the supply chain.

    Two things the shell version got right that are easy to lose in a rewrite,
    kept deliberately:

      * the token is in the **X-Subject-Token response header**, not in the body.
        That is the reason External Secrets Operator cannot stand in for this.
      * the auth body is built by a JSON serialiser, never by string
        interpolation. `jq --arg` was doing real work: a password containing a
        quote or backslash would corrupt a hand-built body. `json.dumps` is the
        equivalent guarantee.
    """
    import base64
    import json
    import os
    import sys
    import urllib.error
    import urllib.request

    CREDS = "/creds"
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    KAPI = "https://kubernetes.default.svc"
    NAMESPACE = os.environ.get("TOKEN_SECRET_NAMESPACE", "openstack")
    SECRET = os.environ.get("TOKEN_SECRET_NAME", "ironic-keystone-token")
    TIMEOUT = 20


    def read(path):
        with open(path) as fh:
            return fh.read().strip()


    def main():
        auth_url = read(f"{CREDS}/authUrl")
        body = json.dumps({
            "auth": {
                "identity": {
                    "methods": ["password"],
                    "password": {"user": {
                        "name": read(f"{CREDS}/username"),
                        "password": read(f"{CREDS}/password"),
                        "domain": {"name": read(f"{CREDS}/userDomain")},
                    }},
                },
                # System-scoped on purpose: project scope returns 403 on
                # baremetal:port:create. See the manifest header.
                "scope": {"system": {"all": True}},
            }
        }).encode()

        req = urllib.request.Request(
            f"{auth_url}/v3/auth/tokens", data=body, method="POST",
            headers={"Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
                # The token is a HEADER. Reading it from the body would silently
                # yield nothing.
                token = resp.headers.get("X-Subject-Token")
                payload = json.loads(resp.read() or b"{}")
        except urllib.error.HTTPError as e:
            # Never echo the response body: it can carry request detail. The shell
            # version redacted with a regex; not emitting it at all is stronger.
            print(f"keystone auth failed: HTTP {e.code}", file=sys.stderr)
            return 1
        except urllib.error.URLError as e:
            print(f"keystone unreachable: {e.reason}", file=sys.stderr)
            return 1

        if not token:
            print("no X-Subject-Token in the response", file=sys.stderr)
            return 1
        expires = (payload.get("token") or {}).get("expires_at", "unknown")
        print(f"minted token, expires_at={expires}, length={len(token)}")

        patch = json.dumps({"data": {
            "token": base64.b64encode(token.encode()).decode()}}).encode()
        preq = urllib.request.Request(
            f"{KAPI}/api/v1/namespaces/{NAMESPACE}/secrets/{SECRET}",
            data=patch, method="PATCH",
            headers={"Content-Type": "application/strategic-merge-patch+json",
                     "Authorization": f"Bearer {read(f'{SA}/token')}"})
        import ssl
        ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        try:
            with urllib.request.urlopen(preq, timeout=TIMEOUT, context=ctx) as resp:
                if resp.status != 200:
                    print(f"secret patch failed: HTTP {resp.status}", file=sys.stderr)
                    return 1
        except urllib.error.HTTPError as e:
            print(f"secret patch failed: HTTP {e.code}", file=sys.stderr)
            return 1

        print(f"{NAMESPACE}/{SECRET} updated")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
---
# Every 20 minutes against a ~60 minute lifetime: two refreshes may fail
# (Keystone restart, tunnel blip) before anything downstream sees a 401.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keystone-token-refresher
  namespace: openstack
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: keystone-token-refresher
          restartPolicy: OnFailure
          # Hardened 2026-11-04 (Trivy KSV-0014/0118/0001/0003/0012/0020/0021).
          #
          # The previous container was alpine:3.21 running `apk add --no-cache
          # curl jq` at startup. That install writes to the root filesystem, so
          # readOnlyRootFilesystem was impossible -- and a token refresh failed
          # whenever the alpine mirror was unreachable, on the one path whose
          # job is keeping credentials current. Rewritten as a stdlib-only
          # Python script on python:3.13-slim, which `ironic-extra-bridge`
          # already uses here, so no new image enters the supply chain.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: refresh
              image: python:3.13-slim
              command: ["python3", "-I", "/scripts/refresh.py"]
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                privileged: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: creds
                  mountPath: /creds
                  readOnly: true
                # Python needs a writable TMPDIR even though this script no
                # longer writes temp files itself; with readOnlyRootFilesystem
                # there is otherwise nowhere to put one.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: keystone-token-refresher
                defaultMode: 0755
            - name: creds
              secret:
                secretName: keystone-admin-creds
            - name: tmp
              emptyDir: {}
