# RestDefinition for Ironic Node - used by oasgen-provider to generate BaremetalNode CRD
# and deploy rest-dynamic-controller. Requires ConfigMap ironic-node-oas with OAS.
#
# Apply order:
#   1. kubectl create configmap ironic-node-oas -n openstack --from-file=ironic_node.yaml=../oas/ironic-node.yaml
#   2. kubectl apply -f restdefinition-node.yaml
# Note: the configmap key uses '_' (not '-') because KOG's oasPath regex disallows
# hyphens in the filename segment.
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-node-oas/ironic_node.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: BaremetalNode
    identifiers:
      - name
    additionalStatusFields:
      - uuid
      - provision_state
      - power_state
      - target_provision_state
      # Inspection outputs — surfaced in BaremetalNode CR status so the baremetal-discovery
      # composition (or any operator/policy) can read inventory + completion timestamp
      # without going through openstacksdk. `properties` is the freeform object Ironic
      # populates after inspect (cpus, memory_mb, local_gb, cpu_arch, capabilities, ...).
      - properties
      - inspection_started_at
      - inspection_finished_at
      # instance_info: surfaced so the baremetal-host chart's transition-undeploy can detect
      # spec.image vs deployed-image drift and trigger a redeploy without manual intervention.
      - instance_info
      # automated_clean: surfaced so the chart's pre-delete Job can observe the current
      # cleanup mode setting (PATCHes it before driving target=deleted).
      - automated_clean
      # APPEND-ONLY, so safe to add on a live CRD (removal/reorder is not).
      # Needed because a deploy Ironic ACCEPTS (202) and then abandons is
      # otherwise invisible: provision_state falls back to `available`,
      # target_provision_state clears, and the transition CR reports Synced=True
      # because the PUT genuinely succeeded. Ironic's reason exists only in
      # last_error. A node auto-placed into maintenance after repeated failures
      # also refuses later transitions with no visible cause.
      - last_error
      - maintenance
      - maintenance_reason
    # uuid is writable on POST in Ironic (the conductor uses the supplied value instead of
    # generating one). We DROP the excludedSpecFields entry for it so callers can pin a UUID
    # via spec.uuid — required when other Nodes reference this one via parent_node and we
    # need stable IDs across re-enroll. status.uuid still mirrors what Ironic returned.
    # The microversion is NOT a configurationField. CORRECTED 2026-11-11: that is a
    # DELIBERATE choice, not an impossibility. This file used to say "it cannot be",
    # because oasgen emitted the Configuration property as `header` (singular, from the
    # OAS "in" value) while rest-dynamic-controller read `headers` (plural) and the
    # lookup missed with no error -- oasgen #304. True when written, and FIXED upstream
    # in 0.44.0 (#304) and 0.50.0 (#305/#392), with 0.43.0 as the negative control.
    #
    # MEASURED on rdc 0.54.1: with the static per-verb headers removed and a
    # Configuration set to a distinctive 1.95, the wire carried 1.95 twice with 0 406s.
    # The full run is in oas/ironic-port.yaml -- one place, not seven.
    #
    # Static per-verb headers stay because NO CHART RENDERS A Configuration CR. Every
    # *Configuration here is a hand-applied singleton in manifests/, so a
    # Configuration-only route can be forgotten at install time, and Ironic answers a
    # missing microversion by silently serving its 1.1 minimum rather than by failing.
    #
    # Measured here before the cause was known: X-Auth-Token reached the wire (proving the
    # Configuration resolves and spec.authentication applies) while
    # X-OpenStack-Ironic-API-Version never did. Ironic then negotiated its MINIMUM, 1.1 --
    # which does not fail loudly, it silently serves the 2014 API: node lookup by name
    # 404s (names need >= 1.5) and parent_node is rejected (needs >= 1.83).
    #
    # Static per-verb headers take a different code path (injected directly, after
    # applyConfigSpec) and do ship. That is also the better home for this value: the
    # microversion is a property of the API contract this document describes, not
    # per-install configuration an operator should have to supply.
    #
    # The old keystone proxy injected this header on every call, which is why removing the
    # proxy is what surfaced the gap.
    verbsDescription:
      # DROP THE MASKED PASSWORD FROM THE OBSERVED BODY (both observe verbs).
      #
      # Ironic never returns driver_info.redfish_password; it returns the literal "******".
      # The CR holds the real value, so spec and response can NEVER converge and RDC re-issues
      # the update forever. Measured here: 783 PATCHes before 0.41.0's non-convergence guard
      # tripped and set Ready=False/DriftNotConverging, whose own message names this fix --
      # "a request/response shape divergence in the API description, fixable with
      # responseTransform on the observe verb".
      #
      # Deleting the key (rather than trying to substitute the real value, which jq cannot do
      # -- a responseTransform sees only the response, never the spec) is what actually stops
      # it: comparison.CompareExisting walks the SPEC's keys and looks each one up in the
      # response, and a key absent from the response is skipped outright. A key present with
      # "******" is a difference; a key that is not there is not compared at all.
      #
      # This loses nothing. Drift on a write-only field that the API refuses to disclose is
      # not detectable by any client, so there was never a real signal here to give up -- only
      # a false one. Changing the password still works: it goes out on the next update like
      # any other driver_info field, it just can't be confirmed by reading it back.
      #
      # Needed on BOTH verbs because exactly one of them produces the observed body
      # (restResources.go picks `get` for a known resource, `findby` before the uuid is known)
      # and each normalizes with only its own transforms. findby applies it per list item,
      # before matching, so the shape is the same in both cases: a single node object.
      #
      # Upstream as oasgen #309 -- the generic form of this is any API that masks a write-only
      # field on read.
      - action: findby
        method: GET
        path: /v1/nodes
        # v2026-11-04: Ironic's node COLLECTION omits child nodes unless asked.
        # Measured: GET /v1/nodes -> 3 nodes; ?include_children=true -> 17.
        # blade01/04/05/06 are children of an enclosure and are ABSENT without
        # this, so findby is structurally blind to them — not a pagination edge,
        # the items are simply not in the only response the matcher sees.
        # RDC reads `queries` (builder.go:87 -> :148); the GENERATOR does not,
        # so this changes the RestDefinition only and regenerates no CRD.
        queries:
          - name: include_children
            value: "true"
        identifiersMatchPolicy: OR
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        responseTransform:
          inline: 'if (.driver_info | type) == "object" then .driver_info |= del(.redfish_password) else . end'
      - action: get
        method: GET
        path: /v1/nodes/{uuid}
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        responseTransform:
          inline: 'if (.driver_info | type) == "object" then .driver_info |= del(.redfish_password) else . end'
        requestFieldMapping:
          # Ironic accepts the node NAME as the {ident} in /v1/nodes/{ident}, so map the
          # path param to spec.name (always known) instead of the uuid (unknown until
          # after create). This makes observe = GET /v1/nodes/<name> -> 404 (create) or 200.
          - inPath: uuid
            inCustomResource: spec.name
      - action: create
        method: POST
        path: /v1/nodes
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        # THE BMC PASSWORD COMES FROM A SECRET, NOT FROM THE CR.
        #
        # Until now `driver_info.redfish_password` sat in plaintext in every
        # BaremetalNode CR and in every example manifest here. A secretRef resolver
        # substitutes the value from a Secret in the CR's OWN namespace at request time
        # (there is no field to name another one), so the CR carries only the name.
        #
        # WHY THE CARRIER IS `spec.extra.*` AND NOT A NEW SPEC FIELD. The resolver's
        # nameFromCustomResource/keyFromCustomResource are JSONPaths into the CR, and the
        # CR spec is generated from the OAS. oasgen has `additionalStatusFields` but NO
        # spec counterpart, so a spec-only property cannot be declared at all. Ironic's
        # `extra` is a free-form object (additionalProperties: true) intended for exactly
        # this kind of operator metadata, so `spec.extra.bmc_secret.name` is expressible
        # with NO OAS change and NO CRD regeneration -- which matters here, because
        # regenerating the node CRD unserves its old version and wedges every
        # kubernetes-cluster render until the parent chart's pin moves. The Secret's NAME
        # is not sensitive, and Ironic storing it in `extra` makes the binding visible
        # from the vendor side.
        #
        # THE `when` GUARD IS MANDATORY, NOT A NICETY. readStringPath
        # (rdc internal/tools/fieldmapping/resolver.go:123) returns an ERROR when the path
        # is absent, and ResolveRequestResolvers propagates it, so WITHOUT the guard every
        # existing CR that names no Secret would stop reconciling. With it, a CR that omits
        # bmc_secret.name skips the mapping entirely -- no Secret is read, nothing is
        # written to the request -- and the plaintext value flows exactly as before.
        # `bmc_secret.key` must be set alongside the name: it is a SECOND, UNGUARDED read,
        # and its absence is a loud error naming the path.
        #
        # AND THE GUARD IS ONLY SAFE BECAUSE inCustomResource DOES NOT ALIAS inBody.
        # oasgen warned that a guard which does not hold omits the field with no error.
        # That is true when inCustomResource names inBody's own location, because
        # stripResolverSources then deletes it. Here the pointer object is a different
        # path, so a skipped mapping leaves the body exactly as step 3 assembled it from
        # spec: a legacy CR's plaintext password still ships, unchanged.
        #
        # DO NOT ADD A jq valueMapping TO THIS ENTRY. On a request-direction entry a jq
        # valueMapping makes BuildCallConfig skip the mapping ENTIRELY (rdc
        # internal/tools/fieldmapping/fieldmapping.go:10-13 and 21-24), so the field would
        # never reach the outgoing body and the password would silently stop shipping.
        #
        # `fieldMapping`, not the `requestFieldMapping` used by the other verbs here: the
        # latter is deprecated and "carries no value transform" (oasgen types.go:591-595),
        # so it cannot hold a resolver at all.
        fieldMapping:
          - inBody: driver_info.redfish_password
            # NO inCustomResource, AND THAT IS THE FIX -- MEASURED, NOT REASONED.
            #
            # This entry first named `spec.driver_info.redfish_password` here, which aliases
            # inBody and would have had stripResolverSources delete the resolved value.
            # It then named `spec.extra.bmc_secret`, the pointer object, which avoided the
            # aliasing and introduced a WORSE failure that only a cluster showed:
            #
            #   stripResolverSources removes inCustomResource from the REQUEST body, so
            #   Ironic stored `extra: {}` while the CR's spec kept `extra.bmc_secret`.
            #   The drift comparison reports that as
            #     "field extra: object is set in the custom resource but empty on the
            #      remote; the update has been issued 5 times without resolving it"
            #   -> five real PATCHes against the vendor, then Ready=False/DriftNotConverging
            #   permanently. Measured on a kind cluster at oasgen 0.61.0, 2026-11-14.
            #
            # Omitting inCustomResource skips the strip entirely (builder.go:474 returns
            # early on an empty value), so the pointer rides into Ironic's `extra`, spec and
            # response agree, and the node reaches Ready=True/Available with ZERO updates.
            # Three arms, one variable each, same cluster:
            #
            #   inCustomResource = pointer object   DriftNotConverging  extra={}  5 PATCHes
            #   inCustomResource OMITTED            Available           extra={bmc_secret}  0
            #   no pointer at all (control)         no updates          -- baseline is clean
            #
            # `driver_info.redfish_password` came back `******` in BOTH arms, so the resolver
            # works either way; only convergence differs.
            #
            # THE COST, ACCEPTED: the Secret's NAME and KEY are stored in Ironic's `extra`.
            # Neither is sensitive, `extra` exists for operator metadata, and it makes the
            # binding visible from the vendor side. The alternative -- stripping it -- is
            # what breaks, because Ironic echoes `extra` back.
            #
            # DO NOT "RESTORE" inCustomResource FOR BETTER ERROR MESSAGES. It is the label
            # rdc uses when a resolver fails, which is a real loss, and it is not worth five
            # vendor writes and a permanently non-Ready CR.
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.extra.bmc_secret.name
              secretRef:
                nameFromCustomResource: spec.extra.bmc_secret.name
                keyFromCustomResource: spec.extra.bmc_secret.key
      # Ironic's PATCH is RFC-6902 ONLY: it requires a JSON array of operations and
      # rejects a merge-style object with 400 "Schema error for patch: {} is not of type
      # 'array'". KOG emits a merge object, so this used to be translated by
      # _diff_to_json_patch in the keystone proxy. requestTransform replaces that
      # translation in-band, which is why the proxy is no longer needed for it.
      #
      # to_entries/map builds one "replace" op per field RDC wants to change. Leading
      # "/" on the pointer is required by RFC-6902. An empty body maps to [], which
      # Ironic accepts as a no-op -- RDC currently fires a PATCH even with nothing to
      # change, and [] makes that harmless instead of a 400.
      #
      # Caveat: PATCH during `cleaning` clears instance_info — keep `update` calls limited
      # to states where it is safe (manageable / available / active) by gating from the chart.
      - action: update
        method: PATCH
        path: /v1/nodes/{uuid}
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestTransform:
          inline: 'to_entries | map({op: "replace", path: ("/" + .key), value: .value})'
        # Migrated from `requestFieldMapping` so this verb carries ONE list: the resolver
        # below cannot live on the deprecated field. Semantically identical -- oasgen
        # treats each requestFieldMapping entry "as an equivalent request-direction
        # FieldMappingItem at load time" (types.go:591-593).
        fieldMapping:
          - inPath: uuid
            inCustomResource: spec.name
          # The resolved password lands in the body BEFORE the requestTransform above runs:
          # ApplyRequestTransform is called from Create/Update/Delete AFTER the body is
          # assembled (rdc fieldmapping.go:25-26). So `to_entries` sees driver_info already
          # carrying the secret value and emits it inside the /driver_info replace op. If
          # that order were reversed the rotation would silently never ship, because the
          # transform's output is an ARRAY of ops with no driver_info key to fill.
          - inBody: driver_info.redfish_password
            # NO inCustomResource -- see the create verb above. Naming the pointer object
            # here makes stripResolverSources empty Ironic's `extra`, which is permanent
            # non-converging drift. Measured; do not restore it.
            resolver:
              type: secretRef
              when:
                customResourceFieldPresent: spec.extra.bmc_secret.name
              secretRef:
                nameFromCustomResource: spec.extra.bmc_secret.name
                keyFromCustomResource: spec.extra.bmc_secret.key
      - action: delete
        method: DELETE
        path: /v1/nodes/{uuid}
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          # Ironic accepts the node NAME as the {ident} in /v1/nodes/{ident}, so map the
          # path param to spec.name (always known) instead of the uuid (unknown until
          # after create). This makes observe = GET /v1/nodes/<name> -> 404 (create) or 200.
          - inPath: uuid
            inCustomResource: spec.name
