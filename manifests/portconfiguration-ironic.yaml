# Singleton PortConfiguration for the Ironic endpoint.
# Same rationale as nodeconfiguration-ironic.yaml: kept out of the per-node lifecycle release
# so rest-dynamic-controller still has it at delete-time. Applied by `make restdef-up`.
---
apiVersion: baremetal.ogen.krateo.io/v1alpha1
kind: PortConfiguration
metadata:
  name: ironic-endpoint
  namespace: openstack
spec:
  # Keystone auth. EVERY Configuration kind needs its own authentication block -- the
  # BaremetalNodeConfiguration's does not cover Ports. Measured 2026-10-29: with auth on
  # the node config alone, node calls reached Ironic (400 on a body problem) while port
  # calls returned a bare 401, which is easy to misread as a token fault rather than a
  # missing config. See nodeconfiguration-ironic.yaml for the rotation contract.
  authentication:
    apiKey:
      header: X-Auth-Token
      tokenRef:
        name: ironic-keystone-token
        namespace: openstack
        key: token
  # Only verbs declared by restdefinition-port.yaml are accepted here. Port has findby/
  # create/delete (no `get`: GET /v1/ports/{uuid} is addressed by uuid, which we don't have
  # at observe-time; the RestDef relies on findby on MAC to resolve the port).
  # spec.configuration REMOVED 2026-11-08, same reason as
  # nodeconfiguration-ironic.yaml: it carried the #304 shape -- `header`
  # SINGULAR, per verb -- which rest-dynamic-controller never reads, because it
  # looks up `headers` plural. Inert, and restdefinition-port.yaml carries the
  # working mechanism (static per-verb `headers:`).
  #
  # /code-review predicted `make restdef-up` would now DIE here, since the node
  # and power Configuration CRDs accept only `spec.authentication`. Measured
  # instead: the PortConfiguration CRD still accepts
  # ['authentication', 'configuration'] and a server-side dry-run of this file
  # says "unchanged". So the prediction was a generalisation from two sibling
  # CRDs, and restdef-up was not broken.
  #
  # But it applied only because THAT CRD IS STALE -- oasgen does not regenerate
  # an existing CRD on upgrade (#453), so it still declares a field the 0.54.1
  # generator no longer emits. Removing the field now means this manifest does
  # not break on the day someone runs `make regenerate-crds`.
