# RestDefinition for Ironic Allocation - oasgen-provider generates the Allocation CRD + controller.
# Apply: create configmap ironic-allocation-oas from ../oas/ironic-allocation.yaml
#        (key ironic_allocation.yaml), then apply this file.
# Addressed by uuid or name; Ironic resolves name as the {ident}, so get/delete map the
# path id from spec.name (known pre-create). Allocations are immutable - no update verb.
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-allocation
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-allocation-oas/ironic_allocation.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: Allocation
    identifiers:
      - name
    additionalStatusFields:
      - uuid
      - state
      - node_uuid
    # NO excludedSpecFields, and NO X-Ironic-Endpoint configurationField. Both were
    # here and both were inert; removing them clears two of the eight
    # `reason=SchemaWarnings` generation errors this repo was shipping.
    #
    #   excludedSpecFields: [uuid] -- oasgen builds the spec from the *Create* schema,
    #     and `uuid` is absent from every *Create schema in oas/. So it excluded a field
    #     that was never in the spec. `uuid` is surfaced via additionalStatusFields.
    #   X-Ironic-Endpoint -- declared in ZERO OAS documents. Measured with a control:
    #     the same grep hits X-OpenStack-Ironic-API-Version 6x in oas/ironic-port.yaml.
    #
    # The microversion configurationField below is NOT dead: it is a real OAS parameter,
    # and the route was measured working on rdc 0.54.1 -- a Configuration set to a
    # distinctive 1.95 reached the wire twice, 0 406s. That run was on Port; the other
    # three kinds share the mechanism, not the measurement. Do not remove it with these.
    configurationFields:
      - fromOpenAPI:
          name: X-OpenStack-Ironic-API-Version
          in: header
        fromRestDefinition:
          actions:
            - "*"
    verbsDescription:
      - action: findby
        method: GET
        path: /v1/allocations
        identifiersMatchPolicy: OR
      - action: get
        method: GET
        path: /v1/allocations/{uuid}
        requestFieldMapping:
          - inPath: uuid
            inCustomResource: spec.name
      - action: create
        method: POST
        path: /v1/allocations
      - action: delete
        method: DELETE
        path: /v1/allocations/{uuid}
        requestFieldMapping:
          - inPath: uuid
            inCustomResource: spec.name
