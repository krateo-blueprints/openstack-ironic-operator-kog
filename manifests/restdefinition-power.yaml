# RestDefinition for the Ironic power-state action (one CR per power request).
# Mirrors restdefinition-provision.yaml: KOG generates a NodePower CRD + RDC. Creating a
# NodePower CR fires PUT /v1/nodes/{node_id}/states/power once (202 -> Pending guard
# prevents re-fire, same pattern as NodeProvision).
#
# Use case: charts/baremetal-lifecycle (and later baremetal-host) render a NodePower CR
# when spec.online toggles. The chart renames the CR when target changes so KOG sees a
# fresh CR and the PUT fires a new time. Idempotency of "already powered on" is handled by
# Ironic itself (returns 409 if already in the target state).
#
# Apply order:
#   1. kubectl create configmap ironic-power-oas -n openstack --from-file=power.yaml=../oas/ironic-power.yaml
#   2. kubectl apply -f restdefinition-power.yaml
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node-power
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-power-oas/power.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: NodePower
    # MECHANISM CORRECTED 2026-11-04. findby never matches, which is what this
    # design wants (one PUT, then the 202 Pending condition suppresses re-fire)
    # -- but the reason written here for two weeks was not the reason operating.
    #
    # Stated reason:  node_id is not a field on Ironic's listed nodes, so the
    #                 comparison finds no match.
    # Actual reason:  node_id is absent from the CR entirely. Measured on all
    #                 six live NodePower CRs: `node_id` is in NEITHER spec NOR
    #                 status. oasgen's `isInResource` compares a response value
    #                 against spec.<path> then status.<path>; with both missing
    #                 it cannot compare at all, and returns the same
    #                 (false, nil) it returns for "compared and differed".
    #
    # The spec property is suppressed by the `requestFieldMapping` below --
    # oasgen-provider#419. So the match is impossible one layer earlier than
    # the comment claimed, and the stated mechanism has never been reached.
    #
    # Why this matters rather than being pedantry: when #419/#421 restores the
    # spec property, the stated mechanism TAKES OVER from the actual one and
    # the outcome stays identical (node_id still is not a field on listed
    # nodes, so the lookup skips it). The comment would become true by
    # accident, via an unrelated fix, having been causally wrong throughout.
    # A claim that is predictively right and causally wrong is the kind nothing
    # ever falsifies.
    #
    # THE GUARD IS NOW MEASURED, 2026-11-07. Until today "the 202 Pending condition
    # suppresses re-fire" was asserted, not observed -- and oasgen #485 is the same
    # code path (unmatched findby -> absence -> create), so a failure here would be a
    # duplicate power PUT. Full rdc log, 335 lines, 6 live NodePower CRs:
    #
    #   323 "event":"observe"   318 "External resource is up to date"
    #     0 create events       -> the PUT has not re-fired, once, ever
    #     5 "Cannot observe external resource"  -> ALL DNS at pod start:
    #       lookup ironic.openstack.svc.cluster.local on 10.96.0.10:53:
    #       read: connection refused
    #
    # Those five are not matching failures. Read as such they would have "confirmed"
    # the never-match story with infrastructure noise. Still unestablished: what makes
    # steady-state observes report up-to-date. "Performing REST call" appears only 5
    # times, but that message's emission conditions are unknown, so this does NOT
    # license "steady-state observes skip the HTTP call".
    identifiers:
      - node_id
    additionalStatusFields:
      - uuid
      - power_state
      - target_power_state
    verbsDescription:
      - action: findby
        method: GET
        path: /v1/nodes
        # v2026-11-04: Ironic's node COLLECTION omits child nodes unless asked.
        # Measured: GET /v1/nodes -> 3 nodes; ?include_children=true -> 17.
        # blade01/04/05/06 are children of an enclosure and are ABSENT without
        # this, so findby is structurally blind to them — not a pagination edge,
        # the items are simply not in the only response the matcher sees.
        # RDC reads `queries` (builder.go:87 -> :148); the GENERATOR does not,
        # so this changes the RestDefinition only and regenerates no CRD.
        queries:
          - name: include_children
            value: "true"
        identifiersMatchPolicy: OR
      - action: create
        method: PUT
        path: /v1/nodes/{node_id}/states/power
        requestFieldMapping:
          - inPath: node_id
            inCustomResource: spec.node_id
