# RestDefinition for the Ironic power-state action (one CR per power request).
# Mirrors restdefinition-provision.yaml: KOG generates a NodePower CRD + RDC. Creating a
# NodePower CR fires PUT /v1/nodes/{node_id}/states/power once (202 -> Pending guard
# prevents re-fire, same pattern as NodeProvision).
#
# Use case: charts/baremetal-lifecycle (and later baremetal-host) render a NodePower CR
# when spec.online toggles. The chart renames the CR when target changes so KOG sees a
# fresh CR and the PUT fires a new time. Idempotency of "already powered on" is handled by
# Ironic itself (returns 409 if already in the target state).
#
# Apply order:
#   1. kubectl create configmap ironic-power-oas -n openstack --from-file=power.yaml=../oas/ironic-power.yaml
#   2. kubectl apply -f restdefinition-power.yaml
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-node-power
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-power-oas/power.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: NodePower
    # MECHANISM, MEASURED 2026-11-07. findby never matches, which is what this
    # design wants (one PUT, then the 202 Pending condition suppresses
    # re-fire). Three different reasons have been written here; this is the
    # first one that was read off the cluster rather than reasoned about.
    #
    # Measured, served CRD `nodepowers.baremetal.ogen.krateo.io` v1-0-0:
    #   spec.properties = [X-OpenStack-Ironic-API-Version, configurationRef,
    #                      node_id, target, timeout]
    #   spec.required   = [X-OpenStack-Ironic-API-Version, configurationRef,
    #                      node_id, target]
    # Measured, all six live NodePower CRs:
    #   spec.node_id = blade01 .. blade06   (status.node_id absent)
    #
    # So the CR side is fully populated and `node_id` is REQUIRED. The match
    # fails on the RESPONSE side: `isInResource` compares a value taken from
    # the response against spec.<path> then status.<path>, and Ironic's
    # /v1/nodes items carry `name`, never `node_id` -- so there is no response
    # value to compare.
    #
    # And the reason there was none was an omission, not a property of Ironic:
    # oas/ironic-power.yaml documented the findby as "matched on node_id,
    # lifted from `name` by a responseTransform", and no responseTransform had
    # ever been written here. RESOLVED 2026-11-07 -- the transform is now on the
    # findby verb below, together with the second lift the chart also always
    # assumed (`target` from `power_state`) and the microversion header that
    # makes `include_children` real. The paragraph above describes why findby
    # used to fail and is kept for that reason only; it no longer describes
    # current behaviour.
    #
    # restdefinition-provision.yaml still has no responseTransform and has NOT
    # been changed. Its findby still never matches. Do not assume this change
    # applies there by symmetry -- that file has zero live CRs, so nothing
    # about it has been measured either way.
    #
    # The two superseded reasons, kept because the error has a shape worth
    # recognising:
    #   (a) "node_id is not a field on listed nodes"          -- right about
    #       the response side, but offered with no measurement of either side.
    #   (b) "node_id is absent from the CR entirely, the spec property is
    #       suppressed by requestFieldMapping (oasgen#419)"   -- FALSE. Written
    #       2026-11-04 as a correction OF (a), and falsified on 2026-11-07 by
    #       reading the served CRD and the six CRs: the property is present and
    #       required, and every CR carries a value.
    #
    # Note what (b) cost. On 2026-11-07 it was passed to two other teams as
    # primary evidence, and one of them derived a real hazard from it -- that
    # oasgen#421 restoring a suppressed path-param property as `required`
    # would make the next write to all six CRs fail validation. Sound
    # reasoning, false premise: the property is already there and already
    # required, so #421 changes nothing here. A wrong mechanism does not stay
    # local; it becomes someone else's correct deduction.
    #
    # A claim that is predictively right and causally wrong is the kind nothing
    # ever falsifies -- which is why (a), (b) and this block all predicted the
    # same observable and only one of them survives measuring it.
    #
    # THE GUARD IS NOW MEASURED, 2026-11-07. Until today "the 202 Pending condition
    # suppresses re-fire" was asserted, not observed -- and oasgen #485 is the same
    # code path (unmatched findby -> absence -> create), so a failure here would be a
    # duplicate power PUT. Full rdc log, 335 lines, 6 live NodePower CRs:
    #
    #   323 "event":"observe"   318 "External resource is up to date"
    #     0 create events       -> the PUT has not re-fired, once, ever
    #     5 "Cannot observe external resource"  -> ALL DNS at pod start:
    #       lookup ironic.openstack.svc.cluster.local on 10.96.0.10:53:
    #       read: connection refused
    #
    # Those five are not matching failures. Read as such they would have "confirmed"
    # the never-match story with infrastructure noise. Still unestablished: what makes
    # steady-state observes report up-to-date. "Performing REST call" appears only 5
    # times, but that message's emission conditions are unknown, so this does NOT
    # license "steady-state observes skip the HTTP call".
    # CONVERGENT AS OF 2026-11-07, AND MEASURED. Everything this file used to say
    # about a "fire-once" design is superseded by the verbs below -- kept short
    # here rather than deleted, because the history is why the fix is shaped the
    # way it is.
    #
    # Measured immediately after applying it, all six live NodePower CRs:
    #   Ready = True, reason=Available          (observed, not latched)
    #   status.node_id    = blade01 .. blade06  (lifted from `name`)
    #   status.power_state = "power on"         (lifted, and compared)
    #   status.uuid        = populated          (additionalStatusFields, finally)
    #   spec.target == status.power_state  =>  no drift  =>  no PUT fired
    #
    # All six matched, including blade01/04/05/06, which are enclosure CHILDREN.
    # The microversion header on findby is required for that: `include_children`
    # needs >= 1.83 and children are absent from the collection without it.
    #
    # A CLAIM MADE HERE AND RETRACTED THE SAME DAY: that without the header the
    # transform "would have matched 2 of 6 while looking like it worked". Not
    # measured, and not possible. restdefinition-provision.yaml records the
    # 2026-11-04 measurement: `include_children` without a microversion returns
    # 406 "The minimal required API version should be 1.83". A 406 returns NO
    # nodes, so the outcome would have been 0 of 6 WITH AN ERROR. Three things
    # changed in one edit here -- transform, headers, update verb -- and 6 of 6
    # is a measurement of the bundle, not of any member.
    #
    # A SECOND MECHANISM WAS WRITTEN HERE AND IS ALSO WRONG. It said: this findby
    # ran with `include_children` and no microversion for days while the rdc
    # logged 318 "External resource is up to date" and 5 errors (all DNS), so a
    # 406 must have been on the wire each time and the not-found-plus-`Pending`
    # path folded it into a benign state.
    #
    # Refuted by the oasgen-provider session, from code: `IsNotFoundError` is
    # STRICTLY 404, so a 406 cannot reach the `Pending` guard at all -- it falls
    # through to the error path, is logged at Error and returned to the runtime.
    # Two declarations WOULD produce that folding -- `notFoundCodes` (remaps a
    # declared status to a 404) and `tolerateCodes` (turns a declared status into
    # a success with no body, which reads as up-to-date, no `Pending` needed) --
    # and NEITHER IS DECLARED ANYWHERE in this repo's manifests, oas or charts.
    # Grepped 2026-11-07 with a positive control.
    #
    # So the 406 was not on that path, and THE 318 ARE STILL UNEXPLAINED. Do not
    # write a third mechanism here without measuring it. The surviving lead is in
    # the Pending-guard block below: "Performing REST call" appears 5 times in a
    # 335-line log covering 323 observes, which would mean the findby HTTP call
    # was not being issued on most reconciles -- but that message's emission
    # conditions are unknown, so it licenses nothing yet. The measurement that
    # will settle it is on `provision`, which has zero live CRs: apply the
    # transform WITHOUT the microversion header, create one throwaway CR,
    # observe; then add the header and observe again. One variable, two numbers.
    #
    # WHAT IT REPLACED, in one paragraph. findby never matched, because the
    # responseTransform that charts/baremetal-host/templates/transition-power.yaml
    # has always described was never written. oasgen's latch then took over --
    # restResources.go: not-found + a `Pending` condition makes Observe report
    # "exists and up to date" WITHOUT having observed anything -- so nothing
    # re-fired, `Ready` could never be True, and additionalStatusFields could
    # never populate. One mechanism served the re-fire guard and destroyed
    # observability, and the second was the price of the first. Measured in that
    # state: 323 observes, 318 "up to date", 0 creates, and six CRs latched at
    # Ready=False/Pending indefinitely.
    #
    # It also ran upward: core-provider's roll-up counts a `Pending` child as
    # converging, so every BaremetalHost composition reported
    # Ready=False/Creating permanently, naming the power CR. That is now filed as
    # oasgen-provider#509 for the general case -- a kind that genuinely cannot be
    # observed still needs an answer. This kind did not need one: it has a
    # desired field and an observable one, so it was an ordinary resource all
    # along and the latch was hiding that.
    #
    # The trade accepted knowingly: NodePower is now CONVERGENT. A blade powered
    # off out-of-band will be powered back on, because that is drift. That is the
    # stated intent -- "the whole point of the chart is continuous power
    # enforcement" -- and it is why the suppression had to move from a latch to a
    # comparison.
    identifiers:
      - node_id
    additionalStatusFields:
      - uuid
      - power_state
      - target_power_state
    verbsDescription:
      - action: findby
        method: GET
        path: /v1/nodes
        # The microversion, as a STATIC PER-VERB header. Not via the
        # Configuration: oasgen generates that property as `header` (singular,
        # from the OAS "in" value) while rest-dynamic-controller looks up
        # `headers` (plural), so the lookup misses and the header is dropped
        # with no error -- oasgen #304. Static per-verb headers take a
        # different code path and do ship, which is why restdefinition-node.yaml
        # carries this on all five of its verbs and its findby really does
        # return 17 nodes.
        #
        # Required here for two separate reasons, added 2026-11-07:
        #  1. `include_children=true` below needs microversion >= 1.83. Without
        #     a microversion Ironic negotiates its MINIMUM (1.1) and the four
        #     blades that are enclosure CHILDREN -- blade01, 04, 05, 06 -- are
        #     simply absent from the only response the matcher sees. The
        #     transform below would then match 2 of 6 and look like it worked.
        #  2. Node lookup by name needs >= 1.5, and `name` is what the
        #     transform lifts.
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        # THE TRANSFORM THE DESIGN HAS ALWAYS ASSUMED, written 2026-11-07.
        #
        # charts/baremetal-host/templates/transition-power.yaml has described
        # this since the CR was given a stable name: "its findby lifts the
        # node's observed power state onto `target`, so RDC compares desired
        # against actual every reconcile and calls update whenever they
        # diverge." It was never implemented. Measured consequence before this:
        # 323 observes, 318 "up to date", 0 creates, no status fields, and six
        # CRs latched at Ready=False/Pending forever.
        #
        # TWO lifts are needed and only one is obvious:
        #  - `node_id` from `name`, so findby matches at all. `isInResource`
        #    compares a value taken FROM THE RESPONSE against spec/status, and
        #    Ironic's node objects carry `name`, never `node_id` -- so without
        #    this there is nothing to compare and the match cannot succeed.
        #  - `target` from `power_state`, so DRIFT is visible.
        #    comparison.CompareExisting walks the SPEC's keys and looks each one
        #    up in the response; `target` is absent from a node object, so it
        #    would be skipped outright and no divergence could ever be seen.
        #    Lifting it is what turns "blade is off, spec says power on" into a
        #    difference.
        #
        # Applied per list item, before matching, so the input is one node
        # object. Guarded on each field: a node may legitimately have a null
        # `name`, and adding a null key is worse than adding none.
        responseTransform:
          inline: '(if .name then .node_id = .name else . end) | (if .power_state then .target = .power_state else . end)'
        # v2026-11-04: Ironic's node COLLECTION omits child nodes unless asked.
        # Measured: GET /v1/nodes -> 3 nodes; ?include_children=true -> 17.
        # blade01/04/05/06 are children of an enclosure and are ABSENT without
        # this, so findby is structurally blind to them — not a pagination edge,
        # the items are simply not in the only response the matcher sees.
        # RDC reads `queries` (builder.go:87 -> :148); the GENERATOR does not,
        # so this changes the RestDefinition only and regenerates no CRD.
        queries:
          - name: include_children
            value: "true"
        identifiersMatchPolicy: OR
      - action: create
        method: PUT
        path: /v1/nodes/{node_id}/states/power
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          - inPath: node_id
            inCustomResource: spec.node_id
      # THE VERB THE CHART'S "the update RDC already performs" REFERS TO.
      # It did not exist until 2026-11-07, so that sentence performed nothing
      # and no power drift was ever corrected.
      #
      # Same endpoint as `create`, which reads oddly and is correct: Ironic has
      # no create/update distinction for power, only "drive to this state".
      # `create` is kept rather than deleted because findby can still fail to
      # match -- a node absent from the collection, or renamed in Ironic -- and
      # that path must still drive the state rather than do nothing.
      #
      # requestTransform pins the body instead of trusting RDC's diff to contain
      # exactly the right keys. Ironic's power endpoint takes {"target": ...}
      # plus an optional timeout and rejects a body with foreign fields, and the
      # spec also carries node_id, configurationRef and the microversion, none
      # of which belong in it.
      - action: update
        method: PUT
        path: /v1/nodes/{node_id}/states/power
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestTransform:
          inline: '{target: .target} + (if .timeout then {timeout: .timeout} else {} end)'
        requestFieldMapping:
          - inPath: node_id
            inCustomResource: spec.node_id
