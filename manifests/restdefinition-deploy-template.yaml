# RestDefinition for Ironic DeployTemplate - oasgen-provider generates the CRD + controller.
# Apply: create configmap ironic-deploy-template-oas from ../oas/ironic-deploy-template.yaml
#        (key ironic_deploy_template.yaml), then apply this file.
# Standalone (no Node needed); addressed by uuid or name; get/delete map the path id from
# spec.name (known pre-create). No update verb (Ironic PATCH is JSON-Patch only).
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-deploy-template
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-deploy-template-oas/ironic_deploy_template.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: DeployTemplate
    identifiers:
      - name
    additionalStatusFields:
      - uuid
    # NO excludedSpecFields, and NO X-Ironic-Endpoint configurationField. Both were
    # here and both were inert; removing them clears two of the eight
    # `reason=SchemaWarnings` generation errors this repo was shipping.
    #
    #   excludedSpecFields: [uuid] -- oasgen builds the spec from the *Create* schema,
    #     and `uuid` is absent from every *Create schema in oas/. So it excluded a field
    #     that was never in the spec. `uuid` is surfaced via additionalStatusFields.
    #   X-Ironic-Endpoint -- declared in ZERO OAS documents. Measured with a control:
    #     the same grep hits X-OpenStack-Ironic-API-Version 6x in oas/ironic-port.yaml.
    #
    # The microversion configurationField below is NOT dead: it is a real OAS parameter,
    # and the route was measured working on rdc 0.54.1 -- a Configuration set to a
    # distinctive 1.95 reached the wire twice, 0 406s. That run was on Port; the other
    # three kinds share the mechanism, not the measurement. Do not remove it with these.
    configurationFields:
      - fromOpenAPI:
          name: X-OpenStack-Ironic-API-Version
          in: header
        fromRestDefinition:
          actions:
            - "*"
    # MICROVERSION, PINNED STATICALLY PER VERB -- added 2026-11-12, and the reason
    # is measured rather than stylistic. This kind shipped for months installed by
    # nothing. The first time it was installed and driven, every create failed:
    #
    #     PortGroup       create failed: unexpected status: 404
    #     DeployTemplate  create failed: unexpected status: 405
    #
    # Ironic defaults to microversion 1.1 when no header is sent, and the OAS itself
    # says >=1.55 is required for deploy templates,
    # so at 1.1 the endpoint is not there to POST to. Nothing was wrong with the
    # RestDefinition's shape -- scripts/check-restdefinition-shape.py passes it, and
    # correctly, because a microversion requirement is not visible in either document.
    #
    # The OAS parameter description said "Set via the Configuration", and that route
    # does work (measured on rdc 0.54.1: a distinctive 1.95 reached the wire twice,
    # 0 406s). It is pinned HERE anyway, for the same reason restdefinition-port.yaml
    # pins it: no chart renders these Configuration singletons, so a
    # Configuration-only route is forgettable at install time -- and this kind is the
    # proof, having been forgotten entirely. 1.109 matches the value the charts and
    # restdefinition-port.yaml use; the floor for this kind is 1.55.
    verbsDescription:
      - action: findby
        method: GET
        path: /v1/deploy_templates
        identifiersMatchPolicy: OR
        headers:
        - name: X-OpenStack-Ironic-API-Version
          value: '1.109'
      - action: get
        method: GET
        path: /v1/deploy_templates/{uuid}
        requestFieldMapping:
        - inPath: uuid
          inCustomResource: spec.name
        headers:
        - name: X-OpenStack-Ironic-API-Version
          value: '1.109'
      - action: create
        method: POST
        path: /v1/deploy_templates
        headers:
        - name: X-OpenStack-Ironic-API-Version
          value: '1.109'
      - action: delete
        method: DELETE
        path: /v1/deploy_templates/{uuid}
        requestFieldMapping:
        - inPath: uuid
          inCustomResource: spec.name
        headers:
        - name: X-OpenStack-Ironic-API-Version
          value: '1.109'
