# RestDefinition for Ironic Port - oasgen-provider generates the Port CRD + controller.
# Apply order:
#   1. kubectl create configmap ironic-port-oas -n openstack --from-file=ironic_port.yaml=../oas/ironic-port.yaml
#   2. kubectl apply -f restdefinition-port.yaml
# Ports have no name (uuid only), so observe uses findby on the `address` (MAC)
# identifier; get/delete address the created uuid from status. No `update` verb
# (Ironic PATCH is JSON-Patch-only).
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-port
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-port-oas/ironic_port.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: Port
    identifiers:
      - address
    additionalStatusFields:
      - uuid
      - node_uuid
    # NO excludedSpecFields, and NO X-Ironic-Endpoint configurationField. Both were
    # here and both were inert; removing them clears two of the eight
    # `reason=SchemaWarnings` generation errors this repo was shipping.
    #
    #   excludedSpecFields: [uuid] -- oasgen builds the spec from the *Create* schema,
    #     and `uuid` is absent from every *Create schema in oas/. So it excluded a field
    #     that was never in the spec. `uuid` is surfaced via additionalStatusFields.
    #   X-Ironic-Endpoint -- declared in ZERO OAS documents. Measured with a control:
    #     the same grep hits X-OpenStack-Ironic-API-Version 6x in oas/ironic-port.yaml.
    #
    # The microversion configurationField below is NOT dead: it is a real OAS parameter,
    # and the route was measured working on rdc 0.54.1 -- a Configuration set to a
    # distinctive 1.95 reached the wire twice, 0 406s. That run was on Port; the other
    # three kinds share the mechanism, not the measurement. Do not remove it with these.
    configurationFields:
      - fromOpenAPI:
          name: X-OpenStack-Ironic-API-Version
          in: header
        fromRestDefinition:
          actions:
            - "*"
    verbsDescription:
      # v2026-11-04: declare the `get` the document ALREADY had.
      #
      # Port was findby-only purely because this verb was never wired up — the
      # document declares get and delete on /v1/ports/{uuid}. Being findby-only
      # is what exposed it to oasgen #378: a findby-addressed kind whose create
      # was interrupted errors indefinitely instead of recreating, because
      # findby can never match a resource that does not exist. With a get, the
      # existence question has a direct answer.
      #
      # Only usable from oasgen/rdc 0.50.0: `uuid` is declared at the PATH-ITEM
      # level in this document, and before #389 path-item parameters were
      # validated but never populated, so the request was refused for an
      # unresolved path parameter.
      - action: get
        method: GET
        path: /v1/ports/{uuid}
        # MAPPED FROM status.uuid, same as `delete` -- added 2026-11-12, and the
        # reason is a measured live defect rather than consistency for its own sake.
        #
        # With NO mapping here, oasgen keeps `{uuid}` as a SPEC property and makes it
        # REQUIRED (a path parameter that no verb maps becomes a spec field --
        # TestPathItemParameters_BecomeSpecFields, and it is a third survival clause
        # distinct from the body declaration and the self-referencing one). Nothing
        # renders it: a Port's uuid is generated by Ironic on POST, so no author can
        # know it before create. Measured on the lab at oasgen 0.59.0:
        #
        #   v1-0-0  served+storage  spec.required=address,configurationRef,node_uuid,uuid
        #   16 live Ports, 0 carrying spec.uuid
        #   a chart-shaped Port WITHOUT spec.uuid -> "spec.uuid: Required value"  REJECTED
        #   CONTROL, the same WITH spec.uuid      -> created (server dry run)     ACCEPTED
        #   re-applying an EXISTING Port without it -> accepted
        #
        # So the 16 live Ports are safe but ANY NEW PORT IS REJECTED -- adding a blade
        # would have failed. (Updates to existing ones pass; the likely mechanism is
        # CRD validation ratcheting, which I have NOT isolated and do not rely on.)
        #
        # This also implements what this file already claimed: the comment above says
        # `get` "is addressed from status.uuid", and it was not -- it was addressed
        # from a spec field nothing sets. Verified by the generator before applying:
        # tests/oasgen-generator/ironic_port_uuid_test.go, both arms in one run --
        #   get UNMAPPED  -> spec.uuid PRESENT, required=true
        #   get MAPPED    -> spec.uuid ABSENT,  required=false
        requestFieldMapping:
          - inPath: uuid
            inCustomResource: status.uuid
        headers:
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
      - action: findby
        method: GET
        path: /v1/ports
        identifiersMatchPolicy: OR
        headers:
          # Pin the microversion as a STATIC per-verb header. DELIBERATE, not a
          # necessity -- CORRECTED 2026-11-11. This used to read "it cannot come
          # from configurationFields above", on oasgen #304 (`header` singular
          # emitted, `headers` plural read). FIXED: 0.44.0 (#304), 0.50.0
          # (#305/#392), control 0.43.0 -- and MEASURED on rdc 0.54.1, where a
          # PortConfiguration set to a distinctive 1.95 reached the wire twice
          # with 0 406s. The static pin stays because no chart renders a
          # PortConfiguration; it is a hand-applied singleton, so a
          # Configuration-only route can be forgotten at install time.
          #
          # TRAP: both routes normally declare the SAME value, so a test of this
          # reads as passing whichever way it is actually wired. Only a value
          # nothing else in the corpus could produce discriminates -- hence 1.95.
          #
          # With no microversion Ironic negotiates its MINIMUM, 1.1, and `pxe_enabled`
          # did not exist until 1.19 — so every port create came back 406 Not
          # Acceptable, and a node with no port then fails deploy with "does not have
          # any port associated with it", three layers from the cause.
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
      - action: create
        method: POST
        path: /v1/ports
        headers:
          # Pin the microversion as a STATIC per-verb header. DELIBERATE, not a
          # necessity -- CORRECTED 2026-11-11. This used to read "it cannot come
          # from configurationFields above", on oasgen #304 (`header` singular
          # emitted, `headers` plural read). FIXED: 0.44.0 (#304), 0.50.0
          # (#305/#392), control 0.43.0 -- and MEASURED on rdc 0.54.1, where a
          # PortConfiguration set to a distinctive 1.95 reached the wire twice
          # with 0 406s. The static pin stays because no chart renders a
          # PortConfiguration; it is a hand-applied singleton, so a
          # Configuration-only route can be forgotten at install time.
          #
          # TRAP: both routes normally declare the SAME value, so a test of this
          # reads as passing whichever way it is actually wired. Only a value
          # nothing else in the corpus could produce discriminates -- hence 1.95.
          #
          # With no microversion Ironic negotiates its MINIMUM, 1.1, and `pxe_enabled`
          # did not exist until 1.19 — so every port create came back 406 Not
          # Acceptable, and a node with no port then fails deploy with "does not have
          # any port associated with it", three layers from the cause.
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
      - action: delete
        method: DELETE
        path: /v1/ports/{uuid}
        headers:
          # Pin the microversion as a STATIC per-verb header. DELIBERATE, not a
          # necessity -- CORRECTED 2026-11-11. This used to read "it cannot come
          # from configurationFields above", on oasgen #304 (`header` singular
          # emitted, `headers` plural read). FIXED: 0.44.0 (#304), 0.50.0
          # (#305/#392), control 0.43.0 -- and MEASURED on rdc 0.54.1, where a
          # PortConfiguration set to a distinctive 1.95 reached the wire twice
          # with 0 406s. The static pin stays because no chart renders a
          # PortConfiguration; it is a hand-applied singleton, so a
          # Configuration-only route can be forgotten at install time.
          #
          # TRAP: both routes normally declare the SAME value, so a test of this
          # reads as passing whichever way it is actually wired. Only a value
          # nothing else in the corpus could produce discriminates -- hence 1.95.
          #
          # With no microversion Ironic negotiates its MINIMUM, 1.1, and `pxe_enabled`
          # did not exist until 1.19 — so every port create came back 406 Not
          # Acceptable, and a node with no port then fails deploy with "does not have
          # any port associated with it", three layers from the cause.
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          - inPath: uuid
            inCustomResource: status.uuid
