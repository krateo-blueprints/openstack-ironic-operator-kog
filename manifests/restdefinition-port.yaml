# RestDefinition for Ironic Port - oasgen-provider generates the Port CRD + controller.
# Apply order:
#   1. kubectl create configmap ironic-port-oas -n openstack --from-file=ironic_port.yaml=../oas/ironic-port.yaml
#   2. kubectl apply -f restdefinition-port.yaml
# Ports have no name (uuid only), so observe uses findby on the `address` (MAC)
# identifier; get/delete address the created uuid from status. No `update` verb
# (Ironic PATCH is JSON-Patch-only).
---
apiVersion: ogen.krateo.io/v1alpha1
kind: RestDefinition
metadata:
  name: ironic-port
  namespace: openstack
spec:
  oasPath: configmap://openstack/ironic-port-oas/ironic_port.yaml
  resourceGroup: baremetal.ogen.krateo.io
  resource:
    kind: Port
    identifiers:
      - address
    additionalStatusFields:
      - uuid
      - node_uuid
    excludedSpecFields:
      - uuid
    configurationFields:
      - fromOpenAPI:
          name: X-Ironic-Endpoint
          in: header
        fromRestDefinition:
          actions:
            - "*"
      - fromOpenAPI:
          name: X-OpenStack-Ironic-API-Version
          in: header
        fromRestDefinition:
          actions:
            - "*"
    verbsDescription:
      - action: findby
        method: GET
        path: /v1/ports
        identifiersMatchPolicy: OR
        headers:
          # Pin the microversion as a STATIC per-verb header. It cannot come from
          # configurationFields above: oasgen emits that property as `header`
          # (singular, from the OAS `in` value) while rest-dynamic-controller reads
          # `headers` (plural), so the lookup misses silently (oasgen #304).
          #
          # With no microversion Ironic negotiates its MINIMUM, 1.1, and `pxe_enabled`
          # did not exist until 1.19 — so every port create came back 406 Not
          # Acceptable, and a node with no port then fails deploy with "does not have
          # any port associated with it", three layers from the cause.
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
      - action: create
        method: POST
        path: /v1/ports
        headers:
          # Pin the microversion as a STATIC per-verb header. It cannot come from
          # configurationFields above: oasgen emits that property as `header`
          # (singular, from the OAS `in` value) while rest-dynamic-controller reads
          # `headers` (plural), so the lookup misses silently (oasgen #304).
          #
          # With no microversion Ironic negotiates its MINIMUM, 1.1, and `pxe_enabled`
          # did not exist until 1.19 — so every port create came back 406 Not
          # Acceptable, and a node with no port then fails deploy with "does not have
          # any port associated with it", three layers from the cause.
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
      - action: delete
        method: DELETE
        path: /v1/ports/{uuid}
        headers:
          # Pin the microversion as a STATIC per-verb header. It cannot come from
          # configurationFields above: oasgen emits that property as `header`
          # (singular, from the OAS `in` value) while rest-dynamic-controller reads
          # `headers` (plural), so the lookup misses silently (oasgen #304).
          #
          # With no microversion Ironic negotiates its MINIMUM, 1.1, and `pxe_enabled`
          # did not exist until 1.19 — so every port create came back 406 Not
          # Acceptable, and a node with no port then fails deploy with "does not have
          # any port associated with it", three layers from the cause.
          - name: X-OpenStack-Ironic-API-Version
            value: "1.109"
        requestFieldMapping:
          - inPath: uuid
            inCustomResource: status.uuid
