# A BaremetalNode whose BMC password comes from a Secret instead of from the CR.
#
# WHY THIS EXISTS. Every other example here carries `driver_info.redfish_password` in
# plaintext. That is survivable in this lab -- the BMC is a sushy-emulator and the
# password is `baremetal` -- and it is the wrong shape to ship as the reference. A
# `secretRef` resolver on the node definition's create and update verbs substitutes the
# value from a Secret in the CR's OWN NAMESPACE at request time, so the CR carries only
# a pointer.
#
# ROTATION. Changing the Secret's content is detected as drift and pushed on the next
# update (oasgen-provider#598). It is the ONLY mechanism that can push a new BMC
# password, and the reason is worth knowing: Ironic answers reads with the literal
# `******`, so restdefinition-node.yaml DELETES the key from the observed body on both
# observe verbs. Without that, spec and response could never converge and RDC re-issued
# the PATCH forever -- 783 of them, measured, before the non-convergence guard tripped.
# With it, response-based drift detection for this field is switched off BY DESIGN, so
# nothing else is watching: before #598 a rotation shipped only if some other spec field
# happened to change, which for a node at steady state is never.
#
# And it cannot be confirmed from the vendor. No client can read back a value Ironic
# refuses to disclose, so a silent failure here looks exactly like success. That is a
# property of a write-only field, not a gap in the feature.
#
# THE POINTER LIVES IN `extra`, WHICH IS DELIBERATE. The resolver's
# nameFromCustomResource/keyFromCustomResource are JSONPaths into the CR, and the CR spec
# is generated from the OAS -- oasgen has `additionalStatusFields` but no spec
# counterpart, so a spec-only property cannot be declared. Ironic's `extra` is a
# free-form object meant for operator metadata, so this needed NO OAS change and
# regenerates NO CRD. Measured, not assumed: the generated spec schema is byte-identical
# with and without the resolver (2264 bytes both), with a control proving the comparison
# can see a difference. See tests/oasgen-generator/ironic_secretref_crd_stability_test.go.
#
# That matters because regenerating the node CRD unserves its previous version and wedges
# every kubernetes-cluster render here until the parent chart's pin moves.
#
# WHAT THIS DOES NOT COVER. The chart path still carries plaintext: `baremetal-host`
# renders a Node CR from values, and the `baremetalhost-*` / `kubernetescluster-*`
# manifests pass `redfish_password` through it. Migrating that needs a chart change, a
# version bump and the parent pin lockstep across four charts, so it is deliberately NOT
# folded in here. This file is the direct-CR reference and the fixture the rotation is
# exercised against.
---
apiVersion: v1
kind: Secret
metadata:
  name: ironic-bmc-blade03
  namespace: openstack
type: Opaque
# COMMITTED ONLY BECAUSE THIS CREDENTIAL IS A THROWAWAY. The BMC here is a
# sushy-emulator and the password is `baremetal`, which already appears in ~20 lab
# manifests in this repo -- so this file adds no exposure. It is NOT the shape to copy
# for a real BMC: there, create the Secret out of band and leave it out of git --
#
#   kubectl -n openstack create secret generic ironic-bmc-blade03 \
#     --from-literal=redfish_password="$REDFISH_PASSWORD"
#
# -- and apply only the BaremetalNode below. The resolver reads the Secret by name at
# request time, so it does not care how the Secret got there.
stringData:
  # Rotating this value is what the resolver detects. The key NAME is what
  # `extra.bmc_secret.key` below points at -- it is not fixed by the definition, because
  # keyFromCustomResource is a path into the CR rather than a literal.
  redfish_password: baremetal
---
apiVersion: baremetal.ogen.krateo.io/v1-0-0
kind: BaremetalNode
metadata:
  name: blade03-secret-bmc
  namespace: openstack
spec:
  # Required. A CR without it is rejected at admission, not at reconcile.
  configurationRef:
    name: ironic-endpoint
    namespace: openstack
  name: blade03-secret-bmc
  driver: redfish
  resource_class: baremetal
  driver_info:
    redfish_address: https://sushy-emulator.openstack.svc:8000
    redfish_system_id: /redfish/v1/Systems/blade03
    redfish_username: admin
    redfish_verify_ca: false
    # NO redfish_password HERE. That is the entire point of this file. The resolver
    # writes it into the outgoing body at request time; a value set here would be sent
    # as-is on verbs that have no resolver, which is the state this example replaces.
  extra:
    # THE POINTER OBJECT. `inCustomResource` on the resolver entries names
    # `spec.extra.bmc_secret` -- this whole object -- so stripResolverSources removes it
    # from the request body before the call goes out, and Ironic never sees the plumbing.
    #
    # It must be the PARENT, not the password's own location. Naming
    # `spec.driver_info.redfish_password` there would make the strip delete the value the
    # resolver had just written, silently -- the field would simply be missing from the
    # body with no error anywhere. `make check` screens for exactly that (check H in
    # scripts/check-restdefinition-shape.py); it was this definition's first shape.
    bmc_secret:
      name: ironic-bmc-blade03
      key: redfish_password
