name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # krateo-blueprints/charts PUBLISHING.md rules 9 and 14. Rule 9: every reusable workflow and the
  # shared chart-push action are pinned by commit SHA with a version comment. Rule 14: no workflow
  # pushes a chart bare -- every uncommented `helm push` / `oras push` is refused, because charts go
  # through chart-push, which survives GHCR's tag read-after-write race. The check also refuses a
  # cross-org `secrets: inherit`, which passes NOTHING across organisations while the called
  # workflow reads every secret as '' and may report success on having done nothing.
  #
  # At 1.2.0 this reported only rule 9. 1.4.0 adds rule 14 and the inherit check, and its summary
  # counts floats, cross-org inherits, shared-action uses and bare pushes beside the unpinned count
  # -- so an exemption that quietly spreads shows up in CI output rather than only in a file.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@ae27682c30cf6a005e03e77bc18a3f9a194db6ed # 1.4.0

  lint-docs:
    uses: krateo-platformops/.github/.github/workflows/lint-docs.yaml@e1d3e99215e80ae56eca4a67e9e061b2c73168b8 # 1.0.0
