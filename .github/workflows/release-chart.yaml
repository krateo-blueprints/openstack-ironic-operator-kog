name: release-chart

# Publishes all four ironic-KOG charts (each at its own Chart.yaml version) to
# oci://ghcr.io/<owner>/charts/<name> on any SemVer tag or manual dispatch. No
# single tag-version guard (the four charts version independently).
#
# It then mirrors the TWO MARKETPLACE BLUEPRINTS -- kubernetes-cluster and
# baremetal-host -- into the Krateo Marketplace's `blueprints` channel, by
# calling krateo-blueprints/charts' reusable publisher with the same bytes the
# OCI job produced. OCI stays the source of truth; the channel republishes it.
#
# The other two charts are deliberately NOT mirrored. baremetal-discovery and
# baremetal-lifecycle are the superseded split that baremetal-host absorbed, and
# they carry no in-chart compositiondefinition.yaml, so the blueprints gate would
# reject them -- correctly. That gate loops over EVERY .tgz in the artifact it is
# given, so the artifact below holds the two blueprints and nothing else: adding
# a fifth chart to `dist` without adding it here is safe, the reverse is not.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: v3.19.0

jobs:
  publish:
    # Gated on the credential check above, so a release is all-or-nothing: see
    # the comment on blueprints-token-preflight for why this inverted.
    needs: blueprints-token-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # FULL HISTORY AND TAGS, REQUIRED. The default is a shallow fetch of the
          # single triggering ref, so at tag time the only tag present is the one
          # being built -- and scripts/check-chart-version-moved.py compares the
          # working tree against the newest EARLIER tag. Measured in the 0.3.9 run,
          # where the shallow checkout made it compare 0.3.9 with itself and print
          #   baremetal-discovery  0.1.3 -> 0.1.3
          # for all four charts, with no "content moved" anywhere: the screen that
          # guards this job was vacuous in the only place it runs.
          #
          # With that screen fixed to skip HEAD's own tags, a shallow checkout now
          # VOIDs instead of passing, which would FAIL this job rather than mislead
          # it. Both halves are needed: the fix makes the failure honest, this makes
          # the comparison possible.
          fetch-depth: 0

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # BEFORE anything is packaged or pushed. Added 2026-11-11 after tag 0.3.7
      # published a broken `kubernetes-cluster` 0.15.2: its bundled
      # compositiondefinition.yaml pinned version "0.15.1" while Chart.yaml said
      # "0.15.2". The `publish-blueprints-channel` gate DID catch it --
      #   kubernetes-cluster 0.15.2: its CompositionDefinition installs version '0.15.1'
      # -- but that gate is a DEPENDENT JOB, so it runs after `helm push` has already
      # succeeded. The artifact exists and cannot be withdrawn; 0.15.3 is the fix.
      #
      # `make check` catches it locally and is entirely offline, so there is no reason
      # for it not to be the first thing this job does. The gate existed; it ran too
      # late, and nobody had run the local one.
      - name: standing screens must pass before anything is packaged or pushed
        run: make check

      - name: helm lint (all charts)
        run: |
          for dir in charts/baremetal-discovery charts/baremetal-host charts/baremetal-lifecycle charts/kubernetes-cluster; do
            helm lint "$dir"
          done

      - name: helm package (all charts)
        run: |
          mkdir -p dist
          for dir in charts/baremetal-discovery charts/baremetal-host charts/baremetal-lifecycle charts/kubernetes-cluster; do
            helm package "$dir" --destination dist
          done

      - name: helm registry login (GHCR)
        # The only pipeline in any workflow here, and it deliberately does NOT
        # set pipefail. Audited 2026-11-04 alongside a `set -e` without pipefail
        # in scripts/create-ironic-oas-configmap.sh, which DID mask a failing
        # left side and was fixed.
        #
        # This one is correct by construction rather than by luck: the only
        # command whose failure matters is the last, and a pipeline's status is
        # already the right side's, so `-e` (the Actions default shell) fails
        # the step when login fails. An empty token does not slip through
        # either — `echo ""` succeeds, helm gets empty input on --password-stdin
        # and login fails. The left side is `echo`, which can only fail on
        # EPIPE, which requires helm to have exited first, which is already
        # nonzero.
        #
        # Left unchanged on purpose: adding pipefail here would guard nothing,
        # and an unexplained line in this repo invites the next reader to work
        # out what it protects and find that it protects nothing.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: helm push (all charts, retry on GHCR flakiness)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for tgz in dist/*.tgz; do
            ok=0
            for attempt in 1 2 3 4 5; do
              helm push "$tgz" "oci://ghcr.io/${owner}/charts" && { ok=1; break; }
              echo "push attempt $attempt failed (GHCR flakiness); retrying in 10s"
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::push of $tgz failed after 5 attempts"; exit 1; }
          done

      - name: Collect the blueprint tarballs (and only those)
        run: |
          set -euo pipefail
          mkdir -p blueprints-dist
          for name in kubernetes-cluster baremetal-host; do
            # One glob per name, resolved explicitly, so a chart that failed to
            # package is a hard error here rather than a silently thinner upload.
            found=0
            for tgz in dist/"$name"-*.tgz; do
              [ -e "$tgz" ] || continue
              cp "$tgz" blueprints-dist/
              found=1
            done
            [ "$found" = 1 ] || { echo "::error::no packaged chart for blueprint '$name'"; exit 1; }
          done
          ls -1 blueprints-dist/

      - name: Upload the blueprint tarballs for the channel publisher
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist-blueprints
          path: blueprints-dist/*.tgz
          if-no-files-found: error

  # A missing token otherwise surfaces from inside the reusable workflow, where
  # the message is about an unauthenticated git push rather than about what is
  # actually wrong. This says it here instead.
  #
  # RUNS BEFORE THE GHCR PUSH, inverted 2026-11-07. It used to carry
  # `needs: publish` with the stated reason that it "does not run until the OCI
  # push -- the source of truth -- has succeeded", so a credential problem could
  # not block the real artifact. That reasoning is coherent and it is wrong under
  # the org publishing standard, which rule 1 states as: a chart that is in GHCR
  # and not in the index IS NOT PUBLISHED, because the Marketplace installs from
  # the index and nothing re-resolves it against GHCR. Checking after the push
  # is precisely how you reach that half-published state -- version in GHCR,
  # absent from the index -- and tag 0.3.0 did exactly that: `publish`
  # succeeded, both charts landed at 0.14.0 / 0.6.3, and the channel job then
  # died on a 401.
  #
  # So the invariant is both or neither, and the cost is accepted: with no valid
  # token a release now produces NOTHING, not even the OCI artifact. Raised by
  # the openstack-as-a-service session against rule 7; being written into the
  # standard as charts#9.
  blueprints-token-preflight:
    runs-on: ubuntu-latest
    steps:
      # PRESENCE IS NOT VALIDITY, and this step learned that the expensive way.
      # It used to test `-n` on the secret only. On 2026-11-07 that passed,
      # `publish` pushed both charts to GHCR, and then the channel job died with
      # `HTTP 401: Bad credentials` -- RELEASE_FEED_TOKEN was set and dead. A
      # check that cannot distinguish a live credential from an expired one is
      # not a preflight; it is a reassurance.
      - name: A publish token must be reachable AND authenticate
        env:
          # Must be the SAME token the publish call uses. When these diverge the
          # preflight validates a credential the publish will not send, which is
          # the presence-is-not-validity defect this job already learned once.
          GH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::CHARTS_PUBLISH_TOKEN is not set. It is now the ONLY credential this release uses for the channel (org publishing standard rule 7) -- the RELEASE_FEED_TOKEN fallback was removed deliberately. Set the ORGANISATION secret CHARTS_PUBLISH_TOKEN at visibility=all: a CLASSIC PAT with the 'repo' scope, since classic tokens have no granular contents:write. See docs/MARKETPLACE.md."
            exit 1
          fi
          which=CHARTS_PUBLISH_TOKEN
          echo "resolved: $which"
          # The publisher writes Releases on THIS repo and gh-pages on
          # krateo-blueprints/charts. A read of each is the cheapest thing that
          # fails on a dead credential; it does NOT prove write scope, and that
          # limit is deliberate -- a preflight should not make writes.
          for repo in "${GITHUB_REPOSITORY}" krateo-blueprints/charts; do
            if ! gh api "repos/$repo" --jq .full_name >/dev/null 2>&1; then
              echo "::error::$which is set but does not authenticate against $repo ('HTTP 401: Bad credentials'). Nothing has been published yet -- this job now runs before the GHCR push. Rotate it. See docs/MARKETPLACE.md."
              exit 1
            fi
          done
          # AND IT MUST SURVIVE BEING PUT IN A URL. Added 2026-11-07 after tag
          # 0.3.1: this preflight passed, `publish` pushed both charts to GHCR,
          # and the publisher then died on
          #   fatal: unable to access 'https://github.com/krateo-blueprints/charts/':
          #          URL rejected: Malformed input to a URL function
          # because it clones with the token in the userinfo of
          #   https://x-access-token:${GH_TOKEN}@github.com/<index repo>
          # `gh api` sends the token as an Authorization HEADER, where trailing
          # whitespace or a newline is tolerated; curl rejects the same bytes
          # inside a URL. So the token was PRESENT, AUTHENTICATED, and unusable.
          #
          # Presence is not validity, and validity in one transport is not
          # validity in another. This step had already learned the first half the
          # expensive way; this is the second.
          case "${GH_TOKEN}" in
            *[[:space:]]*)
              echo "::error::$which contains whitespace or a newline. It authenticates as a header but git rejects it inside a clone URL ('Malformed input to a URL function'), which is how the publisher uses it. Recreate the secret with no trailing newline -- printf '%s' instead of echo, and no copy-paste line break."
              exit 1 ;;
          esac
          # THE git ls-remote GATE WAS REMOVED, 2026-11-08. It embedded the
          # token in a clone URL and refused the release if that failed -- which
          # was exactly right against publisher 1.0.0, and is STRICTER THAN THE
          # TRUTH against 1.0.1: that version puts no token in any URL and
          # authenticates git through gh's credential helper instead (measured:
          # `x-access-token` appears zero times at 36ea357). So a token that is
          # fine for the helper but not URL-safe would have been refused here,
          # producing a release that yields nothing -- not even the OCI artifact,
          # since `publish` depends on this job. /code-review caught that the
          # justification had been fixed upstream by the same commit that wrote
          # it.
          #
          # The whitespace check above stays: it is the ACTUAL failure mode tag
          # 0.3.1 hit, it is cheap, and it is true regardless of which transport
          # the publisher uses.
          echo "$which authenticates against both repositories"

  # Republishes the same bytes into the Marketplace's blueprints channel. The
  # publisher stamps nothing: `krateo.io/source-repo` has to be committed in each
  # Chart.yaml, and without it the chart lands in the index and never gets a card.
  # `make check-blueprints` fails the build if it goes missing.
  publish-blueprints-channel:
    needs:
      # `publish` already depends on blueprints-token-preflight, so naming it
      # here too would be redundant rather than safer.
      - publish
    # Pinned by FULL COMMIT SHA, with the version in the comment, per the org
    # publishing standard (krateo-blueprints/charts PUBLISHING.md rule 9). NOT a
    # moving major tag such as @1: whoever can move that tag could run code with
    # CHARTS_PUBLISH_TOKEN in every caller at once, which is a supply-chain
    # property rather than a convenience one.
    #
    # Verified before pinning, not taken on report:
    #   git ls-remote .../charts 'refs/tags/1.0.1^{}' -> 36ea357cb0fe4b49628cc984d9939babf0049d03
    # (This block described 1.0.0 / a2d63ba for a while after the pin moved to
    #  1.0.1 in fd45819, whose subject was about the chartrepo ConfigMap. A
    #  reader auditing the supply-chain pin would have read a verification of a
    #  SHA that was not in use. /code-review caught it. When Dependabot advances
    #  this pin, this record has to move with it.)
    # and at that SHA the publisher really does contain #6 and #7 --
    # `RELEASES_BASE` is hardcoded to the CHARTS repo's own releases
    # (github.com/krateo-blueprints/charts/releases/download), with zero
    # occurrences derived from `inputs.source_repo`, and the served-index check
    # runs `env -u GH_TOKEN helm pull --repo`, which strips the token so the pull
    # is genuinely anonymous.
    #
    # .github/dependabot.yml advances this; a SHA pin with nothing advancing it
    # is worse than @main because it looks deliberate while going stale.
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@36ea357cb0fe4b49628cc984d9939babf0049d03 # 1.0.1
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
      artifact: charts-dist-blueprints
    secrets:
      # ONE TOKEN, NO FALLBACK -- standard rule 7. The `|| secrets.RELEASE_FEED_TOKEN`
      # fallback that used to be here is gone on purpose: RELEASE_FEED_TOKEN is
      # for the release-notes cross-org feed and is not an index credential, and
      # falling back to it is how a release could publish with a token nobody
      # intended. It is also dead (401 on tag 0.3.0).
      #
      # CONSEQUENCE, accepted: with no valid token a release produces NOTHING,
      # not even the OCI artifact, because `publish` depends on
      # blueprints-token-preflight. This comment used to say the release
      # "reaches GHCR and then fails at the preflight" -- which described the
      # ordering before d3bd4a3 inverted it, and contradicted the job comment
      # 100 lines above on the exact half-published question the inversion was
      # made to settle. /code-review caught it, and a reader lands on this
      # `secrets:` block precisely when the token is the question, which is the
      # worst place for a stale answer.
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN }}

  # Fetch whatever URL the index ACTUALLY advertises, with no credentials. This
  # is the only check in this pipeline that uses the CONSUMER's credentials
  # rather than the publisher's: the portal's Marketplace and `helm` reach the
  # .tgz anonymously, so an index entry can be written, concluded green, and
  # still be unfetchable. It asserts nothing about which host the index names,
  # so it survives krateo-blueprints/charts#6 and anything after it.
  #
  # A DETECTOR, not a gate -- by the time it runs the entry exists and failing
  # this job does not retract it. It makes the failure loud on the first release
  # instead of silent until someone tries to install.
  #
  # A sibling `channel-asset-host-gate` stood here and has been deleted. It
  # refused the publish when the caller was non-public AND the publisher still
  # derived asset URLs from the caller -- written on the false premise that THIS
  # repository is private. It is not: `origin` is
  # krateo-blueprints/openstack-ironic-operator-kog, which is PUBLIC, and that
  # is what `github.repository` resolves to here. The gate could therefore never
  # have fired, which is the worst kind of check to keep. See the retraction in
  # docs/MARKETPLACE.md.
  #
  # krateo-blueprints/charts#7 (the org publishing standard) makes the publisher
  # run this same verification for every caller, with an anonymous
  # `helm pull --repo`. When that lands, this job becomes redundant rather than
  # wrong, and the standard says callers may drop it. Keeping it until then, and
  # arguably after: it checks the served result independently of the publisher's
  # own report of it.
  verify-channel-entry:
    needs: publish-blueprints-channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The URL the index advertises must be fetchable with no credentials
        run: |
          set -euo pipefail
          # PyYAML is needed only by hack/verify-channel-entry.py, to parse the
          # 1.6 MB channel index -- the chart versions below use awk instead.
          #
          # The fallback had to change. `pip install pyyaml` on a runner with an
          # externally-managed Python exits non-zero
          # (error: externally-managed-environment) and, under `set -e`, fails
          # this step with a message about pip rather than about a missing
          # dependency -- killing the only consumer-credentials check in the
          # pipeline. It had never run, because the image ships PyYAML, so the
          # broken branch was invisible. /code-review caught it.
          if ! python3 -c "import yaml" 2>/dev/null; then
            pip install --quiet --break-system-packages pyyaml \
              || pip install --quiet --user pyyaml \
              || { echo "::error::PyYAML is unavailable and could not be installed; hack/verify-channel-entry.py needs it to parse the channel index"; exit 1; }
          fi
          # An ARRAY, expanded quoted. An unquoted "$pairs" string happens to
          # work in bash and silently does not in zsh, where the whole string
          # arrives as one argv entry -- and this script's argparse ACCEPTED
          # that, because the mangled blob still contains an "=". Caught while
          # testing this step by hand on 2026-11-07. Nothing here should depend
          # on which shell splits what.
          pairs=()
          for chart in kubernetes-cluster baremetal-host; do
            # awk, the idiom the Makefile already uses -- no YAML parser needed
            # for a top-level scalar. Verified to give the same answer as the
            # yaml read for both charts before switching.
            ver="$(awk '/^version:/{print $2; exit}' "charts/$chart/Chart.yaml")"
            [ -n "$ver" ] || { echo "::error::no version: line in charts/$chart/Chart.yaml"; exit 1; }
            pairs+=("$chart=$ver")
          done
          python3 hack/verify-channel-entry.py "${pairs[@]}"
