name: release-chart

# Publishes all four ironic-KOG charts (each at its own Chart.yaml version) to
# oci://ghcr.io/<owner>/charts/<name> on any SemVer tag or manual dispatch. No
# single tag-version guard (the four charts version independently).
#
# It then mirrors the TWO MARKETPLACE BLUEPRINTS -- kubernetes-cluster and
# baremetal-host -- into the Krateo Marketplace's `blueprints` channel, by
# calling krateo-blueprints/charts' reusable publisher with the same bytes the
# OCI job produced. OCI stays the source of truth; the channel republishes it.
#
# The other two charts are deliberately NOT mirrored. baremetal-discovery and
# baremetal-lifecycle are the superseded split that baremetal-host absorbed, and
# they carry no in-chart compositiondefinition.yaml, so the blueprints gate would
# reject them -- correctly. That gate loops over EVERY .tgz in the artifact it is
# given, so the artifact below holds the two blueprints and nothing else: adding
# a fifth chart to `dist` without adding it here is safe, the reverse is not.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: v3.19.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint (all charts)
        run: |
          for dir in charts/baremetal-discovery charts/baremetal-host charts/baremetal-lifecycle charts/kubernetes-cluster; do
            helm lint "$dir"
          done

      - name: helm package (all charts)
        run: |
          mkdir -p dist
          for dir in charts/baremetal-discovery charts/baremetal-host charts/baremetal-lifecycle charts/kubernetes-cluster; do
            helm package "$dir" --destination dist
          done

      - name: helm registry login (GHCR)
        # The only pipeline in any workflow here, and it deliberately does NOT
        # set pipefail. Audited 2026-11-04 alongside a `set -e` without pipefail
        # in scripts/create-ironic-oas-configmap.sh, which DID mask a failing
        # left side and was fixed.
        #
        # This one is correct by construction rather than by luck: the only
        # command whose failure matters is the last, and a pipeline's status is
        # already the right side's, so `-e` (the Actions default shell) fails
        # the step when login fails. An empty token does not slip through
        # either — `echo ""` succeeds, helm gets empty input on --password-stdin
        # and login fails. The left side is `echo`, which can only fail on
        # EPIPE, which requires helm to have exited first, which is already
        # nonzero.
        #
        # Left unchanged on purpose: adding pipefail here would guard nothing,
        # and an unexplained line in this repo invites the next reader to work
        # out what it protects and find that it protects nothing.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: helm push (all charts, retry on GHCR flakiness)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for tgz in dist/*.tgz; do
            ok=0
            for attempt in 1 2 3 4 5; do
              helm push "$tgz" "oci://ghcr.io/${owner}/charts" && { ok=1; break; }
              echo "push attempt $attempt failed (GHCR flakiness); retrying in 10s"
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::push of $tgz failed after 5 attempts"; exit 1; }
          done

      - name: Collect the blueprint tarballs (and only those)
        run: |
          set -euo pipefail
          mkdir -p blueprints-dist
          for name in kubernetes-cluster baremetal-host; do
            # One glob per name, resolved explicitly, so a chart that failed to
            # package is a hard error here rather than a silently thinner upload.
            found=0
            for tgz in dist/"$name"-*.tgz; do
              [ -e "$tgz" ] || continue
              cp "$tgz" blueprints-dist/
              found=1
            done
            [ "$found" = 1 ] || { echo "::error::no packaged chart for blueprint '$name'"; exit 1; }
          done
          ls -1 blueprints-dist/

      - name: Upload the blueprint tarballs for the channel publisher
        uses: actions/upload-artifact@v7
        with:
          name: charts-dist-blueprints
          path: blueprints-dist/*.tgz
          if-no-files-found: error

  # A missing token otherwise surfaces from inside the reusable workflow, where
  # the message is about an unauthenticated git push rather than about what is
  # actually wrong. This says it here, and does not run until the OCI push --
  # the source of truth -- has succeeded.
  #
  # It is expected to PASS with no setup: krateo-blueprints is an Organisation
  # (not a user account, as an earlier version of this comment wrongly claimed)
  # and RELEASE_FEED_TOKEN is an org secret at visibility=all. The step now
  # reports WHICH token it resolved, so a green preflight still says which
  # credential a release used.
  blueprints-token-preflight:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # PRESENCE IS NOT VALIDITY, and this step learned that the expensive way.
      # It used to test `-n` on the secret only. On 2026-11-07 that passed,
      # `publish` pushed both charts to GHCR, and then the channel job died with
      # `HTTP 401: Bad credentials` -- RELEASE_FEED_TOKEN was set and dead. A
      # check that cannot distinguish a live credential from an expired one is
      # not a preflight; it is a reassurance.
      - name: A publish token must be reachable AND authenticate
        env:
          GH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN || secrets.RELEASE_FEED_TOKEN }}
          HAVE_REPO_SECRET: ${{ secrets.CHARTS_PUBLISH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::No publish token is reachable. Set a repository secret CHARTS_PUBLISH_TOKEN (a CLASSIC PAT with the 'repo' scope; classic tokens have no granular contents:write), or restore the organisation secret RELEASE_FEED_TOKEN. See docs/MARKETPLACE.md."
            exit 1
          fi
          if [ "${HAVE_REPO_SECRET}" = "true" ]; then which=CHARTS_PUBLISH_TOKEN; else which=RELEASE_FEED_TOKEN; fi
          echo "resolved: $which"
          # The publisher writes Releases on THIS repo and gh-pages on
          # krateo-blueprints/charts. A read of each is the cheapest thing that
          # fails on a dead credential; it does NOT prove write scope, and that
          # limit is deliberate -- a preflight should not make writes.
          for repo in "${GITHUB_REPOSITORY}" krateo-blueprints/charts; do
            if ! gh api "repos/$repo" --jq .full_name >/dev/null 2>&1; then
              echo "::error::$which is set but does not authenticate against $repo. The channel publish will fail with 'HTTP 401: Bad credentials' after the OCI push has already succeeded. Rotate that token, or set a valid CHARTS_PUBLISH_TOKEN on this repository. See docs/MARKETPLACE.md."
              exit 1
            fi
          done
          echo "$which authenticates against both repositories"

  # Republishes the same bytes into the Marketplace's blueprints channel. The
  # publisher stamps nothing: `krateo.io/source-repo` has to be committed in each
  # Chart.yaml, and without it the chart lands in the index and never gets a card.
  # `make check-blueprints` fails the build if it goes missing.
  publish-blueprints-channel:
    needs:
      - publish
      - blueprints-token-preflight
    uses: krateo-blueprints/charts/.github/workflows/publish-chart.yaml@main
    with:
      source_repo: ${{ github.repository }}
      git_tag: ${{ github.ref_name }}
      channel: blueprints
      artifact: charts-dist-blueprints
    secrets:
      # Same resolution the three sibling blueprint repos use
      # (krateo-aws/azure/gcp-blueprint, .github/workflows/release-tag.yaml):
      # a repository secret if one exists, otherwise the ORGANISATION secret
      # RELEASE_FEED_TOKEN, which is visibility=all and therefore already
      # reachable here. Verified 2026-11-06 rather than assumed: none of the
      # three siblings holds a repo-level secret, and krateo-aws-blueprint run
      # 37742845675 shows `publish-blueprints / publish` CONCLUDED SUCCESS --
      # the job itself, not merely a green run with the job skipped.
      PUBLISH_TOKEN: ${{ secrets.CHARTS_PUBLISH_TOKEN || secrets.RELEASE_FEED_TOKEN }}

  # Fetch whatever URL the index ACTUALLY advertises, with no credentials. This
  # is the only check in this pipeline that uses the CONSUMER's credentials
  # rather than the publisher's: the portal's Marketplace and `helm` reach the
  # .tgz anonymously, so an index entry can be written, concluded green, and
  # still be unfetchable. It asserts nothing about which host the index names,
  # so it survives krateo-blueprints/charts#6 and anything after it.
  #
  # A DETECTOR, not a gate -- by the time it runs the entry exists and failing
  # this job does not retract it. It makes the failure loud on the first release
  # instead of silent until someone tries to install.
  #
  # A sibling `channel-asset-host-gate` stood here and has been deleted. It
  # refused the publish when the caller was non-public AND the publisher still
  # derived asset URLs from the caller -- written on the false premise that THIS
  # repository is private. It is not: `origin` is
  # krateo-blueprints/openstack-ironic-operator-kog, which is PUBLIC, and that
  # is what `github.repository` resolves to here. The gate could therefore never
  # have fired, which is the worst kind of check to keep. See the retraction in
  # docs/MARKETPLACE.md.
  #
  # krateo-blueprints/charts#7 (the org publishing standard) makes the publisher
  # run this same verification for every caller, with an anonymous
  # `helm pull --repo`. When that lands, this job becomes redundant rather than
  # wrong, and the standard says callers may drop it. Keeping it until then, and
  # arguably after: it checks the served result independently of the publisher's
  # own report of it.
  verify-channel-entry:
    needs: publish-blueprints-channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The URL the index advertises must be fetchable with no credentials
        run: |
          set -euo pipefail
          # PyYAML is normally present on the runner; do not assume it.
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          # An ARRAY, expanded quoted. An unquoted "$pairs" string happens to
          # work in bash and silently does not in zsh, where the whole string
          # arrives as one argv entry -- and this script's argparse ACCEPTED
          # that, because the mangled blob still contains an "=". Caught while
          # testing this step by hand on 2026-11-07. Nothing here should depend
          # on which shell splits what.
          pairs=()
          for chart in kubernetes-cluster baremetal-host; do
            ver="$(python3 -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['version'])" "charts/$chart/Chart.yaml")"
            pairs+=("$chart=$ver")
          done
          python3 hack/verify-channel-entry.py "${pairs[@]}"
