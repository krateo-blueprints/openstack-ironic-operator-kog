name: release-chart

# Publishes the two Marketplace blueprints -- kubernetes-cluster and baremetal-host,
# each at its own literal Chart.yaml version -- to oci://ghcr.io/krateo-blueprints/charts
# and into the Marketplace's `blueprints` index channel, on any SemVer tag or manual
# dispatch, by calling the organisation's reusable release-oci workflow.
#
# MIGRATED 2026-11-28 (repository standard R5). This file used to carry its own
# lint/package/push, a credential preflight, a mirror into the channel via
# krateo-blueprints/charts' publish-chart.yaml, and a `make check` step in front of the
# push. release-oci does all of that itself, and discovers the charts to publish from
# the layout instead of from a hand-written list, so there is no list here to keep in
# step with charts/ -- which is also why scripts/check-publish-set.py was retired.
#
# A MANUAL RUN IS A REHEARSAL BY DEFAULT: the `dry_run` input defaults to true and is
# passed through, so a tag push publishes and a dispatch builds and checks everything
# and pushes nothing. release-oci takes the release version from `chart_version`, and
# from the git ref when that is empty; it refuses anything that is not X.Y.Z, and a
# dispatch ref is a BRANCH. So the dispatch has a `chart_version` input, passed through
# on a dispatch only: a tag push keeps using the tag. On a rehearsal it names the
# version the run is rehearsing; it never changes what a chart's own Chart.yaml says.
#
# RETIRED 2026-11-25: baremetal-discovery and baremetal-lifecycle, the superseded
# split that baremetal-host absorbed, used to sit in charts/ and be deliberately
# left out of the mirror, because they carry no in-chart compositiondefinition.yaml
# and the blueprints gate rejects them -- correctly. Both were `deprecated: true`
# and both rendered a `kind: Node` that no RestDefinition here declares, so their
# output could never be applied. They are deleted rather than excluded, because the
# exclusion was the only reason this workflow had to hand-pick charts by name, and
# that hand-picking is what blocks adopting the org's release-oci: its index_channel
# is repo-wide and gates EVERY discovered chart before anything is pushed, so one
# gate-failing chart in charts/ would kill the whole release. charts/ now holds
# exactly the two blueprints, which is what that discovery needs.
#
# Their already-published versions are immutable and stay served forever, index
# entries included -- baremetal-lifecycle 0.3.1 among them. Retiring the chart does
# not withdraw them; it stops new ones.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      chart_version:
        description: "The release version this run names, X.Y.Z (a dispatch ref is a branch, which release-preflight refuses). Required in practice."
        type: string
        default: ""
      dry_run:
        description: "Build and check everything, push nothing. Leave true unless you mean to publish."
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  # ONE call replaces what used to be four jobs here (release-preflight,
  # blueprints-token-preflight, publish, publish-blueprints-channel). Its own jobs are
  # index-preflight, verify-images, release-preflight, package-and-push, collect and
  # publish-index; release-preflight runs hack/release-preflight, which still gates the
  # chart versions before anything is pushed.
  #
  # Pinned by FULL COMMIT SHA with the version in the comment, per the org publishing
  # standard (PUBLISHING.md rule 9): this workflow receives the registry credentials and
  # CHARTS_PUBLISH_TOKEN.
  #
  # ONE VERSION OF krateo-platformops/.github PER REPOSITORY. This call, security.yml,
  # lint.yaml and release-notes.yaml all sit at 2.3.2 (ce078932): a shared internal script
  # called at two versions is what that rule exists to prevent. Their workflow_call
  # contracts (inputs, secrets, required-ness) are identical at 5787de78 (2.3.0) and
  # ce078932 (2.3.2), so no `with:` or `secrets:` changed.
  #
  # DELIBERATELY AHEAD OF DEPENDABOT'S COOLDOWN. 2.3.2 was adopted by hand, inside the
  # cooldown window for new releases, because it pins publish-chart at charts 1.14.1,
  # which puts --connect-timeout 10 --max-time 30 on the two curls in publish-chart's wait
  # loop. At charts 1.13.2 they had no timeout, so the loop's 20 x 30s budget bounded only
  # the sleeps: a connection that hung could consume the job timeout and die without
  # printing "the served ${CHANNEL} index still lacks: ...", the one diagnostic the #53
  # fix exists to produce. This repo's next tag is the first real exercise of that loop
  # anywhere (no other caller pins publish-chart at 1.12.0 or later), so it should run
  # with the bounded curl. Do not move any of the four back to "match" an older pin, and
  # do not read the early bump as a mistake to revert.
  #
  # Verify the commit with
  #   git ls-remote https://github.com/krateo-platformops/.github.git 'refs/tags/2.3.2^{}'
  # -- the `^{}` is load-bearing: it peels an annotated tag to the commit.
  #
  # `permissions` is explicit on the CALLING job although the workflow already sets it: a
  # called workflow's permissions are capped at its caller's, and a run that asks for more
  # than the caller grants dies at startup with the reason visible only on the run's web page.
  #
  # `oci_repo` MUST be set: index_channel `blueprints` publishes to
  # oci://ghcr.io/krateo-blueprints/charts and release-oci errors if oci_repo is its default
  # (krateo-platformops'). `chart_root` stays at its default `.`: discovery prunes
  # tests/ (so the probe charts under tests/charts/ are never released) and takes
  # charts/baremetal-host and charts/kubernetes-cluster as first-class.
  release:
    permissions:
      contents: read
      packages: write
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@ce0789323d6a51a9928d574b420a0e57385c1498 # 2.3.2
    with:
      index_channel: blueprints
      oci_repo: oci://ghcr.io/krateo-blueprints/charts
      chart_version: ${{ github.event_name == 'workflow_dispatch' && inputs.chart_version || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      charts_publish_token: ${{ secrets.CHARTS_PUBLISH_TOKEN }}

  # release-oci asserts the set its DISCOVERY found, so a chart discovery misses fails
  # nothing there: what it checks is what it built. This reads the other side -- the
  # packages in the `release-oci-charts` artifact (uploaded on a rehearsal as well as a
  # release) against charts/*/Chart.yaml in the checkout, which does not go through
  # discovery -- and requires them to be the SAME set, versions included. See
  # hack/verify-release-set.py for the verdict's seeding.
  #
  # HOW WE KNOW IT CAN FAIL: `make check` runs `hack/verify-release-set.py --self-test`
  # first (check-release-set-selftest), whose cases include an empty artifact, a missing
  # chart, a version that differs and an extra chart, each required to FAIL, plus a mutation
  # arm that seeds the verdict the wrong way round and requires the empty artifact to then
  # PASS. It has not yet run against a real artifact on a runner.
  verify-release-set:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-oci-charts
          path: built
      - name: The charts release-oci built must be exactly the charts under charts/
        run: python3 -I hack/verify-release-set.py --dist built

  # `verify-channel-entry` stood here until 2026-11-28 and was deleted with
  # hack/verify-channel-entry.py: release-oci 2.3.0 ran publish-chart at charts 1.13.2,
  # which carries krateo-blueprints/charts#53, so the publisher's own anonymous
  # `helm pull` check is no longer vacuous (PUBLISHING.md rule 8, "Callers don't need
  # their own check"). The history is in docs/MARKETPLACE.md.
