apiVersion: v2
name: release-adopt-probe
description: |
  Throwaway chart for measuring core-provider#303: when a composition CR is
  recreated while its previous helm release still exists, does cdc UPGRADE that
  release or INSTALL a second one beside it?

  Deliberately inert. One ConfigMap, no hooks, no Jobs, no external calls, no
  cluster-scoped objects. Nothing here can affect the Ironic fleet.

  NOTE: values.schema.json must NOT set `additionalProperties: false`. Helm
  injects `global`, chart-inspector performs a real dry-run install to derive
  RBAC, and the rejection surfaces as an opaque HTTP 500 rather than a
  validation message (core-provider#325).
type: application
version: 0.1.2
appVersion: "1.0"

# NOT PUBLISHED, and the DIRECTORY is what says so. This chart lives under
# tests/, which the org release workflow's chart discovery prunes by name, so
# there is no publish annotation here to be kept in step with anything -- one
# mechanism, not two. The annotation this replaced named
# scripts/check-publish-set.py as its enforcer; that screen scans charts/ only,
# so from here it would have been read by nothing while still reading as
# load-bearing. A chart moved back under charts/ must declare it again:
# check-publish-set raises VOID for a chart there that declares nothing, and
# flags any name in the workflow's list that is not a chart under charts/.
# A spent instrument: it measured core-provider#303 on both sides of the fix. Kept for reproducibility, never shipped.
