# Example Composition for the baremetal-host blueprint.
# Drives an Ironic bare metal node from `enroll` through inspection to `active` via the
# composition-dynamic-controller generated from the baremetal-host CompositionDefinition.
#
# apiVersion encodes the chart version (0.7.0 -> v0-7-0); Kind is the PascalCase of the
# CD metadata.name (baremetal-host -> BaremetalHost).
#
# Per-resource CRs (BaremetalNode / Port / NodeProvision / NodePower) are rendered by the
# chart at install time; no separate samples/ directory ships with this chart.
#
# REPLACES examples/baremetal-lifecycle, retired 2026-11-25 along with its chart. That
# example used a flat `instance_info` and carried a plaintext BMC password; this one nests
# the image under `spec.image` and takes the password from a Secret.
---
apiVersion: composition.krateo.io/v0-7-0
kind: BaremetalHost
metadata:
  name: baremetal-host
  namespace: krateo-system
spec:
  # Key user input: the node identity. `nodeName` and `driver` are the only required fields.
  nodeName: server-01
  # Where the per-resource CRs land. Defaults to the release namespace when omitted.
  nodeNamespace: openstack
  driver: redfish
  # BMC details passed straight to Ironic for the chosen driver. NOTE there is no
  # redfish_password here: it comes from the Secret named below. Setting both FAILS the
  # render on purpose, so the plaintext cannot sit in the CR looking load-bearing.
  driver_info:
    redfish_address: https://172.19.74.11
    redfish_username: ironic
    redfish_system_id: /redfish/v1/Systems/server-01
    redfish_verify_ca: false
  # The BMC password, read from a Secret in this CR's own namespace by
  # restdefinition-node.yaml's secretRef resolver, so it never reaches values.yaml, the
  # rendered CR, or etcd outside the Secret. Create it with:
  #   kubectl create secret generic server-01-bmc -n openstack \
  #     --from-literal=redfish_password="$REDFISH_PASSWORD"
  bmcSecret:
    name: server-01-bmc
  # PXE NIC(s). nodeUuid is required when ports are declared.
  nodeUuid: 11111111-1111-1111-1111-111111111111
  ports:
    - address: "00:60:2f:32:81:01"
      pxe_enabled: true
  # Inspection and provisioning are one convergent walk in this chart -- this is what the
  # retired baremetal-discovery/baremetal-lifecycle split needed two charts and a manual
  # two-phase `helm upgrade` to do.
  enableInspection: true
  # Image to deploy (available -> active). Omit to stop at `available`.
  image:
    source: "http://172.19.74.1:8089/debian-13-genericcloud-amd64.qcow2"
    checksum: "http://172.19.74.1:8089/CHECKSUM"
  # Power is convergent: the chart re-asserts this on every reconcile rather than firing
  # once, so an out-of-band power change is corrected rather than ignored.
  online: true
