apiVersion: v2
name: baremetal-host
description: Register, inspect, provision and release a physical server through OpenStack Ironic, as one Kubernetes resource. Declare the host's BMC, its NICs and the OS image to deploy; the composition drives Ironic's state machine from enrollment to a running machine and back, and holds it there. Needs a reachable Ironic API (standalone or full OpenStack) -- it does not install one.
type: application

# The chart version IS the served composition apiVersion: 0.6.3 is served as
# composition.krateo.io/v0-6-3. Registering a new version stops the previous one
# being served, so the kubernetes-cluster blueprint's `lifecycleApiVersion` has to
# move in the same step -- `make check-examples` fails the build if it does not.
version: 0.6.3
appVersion: "1.0"

home: https://github.com/krateo-blueprints/openstack-ironic-operator-kog
sources:
  - https://github.com/krateo-blueprints/openstack-ironic-operator-kog
  - https://docs.openstack.org/ironic/latest/

# An absolute https URL serving the image bytes themselves, pinned to a commit.
# publish-chart.yaml's blueprints gate checks only the scheme, so a github.com
# /blob/ URL passes the gate and then renders an empty card -- it serves an HTML
# page, not an SVG. Verified 2026-11-05: 200, content-type image/svg+xml.
icon: "https://raw.githubusercontent.com/krateo-blueprints/openstack-ironic-operator-kog/1516dd678f3c0760557bd1f142db0a67f81b8abd/branding/krateo-akmon-mark.svg"

keywords:
  - bare-metal
  - baremetal
  - ironic
  - openstack
  - provisioning
  - kog
  - krateo
maintainers:
  - name: openstack-ironic-operator-kog
    url: https://github.com/krateo-blueprints/openstack-ironic-operator-kog

annotations:
  # Declares whether .github/workflows/release-chart.yaml publishes this
  # chart. scripts/check-publish-set.py asserts this agrees with the
  # workflow's hand-maintained lint and package lists -- so a new chart
  # that nobody adds to the workflow fails `make check` offline instead of
  # silently never appearing in the registry.
  "krateo.io/publish": "true"
  krateo.io/category: "compute"
  krateo.io/display-name: "Bare-Metal Host (OpenStack Ironic)"
  krateo.io/maturity: "alpha"
  # Load-bearing. The Marketplace adds a card for a live-index chart only when
  # the NEWEST version of its entry carries this annotation (portal's
  # catalogLiveDefs, merged 2026-10-05), so without it the card waits for the
  # next krateo-marketplace-catalog release -- which is not ours to cut -- rather
  # than appearing when the publish lands. It is also what the publisher's
  # collision guard reads to decide who owns the chart name.
  krateo.io/source-repo: "krateo-blueprints/openstack-ironic-operator-kog"
  # VERIFIED 2026-11-06, not inherited. core-provider generated a CRD from
  # `{type: object, x-kubernetes-preserve-unknown-fields: true}` on each of 7
  # boundary versions, installed it on k8s 1.36.4, created a CR with
  # --validate=false so the apiserver prunes, and read it back: unknown fields
  # kept on 2.5.0, 2.7.1, 2.9.2, 2.10.0, 2.10.1, 2.12.0 and 2.13.68, with
  # pruning under a closed object confirmed as the control on 7 of 7.
  #
  # One exposure checked here rather than assumed (plumbing#88): from 2.10.0 on,
  # a node carrying the marker ALONGSIDE `properties` silently loses it. Scanned
  # all six charts/*/values.schema.json -- 151 nodes, 0 carrying the marker at
  # all -- with the scanner calibrated on 8 cases including two that must not
  # fire. So that case cannot arise for these charts.
  #
  # Unmeasured, deliberately recorded: cdc templating from such a field (read
  # from code, not run), the 2.13.64+ values-schema pre-check, and our real
  # schema as opposed to the described shape.
  #
  # Also measured: nothing ENFORCES this annotation. In marketplace, installer,
  # frontend, portal and snowplow the only reader is marketplace's README
  # generator. It is a declaration, not a gate.
  krateoSupportedVersion: ">= 2.5.1"
