# available -> active. ONLY rendered when an image.source is set; without an image the host
# stops at `available` (metal3 calls this "ready").
#
# spec.configdrive carries the cloud-init config drive in the canonical dict form
# {meta_data, user_data, network_data}. This is the documented Ironic path (PUT
# /v1/nodes/{id}/states/provision with `configdrive`); microversion >= 1.60 builds the
# ISO server-side. Do NOT put configdrive on instance_info — Ironic looks up the key
# `configdrive` (no underscore) under instance_info as a secondary path, but the provision
# body is the supported one and avoids stale state after future redeploys.
{{- if .Values.nodeName }}
{{- if not (include "baremetal-host.detached" .) }}
{{/* Do NOT fire deploy when spec.undeploy=true. Without this gate, the chart would loop:
     available -> deploy -> active -> undeploy -> available -> deploy ... forever. The
     undeploy field is a "hold at available" signal; deploy should respect it. */}}
{{/* `(.Values.image).source`, NOT `and (hasKey .Values "image") .Values.image.source`.
     values.yaml ships `image:` with every sub-key COMMENTED OUT, so the key exists
     with a NULL value: hasKey returns true and `.source` then dereferences nil. Go
     templates' `and` is a function, not a short-circuiting operator, so every
     argument is evaluated regardless. The parenthesised form yields nil instead of
     erroring -- the same idiom this chart already uses for
     `(.Values.debug).connectorVerbose`. See the note in NOTES.txt. */}}
{{- if and (eq (include "baremetal-host.provisionState" .) "available") (.Values.image).source (not .Values.undeploy) }}
{{- $configdrive := include "baremetal-host.configdrive" . }}
{{/* v0.5.8: REFUSE to deploy with an empty configdrive when one was expected.

     A deploy fired without `configdrive` writes the image, boots, and reports
     `active` -- correctly, because the image write did succeed -- while the
     machine runs no cloud-init at all. No ssh_pwauth, no packages, no kubeadm,
     nothing. It is indistinguishable from success at every layer that reports:
     Ironic says active, the BaremetalHost says deployed, the composition says
     Ready. Measured on blade01 tonight, the bootstrap control plane:

       blade01  instance_info keys: ['image_checksum','image_source']
       blade04  instance_info keys: ['configdrive','image_checksum',...]

     blade01 had NO configdrive key. It sat `active` with a booted Debian and an
     empty /etc/kubernetes for half an hour while I looked for the cluster.

     It happens because the parent chart gates the BaremetalHost's configDrive
     behind a Helm `lookup` of the PKI Secret, so a render that loses the lookup
     produces an empty configDrive -- and `{{ with $configdrive }}` then quietly
     drops the field instead of refusing to proceed.

     `hasKey .Values "configDrive"` distinguishes "cloud-init was intended and is
     missing" from a deliberate bare-image deploy, which stays allowed. */}}
{{- if and (hasKey .Values "configDrive") (not $configdrive) }}
{{/* Render a marker instead of the transition, so the refusal is VISIBLE.
     A gate that declines silently is how blade01 cost half an hour. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-deploy-blocked" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: baremetal-host
    app.kubernetes.io/instance: {{ .Release.Name }}
    baremetal.ogen.krateo.io/deploy-blocked: "true"
data:
  reason: |
    Deploy NOT fired for node {{ .Values.nodeName }}: spec.configDrive was
    supplied but rendered EMPTY, so the deploy would write the image and boot a
    machine that runs no cloud-init while reporting `active`.
    Most likely cause: the parent chart's configDrive is gated behind a Helm
    `lookup` (the kubeadm PKI Secret) and that lookup did not resolve on the
    render that produced this release. Re-reconcile once the Secret exists.
    This marker disappears on its own when a non-empty configDrive renders.
{{- else }}
apiVersion: {{ include "baremetal-host.nodeApiVersion" . }}
kind: NodeProvision
metadata:
  name: {{ .Release.Name }}-deploy
  namespace: {{ include "baremetal-host.nodeNamespace" . }}
  {{- if (.Values.debug).connectorVerbose }}
  annotations:
    # See values.yaml debug.connectorVerbose. Makes RDC dump the full HTTP exchange
    # with Ironic for this transition, including the faultstring it otherwise drops.
    krateo.io/connector-verbose: "true"
  {{- end }}
  labels:
    app.kubernetes.io/name: baremetal-host
    app.kubernetes.io/instance: {{ .Release.Name }}
    baremetal.ogen.krateo.io/transition: deploy
spec:
  configurationRef:
    name: {{ include "baremetal-host.configName" . }}
    namespace: {{ include "baremetal-host.nodeNamespace" . }}
  node_id: {{ .Values.nodeName | quote }}
  target: active
  {{- with $configdrive }}
  configdrive:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
