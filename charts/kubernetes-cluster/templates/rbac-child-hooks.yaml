# Permissions for the BaremetalHost chart's helm LIFECYCLE HOOKS.
#
# Krateo's chart-inspector derives a composition's RBAC from a helm dry-run
# INSTALL: it takes the set from the tracer and narrows it against
# `rel.GetManifest()`. Helm keeps hooks in `release.Hooks`, NOT in `Manifest`,
# and a dry-run executes none of them — so no hook of any phase ever gets a
# grant. A `pre-delete` hook is the worst case: helm's `before-hook-creation`
# policy tries to DELETE the previous hook object during uninstall, is
# refused, and the uninstall can then never succeed. The BaremetalHost sits
# Terminating behind composition.krateo.io/finalizer forever, and nothing says
# so until the one moment you need teardown to work.
#
# Demonstrated on this chart: baremetal-host's templates/teardown-undeploy.yaml
# renders a ServiceAccount, a Role, a RoleBinding and a Job into one namespace
# in one release. Only the Job carries `helm.sh/hook: pre-delete`. The
# generated Role granted serviceaccounts/roles/rolebindings `*` and nothing at
# all for batch/jobs — three of four, hook annotation the only variable.
#
# Reported to core-provider 2026-11-04; the fix is to union the GVKs of
# `rel.Hooks` (populated at helm install.go:317, before the dry-run returns at
# :364, and phase-agnostic) into the resource set. Until that ships, the
# parent grants what its children's hooks need.
#
# This is not an escalation: the parent composition's own Role holds
# `rbac.authorization.k8s.io/roles: *`, which includes the `escalate` verb, so
# the apiserver's privilege-escalation check is satisfied. Verified with
# `auth can-i escalate roles` as the parent SA.
#
# The subject is version-pinned on purpose. The generated SA is named
# `<plural kind>-<version with dots as dashes>`, so the child chart version
# IS part of the identity: a BaremetalHost release installed at 0.6.1 runs as
# `baremetalhosts-v0-6-1` for its whole life, including its uninstall. Binding
# the version this chart already pins in lifecycleApiVersion is therefore the
# only binding that reaches an in-flight teardown.
{{- $lcNs    := include "kubernetes-cluster.lifecycleNamespace" . -}}
{{- $lcApi   := include "kubernetes-cluster.lifecycleApiVersion" . -}}
{{- $lcVer   := $lcApi | splitList "/" | last -}}
{{- $saNs    := .Values.childServiceAccountNamespace | default "krateo-system" -}}
{{- $saName  := printf "baremetalhosts-%s" $lcVer -}}
{{- if not $lcVer -}}
{{- fail (printf "cannot derive the BaremetalHost service account from lifecycleApiVersion %q" $lcApi) -}}
{{- end -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-child-hooks" .Values.clusterName | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $lcNs | quote }}
  labels:
    app.kubernetes.io/part-of: openstack-ironic-operator-kog
    kubernetescluster.ogen.krateo.io/cluster: {{ .Values.clusterName | quote }}
rules:
  # create: helm runs the pre-delete hook Job.
  # delete: helm's `hook-delete-policy: before-hook-creation` removes the
  #         previous one first. Without this verb the uninstall cannot start,
  #         which is the failure this file exists to prevent.
  # get/list/watch: helm polls the Job to completion before proceeding.
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-child-hooks" .Values.clusterName | trunc 63 | trimSuffix "-" | quote }}
  namespace: {{ $lcNs | quote }}
  labels:
    app.kubernetes.io/part-of: openstack-ironic-operator-kog
    kubernetescluster.ogen.krateo.io/cluster: {{ .Values.clusterName | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-child-hooks" .Values.clusterName | trunc 63 | trimSuffix "-" | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ $saNs | quote }}
