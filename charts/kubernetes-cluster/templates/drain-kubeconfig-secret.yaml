{{/* The Secret the drain Jobs mount, rendered from what the bootstrap CP
     published into Ironic's node.extra and the extra-bridge mirrored onto the
     BaremetalNode CR.

     v0.13.25. Until now the CP POSTed /etc/kubernetes/admin.conf straight to
     the management apiserver at `managementCluster.apiUrl`. That endpoint has
     had no listener since the wg-ironic-proxy pod was deleted for "zero
     proxies", so the Secret never existed and the drain path never ran. The
     credential now travels the same way as kubeadm_join, cert_key, etcd_ip
     and cp_endpoint -- through Ironic, the only rendezvous both sides can see
     -- and it is a drain-scoped ServiceAccount token rather than cluster-admin.

     Fail-closed: renders nothing until the key is present, and drain-jobs.yaml
     already skips when this Secret is absent. So a cluster mid-bootstrap
     renders no drain Jobs rather than Jobs with no credential. */}}
{{- $kc := include "kubernetes-cluster.drainKubeconfig" . -}}
{{- if $kc -}}
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "kubernetes-cluster.workloadKubeconfigSecretName" . | quote }}
  namespace: {{ include "kubernetes-cluster.lifecycleNamespace" . | quote }}
  labels:
    app.kubernetes.io/part-of: openstack-ironic-operator-kog
    kubernetescluster.ogen.krateo.io/cluster: {{ .Values.clusterName | quote }}
data:
  # Already base64 as published to node.extra; a Secret's `data` expects
  # base64, so it passes through rather than being decoded and re-encoded.
  kubeconfig: {{ $kc | quote }}
{{- end }}
