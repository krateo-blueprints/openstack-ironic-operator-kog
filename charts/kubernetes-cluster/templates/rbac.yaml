# Scoped SA + Role + Token Secret used by the CP cloud-init to patch its
# own BaremetalNode CR's spec.extra.kubeadm_join, and to publish the workload
# kubeconfig Secret.
#
# The claim that stood here until v0.13.24 -- "the Role grants ONLY the patch
# verb on a single BaremetalNode CR" -- stopped being true when the Secret rule
# was added below, and nothing flagged the drift because the comment is at the
# top of the file and the rule is at the bottom. Current scope, all of it:
#   * get + patch on the CP BaremetalNode CRs named in controlPlane.nodes[]
#     (restricted by resourceNames; a worker's CR is NOT reachable -- verified
#     with `can-i patch baremetalnodes/<worker>` -> no)
#   * create on secrets (cannot be name-restricted; see below)
#   * get + patch on the one workload-kubeconfig Secret this chart owns
#
# k8s 1.24+ doesn't auto-create tokens for ServiceAccounts; the manually
# crafted Secret below requests one.
{{- $mc     := default (dict) .Values.managementCluster -}}
{{- $saName := $mc.serviceAccountName | default (printf "%s-cp-publisher" .Values.clusterName) -}}
{{- $saNs   := $mc.serviceAccountNamespace | default .Release.Namespace -}}
{{- $cpName := include "kubernetes-cluster.cpNodeName" . -}}
{{- $lcNs   := include "kubernetes-cluster.lifecycleNamespace" . -}}
{{- $cps    := fromYamlArray (include "kubernetes-cluster.cpNodes" .) -}}
{{- $cpNames := list -}}
{{- range $cp := $cps }}{{- $cpNames = append $cpNames $cp.nodeName -}}{{- end -}}
{{- if $cpName -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $saNs | quote }}
  labels:
    app.kubernetes.io/part-of: openstack-ironic-operator-kog
    kubernetescluster.ogen.krateo.io/cluster: {{ .Values.clusterName | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $lcNs | quote }}
rules:
  - apiGroups:
      - baremetal.ogen.krateo.io
    resources:
      - baremetalnodes
    # All CPs in controlPlane.nodes[] are granted patch on their own Node
    # CR's spec.extra (kubeadm_join, and for HA also cert_key). Bootstrap
    # CP needs this in the normal path; replicas need it for cert-key
    # rotation if the 2h TTL expires (any healthy CP can re-upload via
    # `kubeadm init phase upload-certs` and republish).
    resourceNames:
      {{- range $n := $cpNames }}
      - {{ $n | quote }}
      {{- end }}
    verbs:
      - get
      - patch
  # Workload kubeconfig delivery (Milestone 5b). The CP cloud-init POSTs a
  # Secret named <clusterName>-workload-kubeconfig holding its admin.conf, so
  # the drain Jobs can reach the workload apiserver.
  #
  # v0.13.24: this used to be one rule granting `create, get` on ALL secrets in
  # this namespace, with a comment saying `get` was for an idempotency check
  # before POST. Two things were wrong, both found by Trivy KSV-0113 on
  # 2026-11-04 and then confirmed with `kubectl auth can-i`:
  #
  #   1. The script never GETs. It POSTs and, on 409, PATCHes -- and `patch`
  #      was NOT granted. Measured: `can-i patch secrets` -> no. So the
  #      idempotent re-publish path 403'd on every second boot. It had never
  #      run: a first boot POSTs 201 and exits, so only a RE-provision reaches
  #      the 409 branch.
  #   2. The unrestricted `get` covered every Secret here, including
  #      <clusterName>-kubeadm-pki. Measured: `can-i get secrets` -> yes.
  #      Narrower than it looks in practice (a control plane already holds its
  #      own PKI on disk) but the grant was both too wide AND unused.
  #
  # `create` cannot be narrowed by resourceNames -- the object name is not
  # available to authorization on a create -- so it stays unrestricted and is
  # kept in its own rule. get/patch are restricted to the single Secret this
  # chart owns.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ include "kubernetes-cluster.workloadKubeconfigSecretName" . | quote }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName | quote }}
  namespace: {{ $lcNs | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName | quote }}
    namespace: {{ $saNs | quote }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ printf "%s-token" $saName | quote }}
  namespace: {{ $saNs | quote }}
  annotations:
    kubernetes.io/service-account.name: {{ $saName | quote }}
{{- end }}
