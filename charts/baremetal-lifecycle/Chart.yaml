apiVersion: v2
# DEPRECATED 2026-11-08. `baremetal-host` replaces this chart: it absorbed the
# discovery/lifecycle split into one CR per machine for its whole lifecycle.
#
# Why it is deprecated rather than fixed or deleted. Zero live
# BaremetalLifecycle compositions, and its templates/transition-power.yaml still
# documents the FIRE-ONCE NodePower contract -- name-encodes-target, "fires
# exactly once per intent", "a 409 is harmless because the prior CR sits in
# Pending and is never re-fired". NodePower became convergent on 2026-11-07, so
# all three sentences are false. It also omits `spec.configurationRef`, which the
# generated kind marks REQUIRED, so any NodePower it rendered would be rejected
# outright. Fixing it would mean maintaining two implementations of one
# lifecycle; deleting it would leave 0.3.1 installable from the Marketplace
# channel with no source in this repo, and the org publishing standard forbids
# deleting a stored tarball.
#
# `deprecated: true` is Helm's own flag: `helm install` warns, and the
# Marketplace index carries it. 0.3.1 stays published and resolvable.
name: baremetal-lifecycle
deprecated: true
description: Helm chart for Ironic bare metal server provisioning via composition-dynamic-controller. Creates a Node CR + Port CRs (synced by KOG) and per-state NodeProvision CRs that drive Ironic from `enroll` to `active`. Inspection is OUT OF SCOPE. Use `baremetal-host` with `enableInspection=true`, which does both - NOT the sibling `baremetal-discovery` chart, which is also deprecated and has never worked.
type: application
version: 0.3.5
appVersion: "1.0"
icon: "https://raw.githubusercontent.com/krateo-blueprints/openstack-ironic-operator-kog/1516dd678f3c0760557bd1f142db0a67f81b8abd/branding/krateo-akmon-mark.svg"
keywords:
  - compute
  - baremetal
  - ironic
  - provisioning
  - kog
  - bare-metal
  - openstack
  - krateo
maintainers:
  - name: openstack-ironic-operator
annotations:
  # Declares whether .github/workflows/release-chart.yaml publishes this
  # chart. scripts/check-publish-set.py asserts this agrees with the
  # workflow's hand-maintained lint and package lists -- so a new chart
  # that nobody adds to the workflow fails `make check` offline instead of
  # silently never appearing in the registry.
  "krateo.io/publish": "true"
  krateo.io/category: compute
  krateo.io/display-name: Baremetal Lifecycle (Ironic KOG)
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
