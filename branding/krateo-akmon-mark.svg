<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="t d">
  <title id="t">Krateo Akmon mark</title>
  <desc id="d">A Greek capital alpha for Akmon, whose crossbar is the face and
  body of an anvil. The band carries the temper colours of worked steel.</desc>
  <defs>
    <linearGradient id="akmon-temper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0C04E"/>
      <stop offset="1" stop-color="#C9733A"/>
    </linearGradient>
  </defs>
  <g transform="translate(0,2)">
    <path d="M28,8 L36,8 L54,52 L45,52 L31,16 L17,52 L8,52 Z" fill="#1B2430"/>
    <path d="M5,29 L59,29 L59,36.5 L48,36.5 L46,46 L18,46 L16,36.5 L5,36.5 Z"
          fill="url(#akmon-temper)"/>
  </g>
</svg>
