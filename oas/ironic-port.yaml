# Minimal OpenAPI 3.0 spec for the Ironic Port resource (CRUD, no update).
# A Port is a physical NIC on a bare-metal Node (by MAC), used for PXE/Neutron
# attachment. Ports are addressed by uuid only, so observe uses findby on the
# `address` (MAC) identifier and get/delete use the created uuid.
# Ref: https://docs.openstack.org/api-ref/baremetal/#ports-ports
openapi: 3.0.3
info:
  title: Ironic Bare Metal Port API
  description: Minimal spec for Port CRUD (no in-place update - Ironic PATCH is JSON-Patch only).
  version: 1.0.0
servers:
  - url: http://ironic.openstack.svc.cluster.local:6385
    description: Ironic API (override via PortConfiguration)
# Applies the apiKey scheme defined under components. The token itself comes from the
# <Kind>Configuration's spec.authentication.apiKey.tokenRef; where no tokenRef is
# configured (the local standalone Ironic runs noauth) no header is sent, so the same
# document serves both the noauth local env and a Keystone-protected real Ironic.
security:
  - apiKey: []

paths:
  /v1/ports:
    get:
      summary: List ports
      operationId: listPorts
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: List of ports
          content:
            application/json:
              schema:
                type: object
                properties:
                  ports:
                    type: array
                    items:
                      $ref: '#/components/schemas/Port'
    post:
      summary: Create port
      operationId: createPort
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortCreate'
      responses:
        '201':
          description: Created port
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Port'
  /v1/ports/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get port by UUID
      operationId: getPort
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: Port details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Port'
        '404':
          description: Port not found
    delete:
      summary: Delete port
      operationId: deletePort
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '204':
          description: Port deleted
        '404':
          description: Port not found
components:
  # Keystone token, sent verbatim as X-Auth-Token (NOT a Bearer token).
  # Needs oasgen >= 0.19.0 for apiKey, and >= 0.26.1 so the verbose request dump redacts
  # credential headers rather than printing X-Auth-Token in cleartext.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    X-OpenStack-Ironic-API-Version:
      name: X-OpenStack-Ironic-API-Version
      in: header
      required: false
      # NOT supplied via PortConfiguration, despite what this description used to
      # say. oasgen emits this parameter as `header` (SINGULAR, from the OAS `in`
      # value) while rest-dynamic-controller looks up `headers` (PLURAL), so the
      # lookup misses and a value set in the Configuration is dropped with NO
      # error -- the request simply goes out without the header, and Ironic then
      # negotiates its MINIMUM microversion (1.1) rather than failing.
      #
      # The microversion is pinned instead as a static per-verb `headers:` entry on
      # every verb in manifests/restdefinition-port.yaml, which takes a different
      # code path and does ship. Change it there, not here.
      #
      # Kept `required: false` with no default deliberately: a `default` in a
      # generated CRD is materialised onto existing CRs by the apiserver and cannot
      # be taken back, so it is only worth doing where the spec property is the
      # delivery mechanism (ironic-provision.yaml, ironic-power.yaml), which here
      # it is not.
      description: >-
        Ironic API microversion, required for writes. Delivered as a static
        per-verb header by the RestDefinition, not through this parameter --
        see the comment above before changing it.
      schema:
        type: string
  schemas:
    Port:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        address:
          type: string
          description: MAC address of the NIC.
        node_uuid:
          type: string
          description: UUID of the Node this port belongs to.
        portgroup_uuid:
          type: string
        pxe_enabled:
          type: boolean
        physical_network:
          type: string
        local_link_connection:
          type: object
          additionalProperties: true
        extra:
          type: object
          additionalProperties: true
    PortCreate:
      type: object
      required:
        - address
        - node_uuid
      properties:
        address:
          type: string
        node_uuid:
          type: string
        portgroup_uuid:
          type: string
        pxe_enabled:
          type: boolean
        physical_network:
          type: string
        local_link_connection:
          type: object
          additionalProperties: true
        extra:
          type: object
          additionalProperties: true
