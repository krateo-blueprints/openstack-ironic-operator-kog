# Minimal OpenAPI 3.0 spec for the Ironic Node power action.
# Models PUT /v1/nodes/{node_id}/states/power as a KOG "create" (fire-once via 202),
# same shape as ironic-provision.yaml. One NodePower CR per intended target.
# Ref: https://docs.openstack.org/api-ref/baremetal/#change-node-power-state
openapi: 3.0.3
info:
  title: Ironic Node Power
  description: Power-state transitions for a bare metal node
  version: 1.0.0

servers:
  - url: http://ironic.openstack.svc.cluster.local:6385
    description: Ironic API (proxied by keystone-ironic-proxy)

# Applies the apiKey scheme defined under components. The token itself comes from the
# <Kind>Configuration's spec.authentication.apiKey.tokenRef; where no tokenRef is
# configured (the local standalone Ironic runs noauth) no header is sent, so the same
# document serves both the noauth local env and a Keystone-protected real Ironic.
security:
  - apiKey: []

paths:
  /v1/nodes:
    get:
      summary: List nodes (findby — matched on node_id, lifted from `name` by a responseTransform)
      operationId: listNodes
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: List of nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeState'

  /v1/nodes/{node_id}/states/power:
    put:
      summary: Set power target (create = fire-once transition)
      operationId: setPowerState
      parameters:
        - $ref: '#/components/parameters/node_id'
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerTarget'
      responses:
        '202':
          description: Accepted (async; empty body)

components:
  # Keystone token, sent verbatim as X-Auth-Token (NOT a Bearer token).
  # Needs oasgen >= 0.19.0 for apiKey, and >= 0.26.1 so the verbose request dump redacts
  # credential headers rather than printing X-Auth-Token in cleartext.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    X-OpenStack-Ironic-API-Version:
      name: X-OpenStack-Ironic-API-Version
      in: header
      # Added 2026-11-04. Provision and power were the only kinds sending NO
      # microversion, so Ironic negotiated its MINIMUM (1.1) for them while
      # BaremetalNode and Port were pinned at 1.109. Measured consequence: the
      # findby's `include_children=true` (needs >= 1.83) returned
      #   406 "Request not acceptable. The minimal required API version should be 1.83"
      # on EVERY Observe from 2026-10-30, silently, because no transition
      # happened to be needed in that window.
      #
      # required + default, NOT optional-and-set-via-Configuration: RDC applies
      # the Configuration's authentication but does not send
      # spec.configuration.header, so a header declared there never reaches the
      # wire. Same reasoning as ironic-node.yaml, which has carried this since
      # 2026-10-29. The default is what the apiserver stamps onto every CR, so
      # no chart change is needed to supply it.
      required: true
      description: >-
        Ironic API microversion. Pinned here because an unset value silently
        degrades to Ironic's minimum (1.1) instead of failing.
      schema:
        type: string
        default: '1.109'
    node_id:
      name: node_id
      in: path
      required: true
      description: Node UUID or name
      schema:
        type: string
  schemas:
    PowerTarget:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          description: "power on | power off | rebooting | soft power off | soft rebooting"
        timeout:
          type: integer
          description: Seconds to wait for the BMC to confirm (optional, Ironic-default if omitted).
    NodeState:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        power_state:
          type: string
          readOnly: true
        target_power_state:
          type: string
          readOnly: true
