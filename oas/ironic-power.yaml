# Minimal OpenAPI 3.0 spec for the Ironic Node power action.
# Models PUT /v1/nodes/{node_id}/states/power as a KOG "create" (fire-once via 202),
# same shape as ironic-provision.yaml. One NodePower CR per intended target.
# Ref: https://docs.openstack.org/api-ref/baremetal/#change-node-power-state
openapi: 3.0.3
info:
  title: Ironic Node Power
  description: Power-state transitions for a bare metal node
  version: 1.0.0

servers:
  - url: http://ironic.openstack.svc.cluster.local:6385
    # Deliberately says nothing about HOW this endpoint is reached. The Service
    # may be backed by an in-cluster Ironic, by an EndpointSlice pointing across
    # a VPN, or by a proxy -- that is environment configuration and this
    # document must not encode it. The keystone-ironic-proxy this once named was
    # deleted on 2026-11-04; auth now comes from the Configuration CR.
    description: Ironic API

# Applies the apiKey scheme defined under components. The token itself comes from the
# <Kind>Configuration's spec.authentication.apiKey.tokenRef; where no tokenRef is
# configured (the local standalone Ironic runs noauth) no header is sent, so the same
# document serves both the noauth local env and a Keystone-protected real Ironic.
security:
  - apiKey: []

paths:
  /v1/nodes:
    get:
      summary: List nodes (findby — matched on node_id, lifted from `name` by a responseTransform)
      operationId: listNodes
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: List of nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeStateListItem'

  # ADDED 2026-11-11. This path was MISSING while restdefinition-power.yaml declared a
  # `get` verb on it, so that verb could not resolve a schema and was inert. oasgen said
  # so, in status.schemaWarnings, on the live object -- and nothing in this repo had ever
  # read that field:
  #
  #   generation error: path '/v1/nodes/{node_id}' set in RestDefinition not found in OAS
  #   validation error: could not extract base schema for action 'get':
  #                     path '/v1/nodes/{node_id}' not found in OAS document   (x3)
  #
  # Why it matters more than a dangling verb. oasgen also warns, for this kind AND for
  # provision, that the findby identifier can never match:
  #
  #   identifier "node_id" is absent from the items the findby response carries, so
  #   findby cannot compare against it. no declared identifier is present in the findby
  #   response, so findby can never match any item regardless of policy: it will report
  #   not-found and the reconciler acts on not-found by CREATING
  #
  # That is the §9.14 blade06 NodePower wedge, stated by the tool. A working `get` is the
  # fix -- it is exactly why restdefinition-port.yaml gained one (oasgen #378: a
  # findby-addressed kind whose create was interrupted errors forever, because findby can
  # never match a resource that does not exist). Here the fix pointed at a path the
  # document did not contain, so the repair path was instrumented and could not fire.
  #
  # The parameter is `node_id`, NOT `uuid`: Ironic's node_ident accepts a UUID or a name,
  # restdefinition-power.yaml maps `inPath: node_id` from `spec.node_id`, and
  # oas/ironic-node.yaml spells the same endpoint `/v1/nodes/{uuid}` for its own kind.
  # Two spellings of one Ironic endpoint across two documents is confusing but correct:
  # each document's path must match what its own RestDefinition declares.
  /v1/nodes/{node_id}:
    parameters:
      - $ref: '#/components/parameters/node_id'
    get:
      summary: Get a node by UUID or name, for the power kind's existence check
      operationId: getNodeForPower
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: Node power state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeState'
        '404':
          description: Node not found
  /v1/nodes/{node_id}/states/power:
    put:
      summary: Set power target (create = fire-once transition)
      operationId: setPowerState
      parameters:
        - $ref: '#/components/parameters/node_id'
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PowerTarget'
      responses:
        '202':
          description: Accepted (async; empty body)

components:
  # Keystone token, sent verbatim as X-Auth-Token (NOT a Bearer token).
  # Needs oasgen >= 0.19.0 for apiKey, and >= 0.26.1 so the verbose request dump redacts
  # credential headers rather than printing X-Auth-Token in cleartext.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    X-OpenStack-Ironic-API-Version:
      name: X-OpenStack-Ironic-API-Version
      in: header
      # Added 2026-11-04. Provision and power were the only kinds sending NO
      # microversion, so Ironic negotiated its MINIMUM (1.1) for them while
      # BaremetalNode and Port were pinned at 1.109. Measured consequence: the
      # findby's `include_children=true` (needs >= 1.83) returned
      #   406 "Request not acceptable. The minimal required API version should be 1.83"
      # on EVERY Observe from 2026-10-30, silently, because no transition
      # happened to be needed in that window.
      #
      # required + default, NOT optional-and-set-via-Configuration: RDC applies
      # the Configuration's authentication but does not send
      # spec.configuration.header, so a header declared there never reaches the
      # wire. Same reasoning as ironic-node.yaml, which has carried this since
      # 2026-10-29. The default is what the apiserver stamps onto every CR, so
      # no chart change is needed to supply it.
      required: true
      description: >-
        Ironic API microversion. Pinned here because an unset value silently
        degrades to Ironic's minimum (1.1) instead of failing.
      schema:
        type: string
        default: '1.109'
    node_id:
      name: node_id
      in: path
      required: true
      description: Node UUID or name
      schema:
        type: string
  schemas:
    # THE LIST RESPONSE. MEASURED /v1/nodes at microversion 1.109 on two independent
    # clusters: ['instance_uuid','links','maintenance','name','power_state',
    # 'provision_state','uuid'] -- 7 keys, and NO target_*_state. The single-node GET
    # returns 69 and does include it, which is why this had to become its own schema
    # rather than a narrowing of the shared one.
    #
    # `NodeState` previously served BOTH responses, so this document claimed the list carries
    # target_power_state. It does not. The RestDefinition agreed with the document, so the
    # two were consistent with each other and both wrong about Ironic.
    NodeStateListItem:
      type: object
      properties:
        name:
          type: string
        power_state:
          type: string
        uuid:
          type: string
    PowerTarget:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          description: "power on | power off | rebooting | soft power off | soft rebooting"
        timeout:
          type: integer
          description: Seconds to wait for the BMC to confirm (optional, Ironic-default if omitted).
    NodeState:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        power_state:
          type: string
          readOnly: true
        target_power_state:
          type: string
          readOnly: true
