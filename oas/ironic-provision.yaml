# Minimal OpenAPI 3.0 spec for the Ironic Node provisioning action.
# Models PUT /v1/nodes/{node_id}/states/provision as a KOG "create" (fire-once via 202),
# with GET /v1/nodes/{node_id} and GET /v1/nodes for observe (get/findby).
# Ref: https://docs.openstack.org/api-ref/baremetal/#change-node-provision-state
openapi: 3.0.3
info:
  title: Ironic Node Provisioning
  description: Provision-state transitions for a bare metal node (one CR per transition)
  version: 1.0.0

servers:
  - url: http://ironic.openstack.svc.cluster.local:6385
    description: Ironic API (standalone, noauth; nginx sidecar injects the microversion)

# Applies the apiKey scheme defined under components. The token itself comes from the
# <Kind>Configuration's spec.authentication.apiKey.tokenRef; where no tokenRef is
# configured (the local standalone Ironic runs noauth) no header is sent, so the same
# document serves both the noauth local env and a Keystone-protected real Ironic.
security:
  - apiKey: []

paths:
  /v1/nodes:
    get:
      summary: List nodes (findby)
      operationId: listNodes
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: List of nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeStateListItem'

  /v1/nodes/{node_id}/states/provision:
    put:
      summary: Set provision target (create = fire-once transition)
      operationId: setProvisionState
      parameters:
        - $ref: '#/components/parameters/node_id'
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTarget'
      responses:
        '202':
          description: Accepted (async; empty body)

components:
  # Keystone token, sent verbatim as X-Auth-Token (NOT a Bearer token).
  # Needs oasgen >= 0.19.0 for apiKey, and >= 0.26.1 so the verbose request dump redacts
  # credential headers rather than printing X-Auth-Token in cleartext.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    X-OpenStack-Ironic-API-Version:
      name: X-OpenStack-Ironic-API-Version
      in: header
      # Added 2026-11-04. Provision and power were the only kinds sending NO
      # microversion, so Ironic negotiated its MINIMUM (1.1) for them while
      # BaremetalNode and Port were pinned at 1.109. Measured consequence: the
      # findby's `include_children=true` (needs >= 1.83) returned
      #   406 "Request not acceptable. The minimal required API version should be 1.83"
      # on EVERY Observe from 2026-10-30, silently, because no transition
      # happened to be needed in that window.
      #
      # required + default, NOT optional-and-set-via-Configuration: RDC applies
      # the Configuration's authentication but does not send
      # spec.configuration.header, so a header declared there never reaches the
      # wire. Same reasoning as ironic-node.yaml, which has carried this since
      # 2026-10-29. The default is what the apiserver stamps onto every CR, so
      # no chart change is needed to supply it.
      required: true
      description: >-
        Ironic API microversion. Pinned here because an unset value silently
        degrades to Ironic's minimum (1.1) instead of failing.
      schema:
        type: string
        default: '1.109'
    node_id:
      name: node_id
      in: path
      required: true
      description: Node UUID or name
      schema:
        type: string
  schemas:
    # THE LIST RESPONSE. MEASURED /v1/nodes at microversion 1.109 on two independent
    # clusters: ['instance_uuid','links','maintenance','name','power_state',
    # 'provision_state','uuid'] -- 7 keys, and NO target_*_state. The single-node GET
    # returns 69 and does include it, which is why this had to become its own schema
    # rather than a narrowing of the shared one.
    #
    # `NodeState` previously served BOTH responses, so this document claimed the list carries
    # target_provision_state. It does not. The RestDefinition agreed with the document, so the
    # two were consistent with each other and both wrong about Ironic.
    NodeStateListItem:
      type: object
      properties:
        name:
          type: string
        provision_state:
          type: string
        uuid:
          type: string
    ProvisionTarget:
      type: object
      required:
        - target
      properties:
        target:
          type: string
          description: "manage | provide | active | deleted | inspect | rebuild | clean"
        configdrive:
          type: object
          additionalProperties: true
        clean_steps:
          # Required when target=clean. Each step is {interface, step, args?}. interface is
          # one of raid, bios, deploy, management. step is the operation name (e.g.
          # raid/create_configuration, bios/apply_configuration). args is a per-step dict.
          # Source: https://docs.openstack.org/api-ref/baremetal/?expanded=#change-node-provision-state
          type: array
          items:
            type: object
            additionalProperties: true
    NodeState:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        provision_state:
          type: string
          readOnly: true
        target_provision_state:
          type: string
          readOnly: true
