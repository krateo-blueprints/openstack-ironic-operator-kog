# Minimal OpenAPI 3.0 spec for the Ironic Portgroup resource (CRUD, no update).
# A Portgroup bonds several Ports of a Node (LACP/active-backup). Addressed by
# uuid or name; observe maps {uuid}<-spec.name (Ironic resolves name as ident).
# Ref: https://docs.openstack.org/api-ref/baremetal/#portgroups-portgroups
openapi: 3.0.3
info:
  title: Ironic Bare Metal Portgroup API
  description: Minimal spec for Portgroup CRUD (no in-place update - Ironic PATCH is JSON-Patch only).
  version: 1.0.0
servers:
  - url: http://ironic.openstack.svc.cluster.local:6385
    description: Ironic API (override via PortGroupConfiguration)
# Applies the apiKey scheme defined under components. The token itself comes from the
# <Kind>Configuration's spec.authentication.apiKey.tokenRef; where no tokenRef is
# configured (the local standalone Ironic runs noauth) no header is sent, so the same
# document serves both the noauth local env and a Keystone-protected real Ironic.
security:
  - apiKey: []

paths:
  /v1/portgroups:
    get:
      summary: List portgroups
      operationId: listPortgroups
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: List of portgroups
          content:
            application/json:
              schema:
                type: object
                properties:
                  portgroups:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortgroupListItem'
    post:
      summary: Create portgroup
      operationId: createPortgroup
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortgroupCreate'
      responses:
        '201':
          description: Created portgroup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portgroup'
  /v1/portgroups/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get portgroup by ident
      operationId: getPortgroup
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '200':
          description: Portgroup details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portgroup'
        '404':
          description: Portgroup not found
    delete:
      summary: Delete portgroup
      operationId: deletePortgroup
      parameters:
        - $ref: '#/components/parameters/X-OpenStack-Ironic-API-Version'
      responses:
        '204':
          description: Portgroup deleted
        '404':
          description: Portgroup not found
components:
  # Keystone token, sent verbatim as X-Auth-Token (NOT a Bearer token).
  # Needs oasgen >= 0.19.0 for apiKey, and >= 0.26.1 so the verbose request dump redacts
  # credential headers rather than printing X-Auth-Token in cleartext.
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Auth-Token
  parameters:
    X-OpenStack-Ironic-API-Version:
      name: X-OpenStack-Ironic-API-Version
      in: header
      required: false
      description: Ironic API microversion (required for writes). Floor 1.23 for portgroups. PINNED STATICALLY per verb in manifests/restdefinition-portgroup.yaml at 1.109; a PortGroupConfiguration can also supply it, and both routes work, but the static pin is what ships because no chart renders that singleton. At the 1.1 default a POST here returns 404 -- measured 2026-11-12.
      schema:
        type: string
  schemas:
    # THE LIST RESPONSE, WHICH IS NOT THE SINGLE-ITEM RESPONSE.
    #
    # MEASURED at microversion 1.109 on two independent clusters, with the
    # single-item GET as the control each time: this collection returns 4 keys
    # against the item's 15. Before 2026-11-13 the collection reused
    # `Portgroup`, so this document claimed the list carries the whole object --
    # and the RestDefinition agreed with it, so the two documents were
    # consistent with each other and both wrong about Ironic. No
    # document-to-document screen can catch that; only a live measurement or
    # the vendor's source can.
    #
    # It matters because check-restdefinition-shape.py decides findby
    # matchability from THIS schema. An identifier declared here but absent
    # from the real response would be cleared as readable while findby could
    # never match on it. Every identifier this repo declares happens to be
    # within the measured set, which is luck, not design.
    PortgroupListItem:
      type: object
      properties:
        address:
          type: string
        links:
          type: array
          items:
            type: object
            additionalProperties: true
        name:
          type: string
        uuid:
          type: string
    Portgroup:
      type: object
      properties:
        uuid:
          type: string
          readOnly: true
        name:
          type: string
        node_uuid:
          type: string
        address:
          type: string
          description: MAC address of the portgroup.
        mode:
          type: string
          description: Bond mode (e.g. active-backup, 802.3ad).
        standalone_ports_supported:
          type: boolean
        properties:
          type: object
          additionalProperties: true
        extra:
          type: object
          additionalProperties: true
    PortgroupCreate:
      type: object
      required:
        - node_uuid
      properties:
        name:
          type: string
        node_uuid:
          type: string
        address:
          type: string
        mode:
          type: string
        standalone_ports_supported:
          type: boolean
        properties:
          type: object
          additionalProperties: true
        extra:
          type: object
          additionalProperties: true
